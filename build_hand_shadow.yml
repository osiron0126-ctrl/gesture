                    orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL
                    setPadding(32, 32, 32, 32); setBackgroundColor(Color.rgb(17,17,17))
                }
                fun label(s: String, size: Float = 16f) = TextView(this).apply {
                    text = s; textSize = size; setTextColor(Color.WHITE); setPadding(0,18,0,18)
                    root.addView(this)
                }
                label("SC Hand Gesture", 28f)
                label("by sc\n\n카메라 앞에서 손바닥을 펴고 움직이세요.\n→ 다음 페이지 · ← 이전 페이지\n↑ 아래 내용 보기 · ↓ 위 내용 보기\n\n한 번 동작한 뒤 손을 0.4초 접거나, 카메라 밖으로 0.8초 뺐다가 다시 펴세요.\nSTART 후 원하는 앱을 직접 여세요.")
                status = label("")
                fun button(s: String, block: () -> Unit) { root.addView(Button(this).apply {
                    text = s; setOnClickListener { block() }
                }) }
                button("1. 카메라·알림 권한") {
                    permission.launch(if (Build.VERSION.SDK_INT >= 33) arrayOf(Manifest.permission.CAMERA, Manifest.permission.POST_NOTIFICATIONS) else arrayOf(Manifest.permission.CAMERA))
                }
                button("2. 접근성 서비스 켜기") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                button("START") {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                        permission.launch(arrayOf(Manifest.permission.CAMERA))
                    } else if (GestureAccessibilityService.instance == null) {
                        Toast.makeText(this,"접근성 서비스를 먼저 켜주세요.",Toast.LENGTH_LONG).show()
                        startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                    } else {
                        runCatching { ContextCompat.startForegroundService(this, Intent(this, GestureCameraService::class.java)) }
                            .onFailure { RuntimeState.message = "시작 실패: ${it.message}" }
                    }
                    updateStatus()
                }
                button("STOP") { stopService(Intent(this, GestureCameraService::class.java)); updateStatus() }
                fun toggle(key: String, s: String, default: Boolean = false) {
                    root.addView(Switch(this).apply {
                        text = s; setTextColor(Color.WHITE); isChecked = prefs.getBoolean(key, default)
                        setOnCheckedChangeListener { _, checked -> prefs.edit().putBoolean(key, checked).apply() }
                    })
                }
                toggle("swipe", "좌우: 탭 대신 스와이프")
                toggle("reverseX", "좌우 방향 반전")
                toggle("reverseY", "상하 방향 반전")
                toggle("shadow", "손 그림자 표시", true)
                fun slider(key: String, title: String, default: Int) {
                    val text = label("$title: ${prefs.getInt(key, default)}")
                    root.addView(SeekBar(this).apply {
                        max = 100; progress = prefs.getInt(key, default)
                        setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                            override fun onProgressChanged(v: SeekBar?, n: Int, fromUser: Boolean) {
                                text.text = "$title: $n"; prefs.edit().putInt(key,n).apply()
                            }
                            override fun onStartTrackingTouch(v: SeekBar?) = Unit
                            override fun onStopTrackingTouch(v: SeekBar?) = Unit
                        })
                    })
                }
                slider("sensitivity", "민감도 (높을수록 작은 움직임)", 50)
                slider("distance", "스크롤 거리", 50)
                label("화면 잠금 시 인식을 중지합니다.\n접근성은 손동작에 따른 탭·스와이프에 사용됩니다. 영상은 기기에서 처리하며 저장·전송하지 않습니다.")
                val scroll = ScrollView(this).apply { addView(root) }
                setContentView(scroll)
                ViewCompat.setOnApplyWindowInsetsListener(scroll) { v, insets ->
                    val b = insets.getInsets(WindowInsetsCompat.Type.systemBars())
                    v.setPadding(b.left,b.top,b.right,b.bottom); insets
                }
            }
            override fun onResume() { super.onResume(); handler.post(refresh) }
            override fun onPause() { handler.removeCallbacks(refresh); super.onPause() }
            private fun updateStatus() {
                if (!::status.isInitialized) return
                val camera = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                val receiving = RuntimeState.running && SystemClock.uptimeMillis() - RuntimeState.lastFrame < 2000
                status.text = "카메라 권한: ${if(camera) "허용" else "필요"}\n접근성 연결: ${if(GestureAccessibilityService.instance != null) "연결됨" else "필요"}\n실제 영상 수신: ${if(receiving) "수신 중" else "없음"}\n${RuntimeState.message}"
            }
        }
