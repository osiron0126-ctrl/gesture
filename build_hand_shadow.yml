        mkdir -p generated-android/app/src/main/java/com/sc/millegesture
        cat > generated-android/app/src/main/java/com/sc/millegesture/GestureAccessibilityService.kt <<'SC_FILE_EOF'
        package com.sc.millegesture
        import android.accessibilityservice.AccessibilityService
        import android.accessibilityservice.GestureDescription
        import android.app.KeyguardManager
        import android.content.Intent
        import android.graphics.Path
        import android.graphics.Rect
        import android.os.Handler
        import android.os.Looper
        import android.view.accessibility.AccessibilityEvent
        import android.view.accessibility.AccessibilityWindowInfo

        class GestureAccessibilityService : AccessibilityService() {
            companion object { @Volatile var instance: GestureAccessibilityService? = null; private set }
            private var busy = false
            private val handler = Handler(Looper.getMainLooper())
            override fun onServiceConnected() { super.onServiceConnected(); instance = this }
            override fun onAccessibilityEvent(event: AccessibilityEvent?) = Unit
            override fun onInterrupt() { stopService(Intent(this, GestureCameraService::class.java)); HandOverlayManager.remove() }
            override fun onDestroy() {
                if (instance === this) instance = null
                stopService(Intent(this, GestureCameraService::class.java))
                HandOverlayManager.remove(); handler.removeCallbacksAndMessages(null); super.onDestroy()
            }
            fun perform(direction: Direction): Boolean {
                if (busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                // Resolve the current focused application window on every gesture, including split screen.
                val win = windows.firstOrNull { it.type == AccessibilityWindowInfo.TYPE_APPLICATION && it.isFocused }
                    ?: windows.firstOrNull { it.type == AccessibilityWindowInfo.TYPE_APPLICATION && it.isActive }
                    ?: return false
                val root = win.root ?: return false
                val pkg = root.packageName?.toString()
                @Suppress("DEPRECATION") root.recycle()
                if (pkg == packageName) return false // Keep START/STOP and settings operable.
                val b = Rect(); win.getBoundsInScreen(b)
                if (b.width() < 100 || b.height() < 100) return false
                val prefs = getSharedPreferences("settings", MODE_PRIVATE)
                val horizontal = direction == Direction.LEFT || direction == Direction.RIGHT
                var positive = direction == Direction.RIGHT || direction == Direction.DOWN
                if (prefs.getBoolean(if(horizontal) "reverseX" else "reverseY",false)) positive = !positive
                val cx = b.exactCenterX(); val cy = b.exactCenterY()
                val path = Path()
                val tap = horizontal && !prefs.getBoolean("swipe",false)
                if (tap) path.moveTo(b.left + b.width() * if(positive) .84f else .16f, cy)
                else {
                    val span = .2f + .55f * prefs.getInt("distance",50).coerceIn(0,100) / 100f
                    val delta = (if(horizontal) b.width() else b.height()) * span / 2f * if(positive) 1f else -1f
                    if(horizontal) { path.moveTo(cx-delta,cy); path.lineTo(cx+delta,cy) }
                    else { path.moveTo(cx,cy-delta); path.lineTo(cx,cy+delta) }
                }
                val gesture = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path,0,if(tap) 60L else 420L)).build()
                busy = true
                val accepted = dispatchGesture(gesture,object : GestureResultCallback() {
                    override fun onCompleted(gestureDescription: GestureDescription?) { busy = false }
                    override fun onCancelled(gestureDescription: GestureDescription?) { busy = false; RuntimeState.message = "동작 취소됨 · 다시 손을 접었다 펴세요" }
                },handler)
                if(!accepted) busy = false
                return accepted
            }
        }
        SC_FILE_EOF
        mkdir -p generated-android/app/src/main/java/com/sc/millegesture
        cat > generated-android/app/src/main/java/com/sc/millegesture/GestureCameraService.kt <<'SC_FILE_EOF'
        package com.sc.millegesture
        import android.Manifest
        import android.app.*
        import android.content.*
        import android.content.pm.PackageManager
        import android.graphics.Bitmap
        import android.graphics.Matrix
        import android.hardware.display.DisplayManager
        import android.os.*
        import android.util.Size
        import android.view.Surface
        import androidx.camera.core.*
        import androidx.camera.lifecycle.ProcessCameraProvider
        import androidx.core.app.NotificationCompat
        import androidx.core.content.ContextCompat
        import androidx.lifecycle.LifecycleService
        import com.google.mediapipe.framework.image.BitmapImageBuilder
        import com.google.mediapipe.tasks.core.BaseOptions
        import com.google.mediapipe.tasks.vision.core.RunningMode
        import com.google.mediapipe.tasks.vision.gesturerecognizer.GestureRecognizer
        import java.util.concurrent.Executors

        class GestureCameraService : LifecycleService() {
            companion object { const val ACTION_STOP = "com.sc.millegesture.STOP" }
            private val worker = Executors.newSingleThreadExecutor()
            private val main = Handler(Looper.getMainLooper())
            private var provider: ProcessCameraProvider? = null
            private var analysis: ImageAnalysis? = null
            private var recognizer: GestureRecognizer? = null // Owned solely by worker.
            private val engine = GestureEngine() // Owned solely by main thread.
            @Volatile private var alive = true
            private var started = false
            private var failed = false
            private var lastSubmitted = 0L
            private var startAt = 0L
            private var lastRotation = -1
            private var framesFailed = 0
            private val screenOff = object : BroadcastReceiver() {
                override fun onReceive(context: Context?, intent: Intent?) { stopSelf() }
            }
            private val watchdog = object : Runnable {
                override fun run() {
                    if (!alive || !started) return
                    if (GestureAccessibilityService.instance == null) { fail("접근성 연결이 끊겼습니다"); return }
                    val since = if(RuntimeState.lastFrame == 0L) startAt else RuntimeState.lastFrame
                    if (SystemClock.uptimeMillis()-since > 15000) { fail("15초 동안 카메라 영상 없음 · 카메라를 쓰는 앱을 닫고 다시 START"); return }
                    main.postDelayed(this,1000)
                }
            }
            override fun onCreate() {
                super.onCreate()
                getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel("gesture_camera","손 제스처",NotificationManager.IMPORTANCE_LOW))
                ContextCompat.registerReceiver(this,screenOff,IntentFilter(Intent.ACTION_SCREEN_OFF),ContextCompat.RECEIVER_NOT_EXPORTED)
            }
            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                super.onStartCommand(intent,flags,startId)
                if(intent?.action == ACTION_STOP) { stopSelf(); return START_NOT_STICKY }
                try { startForeground(4101,notification()) } catch(e: Exception) { fail("카메라 서비스 시작 실패: ${e.message}"); return START_NOT_STICKY }
                if(started) return START_NOT_STICKY
                if(ContextCompat.checkSelfPermission(this,Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                    fail("카메라 권한이 필요합니다"); return START_NOT_STICKY
                }
                started = true; RuntimeState.running = true; RuntimeState.lastFrame = 0
                RuntimeState.message = "모델·카메라 준비 중"; startAt = SystemClock.uptimeMillis()
                main.post(watchdog)
                worker.execute {
                    try {
                        val options = GestureRecognizer.GestureRecognizerOptions.builder()
                            .setBaseOptions(BaseOptions.builder().setModelAssetPath("gesture_recognizer.task").build())
                            .setRunningMode(RunningMode.VIDEO).setNumHands(1)
                            .setMinHandDetectionConfidence(.55f).setMinHandPresenceConfidence(.55f).setMinTrackingConfidence(.55f).build()
                        if(alive) recognizer = GestureRecognizer.createFromOptions(this,options)
                        main.post { if(alive) startCamera() }
                    } catch(e: Exception) { main.post { if(alive) fail("인식 모델 오류: ${e.message}") } }
                }
                return START_NOT_STICKY
            }
            private fun rotation(): Int = getSystemService(DisplayManager::class.java).getDisplay(android.view.Display.DEFAULT_DISPLAY)?.rotation ?: Surface.ROTATION_0
            private fun startCamera() {
                val future = ProcessCameraProvider.getInstance(this)
                future.addListener({
                    if(!alive) return@addListener
                    try {
                        val cameraProvider = future.get(); provider = cameraProvider
                        @Suppress("DEPRECATION")
                        val useCase = ImageAnalysis.Builder().setTargetResolution(Size(640,480))
                            .setTargetRotation(rotation()).setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                            .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888).build()
                        analysis = useCase
                        useCase.setAnalyzer(worker) { frame -> analyze(frame) }
                        val camera = cameraProvider.bindToLifecycle(this,CameraSelector.DEFAULT_FRONT_CAMERA,useCase)
                        camera.cameraInfo.cameraState.observe(this) { state ->
                            if(state.error != null) RuntimeState.message = "카메라 상태 오류 ${state.error?.code} · 다른 카메라 앱을 닫으세요"
                        }
                    } catch(e: Exception) { fail("카메라 연결 실패: ${e.message}") }
                },ContextCompat.getMainExecutor(this))
            }
            private fun analyze(frame: ImageProxy) {
                var raw: Bitmap? = null; var transformed: Bitmap? = null
                try {
                    if(!alive) return
                    val now = SystemClock.uptimeMillis()
                    if(now-lastSubmitted < 80) return
                    lastSubmitted = now
                    RuntimeState.lastFrame = now
                    val currentRotation = rotation()
                    if(currentRotation != lastRotation) {
                        lastRotation = currentRotation
                        main.post { if(alive) { analysis?.targetRotation = currentRotation; engine.reset(); HandOverlayManager.update(null) } }
                        return
                    }
                    // ImageProxy.toBitmap handles RGBA row stride and padding correctly.
                    val bitmap = frame.toBitmap(); raw = bitmap
                    val matrix = Matrix().apply { postRotate(frame.imageInfo.rotationDegrees.toFloat()); postScale(-1f,1f) }
                    val rotated = Bitmap.createBitmap(bitmap,0,0,bitmap.width,bitmap.height,matrix,true); transformed = rotated
                    val image = BitmapImageBuilder(rotated).build()
                    val result = try { recognizer?.recognizeForVideo(image,now) } finally { image.close() }
                    if(result == null) return
                    val hand = result.landmarks().firstOrNull()
                    val points = hand?.takeIf { it.size == 21 }?.map { it.x() to it.y() }
                    val top = result.gestures().firstOrNull()?.firstOrNull()
                    val open = top?.categoryName() == "Open_Palm" && top.score() >= .55f
                    val fist = top?.categoryName() == "Closed_Fist" && top.score() >= .55f
                    framesFailed = 0
                    main.post {
                        if(!alive || SystemClock.uptimeMillis()-now > 400) return@post
                        HandOverlayManager.update(points)
                        val ids = listOf(0,5,9,13,17)
                        val x = if(points == null) 0f else ids.map { points[it].first }.average().toFloat()
                        val y = if(points == null) 0f else ids.map { points[it].second }.average().toFloat()
                        val sensitivity = getSharedPreferences("settings",MODE_PRIVATE).getInt("sensitivity",50).coerceIn(0,100)
                        val direction = engine.sample(now,x,y,open,fist,points == null,.26f-.002f*sensitivity)
                        if(direction != null) {
                            val done = GestureAccessibilityService.instance?.perform(direction) == true
                            RuntimeState.message = if(done) "동작 실행 · 손을 접었다 펴세요" else "동작 전달 실패 · 대상 앱으로 이동 후 다시 시도"
                        } else RuntimeState.message = when {
                            engine.awaitingRelease -> "다시 준비하려면 손을 접거나 카메라 밖으로 빼세요"
                            points == null -> "영상 수신 중 · 손을 비춰주세요"
                            open -> "준비됨 · 손바닥을 한 방향으로 움직이세요"
                            else -> "손 인식 중 · 손바닥을 펴세요"
                        }
                    }
                } catch(e: Exception) {
                    framesFailed++
                    main.post { if(alive) { HandOverlayManager.update(null); RuntimeState.message = "영상 분석 오류: ${e.message}" } }
                    if(framesFailed >= 5) main.post { if(alive) fail("영상 분석이 반복 실패했습니다 · 다시 START") }
                } finally {
                    if(transformed !== raw) transformed?.recycle()
                    raw?.recycle(); frame.close()
                }
            }
            private fun fail(message: String) { failed = true; RuntimeState.message = message; stopSelf() }
            private fun notification(): Notification {
                val content = PendingIntent.getActivity(this,10,Intent(this,MainActivity::class.java),PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                val stop = PendingIntent.getService(this,11,Intent(this,GestureCameraService::class.java).setAction(ACTION_STOP),PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                return NotificationCompat.Builder(this,"gesture_camera").setSmallIcon(android.R.drawable.ic_menu_camera)
                    .setContentTitle("SC Hand Gesture").setContentText("손 제스처 카메라 사용 중 · 중지 버튼으로 종료")
                    .setContentIntent(content).setOngoing(true).addAction(0,"중지",stop).build()
            }
            override fun onDestroy() {
                alive = false; RuntimeState.running = false; RuntimeState.lastFrame = 0
                if(!failed) RuntimeState.message = "중지됨"
                main.removeCallbacksAndMessages(null)
                runCatching { unregisterReceiver(screenOff) }
                analysis?.clearAnalyzer(); analysis?.let { provider?.unbind(it) }; analysis = null; provider = null
                HandOverlayManager.remove()
                // Close on the same serial worker after any in-flight recognition finishes.
                worker.execute { runCatching { recognizer?.close() }; recognizer = null }
                worker.shutdown()
                stopForeground(STOP_FOREGROUND_REMOVE)
                super.onDestroy()
            }
        }
        SC_FILE_EOF
        mkdir -p generated-android/app/src/main/java/com/sc/millegesture
        cat > generated-android/app/src/main/java/com/sc/millegesture/GestureEngine.kt <<'SC_FILE_EOF'
        package com.sc.millegesture
        import kotlin.math.abs

        enum class Direction { LEFT, RIGHT, UP, DOWN }
        /** A fired gesture stays latched until a deliberate fist or prolonged absence. */
        class GestureEngine {
            private var locked = false
            val awaitingRelease: Boolean get() = locked
            private var releaseSince: Long? = null
            private var origin: Pair<Float, Float>? = null
            private var originAt = 0L
            private var previousAt = -1L
            fun reset() { locked = false; releaseSince = null; origin = null; previousAt = -1L }
            fun sample(t: Long, x: Float, y: Float, open: Boolean, fist: Boolean,
                       absent: Boolean, threshold: Float = .16f): Direction? {
                if (previousAt >= 0 && t - previousAt > 350) { origin = null; releaseSince = null }
                previousAt = t
                if (locked) {
                    if (fist || absent) {
                        val since = releaseSince ?: t.also { releaseSince = it }
                        if (t - since >= if (fist) 350L else 700L) {
                            locked = false; origin = null; releaseSince = null
                        }
                    } else releaseSince = null
                    return null
                }
                if (!open) { origin = null; return null }
                val o = origin
                if (o == null) { origin = x to y; originAt = t; return null }
                val dx = x - o.first; val dy = y - o.second
                if (t - originAt > 850) { origin = x to y; originAt = t; return null }
                if (t - originAt < 120) return null
                val direction = when {
                    abs(dx) >= threshold && abs(dx) > abs(dy) * 1.4f -> if (dx > 0) Direction.RIGHT else Direction.LEFT
                    abs(dy) >= threshold && abs(dy) > abs(dx) * 1.4f -> if (dy > 0) Direction.DOWN else Direction.UP
                    else -> null
                }
                if (direction != null) { locked = true; origin = null; releaseSince = null }
                return direction
            }
        }
        SC_FILE_EOF
        mkdir -p generated-android/app/src/main/java/com/sc/millegesture
        cat > generated-android/app/src/main/java/com/sc/millegesture/HandOverlay.kt <<'SC_FILE_EOF'
        package com.sc.millegesture
        import android.content.Context
        import android.graphics.*
        import android.os.Handler
        import android.os.Looper
        import android.view.Gravity
        import android.view.View
        import android.view.WindowManager
        import kotlin.math.hypot

        object HandOverlayManager {
            private var wm: WindowManager? = null
            private var view: HandOverlayView? = null
            private val handler = Handler(Looper.getMainLooper())
            private val stale = Runnable { view?.update(null) }
            fun update(points: List<Pair<Float,Float>>?) {
                check(Looper.myLooper() == Looper.getMainLooper())
                val service = GestureAccessibilityService.instance ?: return
                if (!service.getSharedPreferences("settings",Context.MODE_PRIVATE).getBoolean("shadow",true)) { remove(); return }
                if (view == null && points != null) {
                    val manager = service.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                    val v = HandOverlayView(service)
                    val params = WindowManager.LayoutParams(-1,-1,WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                        PixelFormat.TRANSLUCENT).apply { gravity = Gravity.TOP or Gravity.START }
                    try { manager.addView(v,params); wm = manager; view = v }
                    catch(e: Exception) { RuntimeState.message = "그림자 표시 실패: ${e.message}" }
                }
                view?.update(points)
                handler.removeCallbacks(stale)
                if(points != null) handler.postDelayed(stale,450)
            }
            fun remove() {
                handler.removeCallbacks(stale)
                view?.let { runCatching { wm?.removeView(it) } }; view = null; wm = null
            }
        }
        class HandOverlayView(context: Context) : View(context) {
            private var points: List<Pair<Float,Float>>? = null
            private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.BLACK; style = Paint.Style.FILL }
            fun update(p: List<Pair<Float,Float>>?) {
                val old = points
                points = if(p != null && old != null && p.size == old.size) p.mapIndexed { i,v ->
                    (old[i].first + (v.first-old[i].first)*.55f) to (old[i].second + (v.second-old[i].second)*.55f)
                } else p
                visibility = if(points == null) GONE else VISIBLE; invalidate()
            }
            override fun onDraw(canvas: Canvas) {
                val p = points?.takeIf { it.size == 21 } ?: return
                fun x(i:Int) = p[i].first * width
                fun y(i:Int) = p[i].second * height
                val palm = Path().apply {
                    moveTo(x(0),y(0)); for(i in listOf(1,2,5,9,13,17)) lineTo(x(i),y(i)); close()
                }
                // Compose an opaque silhouette first: overlapping fingers share the same final alpha.
                val layer = canvas.saveLayerAlpha(0f,0f,width.toFloat(),height.toFloat(),110)
                canvas.drawPath(palm,paint)
                val base = hypot(x(5)-x(17),y(5)-y(17)).coerceAtLeast(12f) * .115f
                for(chain in arrayOf(intArrayOf(1,2,3,4),intArrayOf(5,6,7,8),intArrayOf(9,10,11,12),intArrayOf(13,14,15,16),intArrayOf(17,18,19,20))) {
                    for(j in 0..2) {
                        val a=chain[j]; val b=chain[j+1]
                        val ra=base*(1f-j*.15f); val rb=base*(.85f-j*.15f)
                        val dx=x(b)-x(a); val dy=y(b)-y(a); val len=hypot(dx,dy).coerceAtLeast(1f)
                        val nx=-dy/len; val ny=dx/len
                        val finger=Path().apply {
                            moveTo(x(a)+nx*ra,y(a)+ny*ra); lineTo(x(b)+nx*rb,y(b)+ny*rb)
                            lineTo(x(b)-nx*rb,y(b)-ny*rb); lineTo(x(a)-nx*ra,y(a)-ny*ra); close()
                        }
                        canvas.drawPath(finger,paint); canvas.drawCircle(x(a),y(a),ra,paint); canvas.drawCircle(x(b),y(b),rb,paint)
                    }
                }
                canvas.restoreToCount(layer)
            }
        }
        SC_FILE_EOF
