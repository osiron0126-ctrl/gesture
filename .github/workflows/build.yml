          package com.sc.millegesture

          import kotlin.math.hypot

          class StablePoseHoldEngine(
              private val holdMs: Long = 900L,
              private val moveTolerance: Float = .055f,
              private val dropoutMs: Long = 160L
          ) {
              private var anchors: List<Pair<Float, Float>>? = null
              private var holdStart = 0L
              private var fired = false
              private var missingSince: Long? = null
              var progress: Float = 0f
                  private set
              val holding: Boolean get() = anchors != null && !fired

              fun reset() {
                  anchors = null
                  holdStart = 0L
                  fired = false
                  missingSince = null
                  progress = 0f
              }

              fun sample(now: Long, points: List<Pair<Float, Float>>, active: Boolean): Boolean {
                  if (!active || points.isEmpty()) {
                      if (anchors != null) {
                          val since = missingSince ?: now.also { missingSince = it }
                          if (now - since >= dropoutMs) reset()
                      }
                      return false
                  }
                  missingSince = null
                  val previous = anchors
                  if (previous == null || previous.size != points.size) {
                      anchors = points.toList()
                      holdStart = now
                      fired = false
                      progress = 0f
                      return false
                  }
                  val moved = previous.indices.any { i -> distance(previous[i], points[i]) > moveTolerance }
                  if (moved) {
                      anchors = points.toList()
                      holdStart = now
                      fired = false
                      progress = 0f
                      return false
                  }
                  progress = ((now - holdStart).toFloat() / holdMs.toFloat()).coerceIn(0f, 1f)
                  if (!fired && now - holdStart >= holdMs) {
                      fired = true
                      progress = 1f
                      return true
                  }
                  return false
              }

              private fun distance(a: Pair<Float, Float>, b: Pair<Float, Float>): Float = hypot(
                  (a.first - b.first).toDouble(),
                  (a.second - b.second).toDouble()
              ).toFloat()
          }
