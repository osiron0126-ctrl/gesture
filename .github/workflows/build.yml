                  fun step(t: Long, index: Float?, middle: Float?, p: Pair<Float, Float>? = point): RightHandAction? {
                      val pose = filter.sample(t, index, middle)
                      return engine.sample(t, pose.index, pose.middle, p, p)
                  }
                  assertNull(step(0L, .60f, .70f))
                  assertNull(step(40L, .25f, .58f))
                  assertNull(step(100L, .25f, .58f)) // stabilized close: tracking begins
                  assertNull(step(140L, .25f, .58f))
                  assertNull(step(180L, .55f, .58f)) // release candidate only
                  assertNull(step(220L, .55f, .58f))
                  val action = step(280L, .55f, .58f) // stabilized release
                  assertTrue(action is RightHandAction.Tap)
                  assertNull(step(320L, .55f, .58f)) // no duplicate click
              }

              @Test fun oneFrameRawPinchGapDoesNotPrematurelyClick() {
                  val filter = RightPinchPoseStabilizer()
                  val engine = RightHandInputEngine()
                  val point = .41f to .39f
                  fun step(t: Long, index: Float, middle: Float): RightHandAction? {
                      val pose = filter.sample(t, index, middle)
                      return engine.sample(t, pose.index, pose.middle, point, point)
                  }
                  assertNull(step(0L, .25f, .58f))
                  assertNull(step(60L, .25f, .58f)) // stable pinch begins
                  assertNull(step(100L, .55f, .58f)) // one raw gap
                  assertNull(step(140L, .25f, .58f)) // recovered before 90 ms release confirm
                  assertNull(step(200L, .25f, .58f))
                  assertNull(step(240L, .55f, .58f))
                  assertNull(step(300L, .55f, .58f))
                  assertTrue(step(340L, .55f, .58f) is RightHandAction.Tap)
              }

              @Test fun thumbMiddlePinchAdjustsVolumeByDirection() {
                  val engine = RightHandInputEngine()
                  assertNull(engine.sample(0L, false, true, null, .5f to .5f))
                  assertEquals(
                      RightHandAction.Volume(1),
                      engine.sample(200L, false, true, null, .5f to .43f)
                  )
                  assertEquals(
                      RightHandAction.Volume(-1),
                      engine.sample(400L, false, true, null, .5f to .50f)
                  )
              }
          
              @Test fun changingPinchTypeRequiresNeutralPose() {
                  val engine = RightHandInputEngine()
                  val point = .4f to .4f
                  assertNull(engine.sample(0L, true, false, point, null))
                  assertNull(engine.sample(100L, false, true, point, point))
                  assertNull(engine.sample(300L, false, true, point, point))
                  assertNull(engine.sample(400L, false, false, point, point))
                  assertNull(engine.sample(560L, false, false, point, point))
                  assertNull(engine.sample(600L, false, true, point, point))
                  assertEquals(
                      RightHandAction.Volume(1),
                      engine.sample(800L, false, true, point, .4f to .32f)
                  )
              }
          }
