        package com.sc.millegesture

        import kotlin.math.hypot

        /** A single MediaPipe hand in display-oriented normalized coordinates. */
        data class DetectedHand(
            val points: List<Pair<Float, Float>>,
            val gesture: String?,
            val score: Float,
            val handedness: String?
        ) {
            val isRight: Boolean
                get() = handedness.equals("Right", ignoreCase = true)

            val isLeft: Boolean
                get() = handedness.equals("Left", ignoreCase = true)

            val openPalm: Boolean
                get() = gesture.equals("Open_Palm", ignoreCase = true) && score >= 0.55f

            val closedFist: Boolean
                get() = gesture.equals("Closed_Fist", ignoreCase = true) && score >= 0.45f || geometricFist

            /** Uses landmarks as a fallback when the canned gesture classifier flickers. */
            val geometricFist: Boolean
                get() {
                    if (points.size != 21) return false
                    val wrist = points[0]
                    val pairs = arrayOf(8 to 6, 12 to 10, 16 to 14, 20 to 18)
                    val folded = pairs.count { (tip, joint) ->
                        distance(points[tip], wrist) <= distance(points[joint], wrist) * 1.10f
                    }
                    return folded >= 3
                }

            /** True when the index and middle fingertips are intentionally brought together. */
            val indexMiddleTogether: Boolean
                get() {
                    if (points.size != 21) return false
                    val palmWidth = distance(points[5], points[17]).coerceAtLeast(0.01f)
                    val fingertipDistance = distance(points[8], points[12])
                    val indexExtended = distance(points[8], points[0]) > distance(points[6], points[0]) * 1.04f
                    val middleExtended = distance(points[12], points[0]) > distance(points[10], points[0]) * 1.04f
                    return fingertipDistance <= palmWidth * 0.52f && indexExtended && middleExtended
                }

            val indexTip: Pair<Float, Float>?
                get() = points.getOrNull(8)

            /** The midpoint of the two active fingertips, used as the gesture cursor. */
            val indexMiddleCenter: Pair<Float, Float>?
                get() {
                    if (points.size <= 12) return null
                    return (points[8].first + points[12].first) / 2f to
                        (points[8].second + points[12].second) / 2f
                }

            val palmCenter: Pair<Float, Float>?
                get() {
                    if (points.size < 18) return null
                    val ids = intArrayOf(0, 5, 9, 13, 17)
                    return ids.map { points[it] }.let { values ->
                        values.map { it.first }.average().toFloat() to
                            values.map { it.second }.average().toFloat()
                    }
                }

            private fun distance(a: Pair<Float, Float>, b: Pair<Float, Float>): Float = hypot(
                (a.first - b.first).toDouble(),
                (a.second - b.second).toDouble()
            ).toFloat()
        }
