                assertNull(engine.sample(450L, .10f to .49f, true))
                engine.sample(650L, .50f to .50f, true)
                engine.sample(900L, .50f to .50f, true)
                assertEquals(Direction.RIGHT, engine.sample(1130L, .73f to .50f, true))
            }

