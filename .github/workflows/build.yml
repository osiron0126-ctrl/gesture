                      // over the same 2.2 s progress used by the ring.
                      RuntimeState.gestureLocked && isLockHoldHand -> {
                          drawPaintSet(canvas, whiteDigital, alpha * (1f - holdBlend))
                          drawPaintSet(canvas, basePaints, alpha * holdBlend)
                      }
                      // While locked and not actively holding to unlock, the hand stays white.
                      RuntimeState.gestureLocked -> drawPaintSet(canvas, whiteDigital, alpha)
                      // Lock hold: normal red gradually washes into white over 2.2 s.
                      isLockHoldHand -> {
                          drawPaintSet(canvas, basePaints, alpha * (1f - holdBlend))
                          drawPaintSet(canvas, whiteDigital, alpha * holdBlend)
