                  if (center != null && predictedRight != null && predictedLeft != null) {
                      val rd = palmDistance(center, predictedRight)
                      val ld = palmDistance(center, predictedLeft)
                      if (kotlin.math.abs(rd - ld) > .035f) return if (rd < ld) "Right" else "Left"
                  }
                  if (center != null && predictedRight != null && predictedLeft == null) return "Right"
                  if (center != null && predictedLeft != null && predictedRight == null) return "Left"
                  return if ((center?.first ?: .5f) < .5f) "Right" else "Left"
              }

