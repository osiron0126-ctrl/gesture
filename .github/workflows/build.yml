          /**
           * Hysteresis for the index+middle joined pose. Enter is intentionally tighter than
           * release, so small landmark jitter cannot rapidly toggle scroll/system gestures.
           */
          class TwoFingerPoseStabilizer {
              private companion object {
                  const val ENTER_RATIO = .50f
                  const val EXIT_RATIO = .64f
                  const val ENTER_CONFIRM_MS = 28L
                  const val RELEASE_GRACE_MS = 95L
              }

              private var stable = false
              private var candidateSince: Long? = null
              private var releaseSince: Long? = null

              fun reset() {
                  stable = false
                  candidateSince = null
                  releaseSince = null
              }

              fun sample(now: Long, ratio: Float?, fingersExtended: Boolean): Boolean {
                  if (!fingersExtended || ratio == null) {
                      if (stable) {
                          val since = releaseSince ?: now.also { releaseSince = it }
                          if (now - since >= RELEASE_GRACE_MS) reset()
                      } else {
                          candidateSince = null
                      }
                      return stable
                  }

                  if (stable) {
                      if (ratio <= EXIT_RATIO) {
                          releaseSince = null
                      } else {
                          val since = releaseSince ?: now.also { releaseSince = it }
                          if (now - since >= RELEASE_GRACE_MS) reset()
                      }
                      return stable
                  }

                  releaseSince = null
                  if (ratio <= ENTER_RATIO) {
                      val since = candidateSince ?: now.also { candidateSince = it }
                      if (now - since >= ENTER_CONFIRM_MS) {
                          stable = true
                          candidateSince = null
                      }
                  } else {
                      candidateSince = null
                  }
                  return stable
              }
          }
