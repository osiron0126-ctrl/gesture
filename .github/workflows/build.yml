              private fun smoothClosedBlob(path: Path, points: List<ShapePoint>) {
                  path.rewind()
                  if (points.size < 3) return
                  val first = midpoint(points.last(), points.first())
                  path.moveTo(first.x, first.y)
                  for (index in points.indices) {
                      val current = points[index]
                      val next = points[(index + 1) % points.size]
                      val end = midpoint(current, next)
                      path.quadTo(current.x, current.y, end.x, end.y)
                  }
                  path.close()
              }
          
              private fun smoothFingerRibbon(path: Path, points: List<ShapePoint>, widths: List<Float>) {
                  path.rewind()
                  if (points.size < 2 || points.size != widths.size) return
                  val left = ArrayList<ShapePoint>(points.size)
                  val right = ArrayList<ShapePoint>(points.size)
                  for (index in points.indices) {
                      val before = points[if (index == 0) 0 else index - 1]
                      val after = points[if (index == points.lastIndex) points.lastIndex else index + 1]
                      val dx = after.x - before.x
                      val dy = after.y - before.y
                      val length = hypot(dx, dy).coerceAtLeast(1f)
                      val nx = -dy / length
                      val ny = dx / length
                      left += ShapePoint(points[index].x + nx * widths[index], points[index].y + ny * widths[index])
                      right += ShapePoint(points[index].x - nx * widths[index], points[index].y - ny * widths[index])
                  }
                  path.moveTo(left[0].x, left[0].y)
                  appendSmoothSide(path, left)
                  val tip = points.last()
                  val tipTangent = unitVector(points[points.lastIndex - 1], tip)
                  path.quadTo(tip.x + tipTangent.x * widths.last(), tip.y + tipTangent.y * widths.last(), right.last().x, right.last().y)
                  appendSmoothSide(path, right.asReversed())
                  val base = points.first()
                  val baseTangent = unitVector(points[1], base)
                  path.quadTo(base.x + baseTangent.x * widths.first(), base.y + baseTangent.y * widths.first(), left[0].x, left[0].y)
                  path.close()
              }
          
              private fun appendSmoothSide(path: Path, points: List<ShapePoint>) {
                  if (points.size < 2) return
                  for (index in 1 until points.lastIndex) {
                      val end = midpoint(points[index], points[index + 1])
                      path.quadTo(points[index].x, points[index].y, end.x, end.y)
                  }
                  path.lineTo(points.last().x, points.last().y)
              }
          
              private fun midpoint(a: ShapePoint, b: ShapePoint) = ShapePoint((a.x + b.x) * .5f, (a.y + b.y) * .5f)
          
              private fun unitVector(from: ShapePoint, to: ShapePoint): ShapePoint {
                  val dx = to.x - from.x
                  val dy = to.y - from.y
                  val length = hypot(dx, dy).coerceAtLeast(1f)
                  return ShapePoint(dx / length, dy / length)
              }
          
              private fun distance(a: ShapePoint, b: ShapePoint): Float = hypot(a.x - b.x, a.y - b.y)
          
              private fun drawCursor(canvas: Canvas, now: Long) {
                  val point = cursorPoint ?: return
                  if (now > cursorUntil) {
                      cursorPoint = null
                      return
                  }
                  val density = resources.displayMetrics.density
                  val x = point.first * width
                  val y = point.second * height
                  val life = ((cursorUntil - now) / 260f).coerceIn(0f, 1f)
                  val fade = if (life < .28f) life / .28f else 1f
                  bracketPaint.alpha = (230 * fade).toInt().coerceIn(0, 230)
                  cursorCore.alpha = (245 * fade).toInt().coerceIn(0, 245)
                  val half = 12.5f * density
                  val corner = 6.2f * density
                  fun corner(x0: Float, y0: Float, sx: Float, sy: Float) {
                      canvas.drawLine(x0, y0, x0 + sx * corner, y0, bracketPaint)
                      canvas.drawLine(x0, y0, x0, y0 + sy * corner, bracketPaint)
                  }
                  corner(x - half, y - half, 1f, 1f)
                  corner(x + half, y - half, -1f, 1f)
                  corner(x - half, y + half, 1f, -1f)
                  corner(x + half, y + half, -1f, -1f)
                  val core = 2.2f * density
                  canvas.drawRect(x - core, y - core, x + core, y + core, cursorCore)
                  if (now < pulseUntil) {
                      val progress = 1f - (pulseUntil - now) / 170f
                      val radius = (8f + 12f * progress) * density
                      clickPulse.alpha = ((1f - progress) * 245).toInt().coerceIn(0, 245)
                      canvas.drawCircle(x, y, radius, clickPulse)
                  }
              }

              private fun drawLockHold(canvas: Canvas) {
                  val point = lockHoldPoint ?: return
                  val density = resources.displayMetrics.density
                  val x = point.first * width
                  val y = point.second * height
                  val radius = lockBaseRadiusPx
                  val size = 3.2f * density
                  val count = (radius / (4.7f * density)).toInt().coerceIn(36, 64)
                  val lit = (count * lockHoldProgress).toInt().coerceIn(0, count)
                  val startAngle = -Math.PI / 2.0
                  for (i in 0 until count) {
                      val angle = startAngle + (Math.PI * 2.0 * i / count.toDouble())
                      val px = x + cos(angle).toFloat() * radius
                      val py = y + sin(angle).toFloat() * radius
                      val paint = if (i < lit) lockSegmentBright else lockSegmentDim
                      canvas.drawRect(px - size / 2f, py - size / 2f, px + size / 2f, py + size / 2f, paint)
                  }
                  lockText.alpha = 230
                  lockText.textSize = 11.5f * density
                  val label = if (lockHoldLocked) "UNLOCK" else "LOCK"
                  canvas.drawText(label, x, y + radius + 14f * density, lockText)
              }

              private fun drawLockPulse(canvas: Canvas, now: Long) {
                  val point = lockPoint ?: return
                  if (now > lockPulseUntil) {
                      lockPoint = null
                      return
                  }
                  val density = resources.displayMetrics.density
                  val progress = ((now - lockPulseStart) / 460f).coerceIn(0f, 1f)
                  val x = point.first * width
                  val y = point.second * height
                  val base = lockBaseRadiusPx
                  val radius = if (lockPulseLocked) base * (1.08f - .12f * progress) else base * (.88f + .18f * progress)
                  val alpha = ((1f - progress * .82f) * 240).toInt().coerceIn(0, 240)
                  lockSegmentBright.alpha = alpha
                  val size = (3.1f + (if (lockPulseLocked) 1f - progress else progress) * 1.7f) * density
                  val count = (radius / (4.7f * density)).toInt().coerceIn(36, 64)
                  for (i in 0 until count) {
                      if (i % 4 == 1 && progress < .10f) continue
                      val angle = (Math.PI * 2.0 * i / count.toDouble())
                      val px = x + cos(angle).toFloat() * radius
                      val py = y + sin(angle).toFloat() * radius
                      canvas.drawRect(px - size / 2f, py - size / 2f, px + size / 2f, py + size / 2f, lockSegmentBright)
                  }
                  lockText.alpha = alpha
                  lockText.textSize = 11.5f * density
                  canvas.drawText(if (lockPulseLocked) "LOCK" else "UNLOCK", x, y + radius + 13f * density, lockText)
              }
          
              private fun createDigitalPaints(color: Int, pixelAlpha: Int, macroAlpha: Int): DigitalPaints {
                  val density = resources.displayMetrics.density
                  val pixelCell = (6.2f * density).toInt().coerceAtLeast(5)
                  val pixelTile = Bitmap.createBitmap(pixelCell, pixelCell, Bitmap.Config.ARGB_8888)
                  val pixelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { this.color = color }
                  Canvas(pixelTile).apply {
                      drawColor(Color.TRANSPARENT)
                      val square = pixelCell * .56f
                      val inset = (pixelCell - square) * .5f
                      drawRect(inset, inset, inset + square, inset + square, pixelPaint)
                  }
                  val macroCell = (24f * density).toInt().coerceAtLeast(18)
                  val macroTile = Bitmap.createBitmap(macroCell, macroCell, Bitmap.Config.ARGB_8888)
                  val macroPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { this.color = color }
                  Canvas(macroTile).apply {
                      drawColor(Color.TRANSPARENT)
                      drawRect(macroCell * .12f, macroCell * .14f, macroCell * .28f, macroCell * .30f, macroPaint)
                      drawRect(macroCell * .62f, macroCell * .22f, macroCell * .74f, macroCell * .34f, macroPaint)
                      drawRect(macroCell * .38f, macroCell * .60f, macroCell * .52f, macroCell * .74f, macroPaint)
                  }
                  return DigitalPaints(
                      pixelGrid = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          shader = BitmapShader(pixelTile, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                          alpha = pixelAlpha
                          style = Paint.Style.FILL
                      },
                      macroPixels = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          shader = BitmapShader(macroTile, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                          alpha = macroAlpha
                          style = Paint.Style.FILL
                      }
                  )
              }
          
              private fun currentHandAlpha(now: Long): Float {
                  if (hands.isNotEmpty()) return 1f
                  if (fadeStartedAt == 0L) return 0f
                  val alpha = 1f - (now - fadeStartedAt) / 220f
                  if (alpha <= 0f) {
                      fadingHands = emptyList()
                      fadeStartedAt = 0L
                      return 0f
                  }
                  return alpha.coerceIn(0f, 1f)
              }
          
              private fun needsAnimation(now: Long): Boolean =
                  lockHoldVisible || now < cursorUntil || now < pulseUntil || now < lockPulseUntil ||
                      (fadeStartedAt != 0L && fadingHands.isNotEmpty())
          
              private fun updateVisibility(now: Long) {
                  visibility = if (
                      hands.isEmpty() && fadingHands.isEmpty() && cursorPoint == null && !lockHoldVisible && lockPoint == null
                  ) GONE else VISIBLE
              }
          }
