                  stabilized.firstOrNull { it.isRight }?.let { hand ->
                      val palm = hand.palmCenter
                      if (palm != null) {
                          lastRightPalm?.let { previous ->
                              val measured = (palm.first - previous.first) / dt to (palm.second - previous.second) / dt
                              rightPalmVelocity = blendVelocity(rightPalmVelocity, measured)
                          }
                          lastRightPalm = palm
                      }
                      lastRightPoints = hand.points
                  }
                  stabilized.firstOrNull { it.isLeft }?.let { hand ->
                      val palm = hand.palmCenter
                      if (palm != null) {
                          lastLeftPalm?.let { previous ->
                              val measured = (palm.first - previous.first) / dt to (palm.second - previous.second) / dt
                              leftPalmVelocity = blendVelocity(leftPalmVelocity, measured)
                          }
                          lastLeftPalm = palm
                      }
                      lastLeftPoints = hand.points
                  }
                  lastPalmTrackAt = now

                  return if (getSharedPreferences("settings", MODE_PRIVATE).getBoolean("swapHands", false)) {
                      stabilized.map { hand ->
                          when {
                              hand.isRight -> hand.copy(handedness = "Left")
                              hand.isLeft -> hand.copy(handedness = "Right")
                              else -> hand
                          }
                      }
                  } else stabilized
              }

              private fun stabilizeTrackedHand(
                  hand: DetectedHand,
                  previous: List<Pair<Float, Float>>?
              ): DetectedHand {
                  if (previous == null || previous.size != hand.points.size) return hand
                  val previousPalm = palmCenterOf(previous)
                  val currentPalm = hand.palmCenter
                  val motion = if (previousPalm != null && currentPalm != null) palmDistance(previousPalm, currentPalm) else .03f
                  // Slow hand = stronger jitter filtering. Fast hand = trust current frame to avoid lag.
                  val alpha = (.48f + motion * 8.5f).coerceIn(.48f, .90f)
                  val points = hand.points.mapIndexed { index, next ->
                      if (index == 5) {
                          // MCP(5) is the pointer-motion source and is already smoothed by
                          // One Euro later. Bypass the older landmark low-pass here to avoid
                          // double-filter lag on fine aim corrections.
                          next
                      } else {
                          val old = previous[index]
                          old.first + (next.first - old.first) * alpha to
                              old.second + (next.second - old.second) * alpha
                      }
                  }
                  return hand.copy(points = points)
              }

              private fun palmCenterOf(points: List<Pair<Float, Float>>): Pair<Float, Float>? {
                  if (points.size < 18) return null
                  val ids = intArrayOf(0, 5, 9, 13, 17)
                  return ids.map { points[it].first }.average().toFloat() to
                      ids.map { points[it].second }.average().toFloat()
              }

              private fun predictPalm(
                  palm: Pair<Float, Float>?,
                  velocity: Pair<Float, Float>,
                  dt: Float
              ): Pair<Float, Float>? {
                  palm ?: return null
                  return (palm.first + velocity.first * dt * .55f).coerceIn(0f, 1f) to
                      (palm.second + velocity.second * dt * .55f).coerceIn(0f, 1f)
              }

              private fun blendVelocity(
                  old: Pair<Float, Float>,
                  measured: Pair<Float, Float>
              ): Pair<Float, Float> {
                  val alpha = .38f
                  return old.first + (measured.first - old.first) * alpha to
                      old.second + (measured.second - old.second) * alpha
              }

              private fun palmDistance(a: Pair<Float, Float>, b: Pair<Float, Float>): Float {
                  return kotlin.math.hypot(
                      (a.first - b.first).toDouble(),
                      (a.second - b.second).toDouble()
                  ).toFloat()
              }

              private fun categoryLabel(category: Category): String? {
                  val label = category.categoryName().ifBlank { category.displayName() }
                  return normalizeMirroredHandedness(label)
              }
          
