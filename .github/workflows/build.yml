          package com.sc.millegesture
          
          import kotlin.math.hypot
          import java.util.Locale
          
          /** MediaPipe labels already match the user when the supplied selfie frame is mirrored. */
          internal fun normalizeMirroredHandedness(label: String): String? {
              return when (label.trim().lowercase(Locale.US).replace('-', '_')) {
                  "right", "right_hand" -> "Right"
                  "left", "left_hand" -> "Left"
                  else -> label.takeIf { it.isNotBlank() }
              }
          }
          
          /** A single MediaPipe hand in display-oriented normalized coordinates. */
          data class DetectedHand(
              val points: List<Pair<Float, Float>>,
              val gesture: String?,
              val score: Float,
              val handedness: String?
          ) {
              val isRight: Boolean
                  get() = handedness.equals("Right", ignoreCase = true)
          
              val isLeft: Boolean
                  get() = handedness.equals("Left", ignoreCase = true)
          
              val openPalm: Boolean
                  get() = (gesture.equals("Open_Palm", ignoreCase = true) && score >= 0.55f) || geometricOpenPalm

              /** Landmark-only fallback because HandLandmarker does not emit canned gesture labels. */
              val geometricOpenPalm: Boolean
                  get() {
                      if (points.size != 21) return false
                      val wrist = points[0]
                      val pairs = arrayOf(8 to 6, 12 to 10, 16 to 14, 20 to 18)
                      val extended = pairs.count { (tip, joint) ->
                          distance(points[tip], wrist) >= distance(points[joint], wrist) * 1.12f
                      }
                      return extended >= 4
                  }
          
              val closedFist: Boolean
                  get() = gesture.equals("Closed_Fist", ignoreCase = true) && score >= 0.45f || geometricFist
          
              /** Uses landmarks as a fallback when the canned gesture classifier flickers. */
              val geometricFist: Boolean
                  get() {
                      if (points.size != 21) return false
                      val wrist = points[0]
                      val pairs = arrayOf(8 to 6, 12 to 10, 16 to 14, 20 to 18)
                      val folded = pairs.count { (tip, joint) ->
                          distance(points[tip], wrist) <= distance(points[joint], wrist) * 1.10f
                      }
                      return folded >= 3
                  }
          
              val indexMiddleExtended: Boolean
                  get() {
                      if (points.size != 21) return false
                      val wrist = points[0]
                      val indexExtended = distance(points[8], wrist) > distance(points[6], wrist) * 1.04f
                      val middleExtended = distance(points[12], wrist) > distance(points[10], wrist) * 1.04f
                      return indexExtended && middleExtended
                  }

              val indexMiddleRatio: Float?
                  get() {
                      if (points.size != 21) return null
                      val palmWidth = maxOf(distance(points[5], points[17]), distance(points[0], points[9]) * .85f).coerceAtLeast(0.01f)
                      return distance(points[8], points[12]) / palmWidth
                  }

              /** Stateless fallback; runtime commands use TwoFingerPoseStabilizer hysteresis. */
              val indexMiddleTogether: Boolean
                  get() = indexMiddleExtended && (indexMiddleRatio ?: Float.MAX_VALUE) <= .52f
          
              val indexTip: Pair<Float, Float>?
                  get() = points.getOrNull(8)
          
              /** Stable pointer coordinate halfway between the thumb and index tips. */
              val thumbIndexCenter: Pair<Float, Float>?
                  get() {
                      if (points.size <= 8) return null
                      return (points[4].first + points[8].first) / 2f to
                          (points[4].second + points[8].second) / 2f
                            }
          
              val thumbIndexRatio: Float?
                  get() = if (points.size == 21) distance(points[4], points[8]) / palmScale else null
          
              val thumbMiddleRatio: Float?
                  get() = if (points.size == 21) distance(points[4], points[12]) / palmScale else null
          
