name: Build SC Hand Gesture APK
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Android SDK
      uses: android-actions/setup-android@v3
    - name: Install SDK
      run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
    - name: Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2
    - name: Generate project
      shell: bash
      run: |
        set -euo pipefail
        rm -rf generated-android
        mkdir -p generated-android/app
        cat > generated-android/app/build.gradle.kts <<'SC_FILE_EOF'
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.sc.millegesture"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.sc.millegesture"
                minSdk = 26
                targetSdk = 35
                versionCode = 4
                versionName = "4.0.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                    proguardFiles(
                        getDefaultProguardFile("proguard-android-optimize.txt"),
                        "proguard-rules.pro"
                    )
                }
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            testImplementation("junit:junit:4.13.2")
            implementation("androidx.core:core-ktx:1.15.0")
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("com.google.android.material:material:1.12.0")
            implementation("androidx.lifecycle:lifecycle-service:2.8.7")

            val camerax = "1.4.1"
            implementation("androidx.camera:camera-core:$camerax")
            implementation("androidx.camera:camera-camera2:$camerax")
            implementation("androidx.camera:camera-lifecycle:$camerax")

            implementation("com.google.mediapipe:tasks-vision:1.0.0")
        }
        SC_FILE_EOF
        mkdir -p generated-android/app
        cat > generated-android/app/proguard-rules.pro <<'SC_FILE_EOF'
        # No shrinking in v1.
        SC_FILE_EOF
        mkdir -p generated-android/app/src/main
        cat > generated-android/app/src/main/AndroidManifest.xml <<'SC_FILE_EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
            <uses-permission android:name="android.permission.INTERNET" tools:node="remove" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" tools:node="remove" />

            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

            <uses-feature
                android:name="android.hardware.camera.front"
                android:required="true" />

            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <application
                android:allowBackup="false"
                android:label="@string/app_name"
                android:theme="@style/Theme.SCMilleGesture"
                android:usesCleartextTraffic="false">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".GestureCameraService"
                    android:exported="false"
                    android:foregroundServiceType="camera" />

                <service
                    android:name=".GestureAccessibilityService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="false">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        SC_FILE_EOF
        mkdir -p generated-android/app/src/main/java/com/sc/millegesture
        cat > generated-android/app/src/main/java/com/sc/millegesture/GestureAccessibilityService.kt <<'SC_FILE_EOF'
        package com.sc.millegesture
        import android.accessibilityservice.AccessibilityService
        import android.accessibilityservice.GestureDescription
        import android.app.KeyguardManager
        import android.content.Intent
        import android.graphics.Path
        import android.graphics.Rect
        import android.os.Handler
        import android.os.Looper
        import android.view.accessibility.AccessibilityEvent
        import android.view.accessibility.AccessibilityWindowInfo

        class GestureAccessibilityService : AccessibilityService() {
            companion object { @Volatile var instance: GestureAccessibilityService? = null; private set }
            private var busy = false
            private val handler = Handler(Looper.getMainLooper())
            override fun onServiceConnected() { super.onServiceConnected(); instance = this }
            override fun onAccessibilityEvent(event: AccessibilityEvent?) = Unit
            override fun onInterrupt() { stopService(Intent(this, GestureCameraService::class.java)); HandOverlayManager.remove() }
            override fun onDestroy() {
                if (instance === this) instance = null
                stopService(Intent(this, GestureCameraService::class.java))
                HandOverlayManager.remove(); handler.removeCallbacksAndMessages(null); super.onDestroy()
            }
            private fun focusedApplication(): Pair<AccessibilityWindowInfo, Rect>? {
                val win = windows.firstOrNull {
                    it.type == AccessibilityWindowInfo.TYPE_APPLICATION && it.isFocused
                } ?: windows.firstOrNull {
                    it.type == AccessibilityWindowInfo.TYPE_APPLICATION && it.isActive
                } ?: return null
                val root = win.root ?: return null
                val pkg = root.packageName?.toString()
                @Suppress("DEPRECATION") root.recycle()
                if (pkg == packageName) return null
                val bounds = Rect()
                win.getBoundsInScreen(bounds)
                if (bounds.width() < 100 || bounds.height() < 100) return null
                return win to bounds
            }

            fun tapAt(normalizedX: Float, normalizedY: Float): Boolean {
                if (busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                val (_, bounds) = focusedApplication() ?: return false
                val x = (bounds.left + normalizedX.coerceIn(0.02f, 0.98f) * bounds.width())
                    .coerceIn(bounds.left.toFloat(), bounds.right.toFloat() - 1f)
                val y = (bounds.top + normalizedY.coerceIn(0.02f, 0.98f) * bounds.height())
                    .coerceIn(bounds.top.toFloat(), bounds.bottom.toFloat() - 1f)
                return dispatchTap(x, y)
            }

            /** Sends the conventional left/right edge tap used by page-based apps. */
            fun pageTurn(next: Boolean): Boolean {
                if (busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                val (_, bounds) = focusedApplication() ?: return false
                val normalizedX = if (next) .84f else .16f
                val x = bounds.left + normalizedX * bounds.width()
                val y = bounds.top + .52f * bounds.height()
                return dispatchTap(x, y)
            }

            private fun dispatchTap(x: Float, y: Float): Boolean {
                val path = Path().apply { moveTo(x, y) }
                val gesture = GestureDescription.Builder()
                    .addStroke(GestureDescription.StrokeDescription(path, 0, 65L))
                    .build()
                busy = true
                val accepted = dispatchGesture(gesture, object : GestureResultCallback() {
                    override fun onCompleted(gestureDescription: GestureDescription?) { busy = false }
                    override fun onCancelled(gestureDescription: GestureDescription?) {
                        busy = false
                        RuntimeState.message = "터치 취소됨 · 다시 시도하세요"
                    }
                }, handler)
                if (!accepted) busy = false
                return accepted
            }

            fun performScroll(direction: Direction): Boolean {
                if (busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                val (_, b) = focusedApplication() ?: return false
                if (b.width() < 100 || b.height() < 100) return false
                val prefs = getSharedPreferences("settings", MODE_PRIVATE)
                var down = direction == Direction.DOWN
                if (prefs.getBoolean("reverseY", false)) down = !down
                val cx = b.exactCenterX()
                val cy = b.exactCenterY()
                val path = Path()
                val span = .22f + .48f * prefs.getInt("distance", 50).coerceIn(0, 100) / 100f
                val delta = b.height() * span / 2f
                // Match the physical hand direction: hand up -> finger swipe up;
                // hand down -> finger swipe down. The old code sent both directions
                // from top to bottom, which made upward scrolling impossible.
                if (down) {
                    path.moveTo(cx, cy - delta)
                    path.lineTo(cx, cy + delta)
                } else {
                    path.moveTo(cx, cy + delta)
                    path.lineTo(cx, cy - delta)
                }
                val gesture = GestureDescription.Builder()
                    .addStroke(GestureDescription.StrokeDescription(path, 0, 430L))
                    .build()
                busy = true
                val accepted = dispatchGesture(gesture, object : GestureResultCallback() {
                    override fun onCompleted(gestureDescription: GestureDescription?) { busy = false }
                    override fun onCancelled(gestureDescription: GestureDescription?) {
                        busy = false
                        RuntimeState.message = "스크롤 취소됨 · 다시 시도하세요"
                    }
                }, handler)
                if(!accepted) busy = false
                return accepted
            }
        }
        SC_FILE_EOF
        mkdir -p generated-android/app/src/main/java/com/sc/millegesture
        cat > generated-android/app/src/main/java/com/sc/millegesture/GestureCameraService.kt <<'SC_FILE_EOF'
        package com.sc.millegesture

        import android.Manifest
        import android.app.Notification
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.app.PendingIntent
        import android.content.BroadcastReceiver
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.content.pm.PackageManager
        import android.graphics.Bitmap
        import android.graphics.Matrix
        import android.hardware.display.DisplayManager
        import android.os.Handler
        import android.os.Looper
        import android.os.SystemClock
        import android.util.Size
        import android.view.Surface
        import androidx.camera.core.CameraSelector
        import androidx.camera.core.ImageAnalysis
        import androidx.camera.core.ImageProxy
        import androidx.camera.lifecycle.ProcessCameraProvider
        import androidx.core.app.NotificationCompat
        import androidx.core.content.ContextCompat
        import androidx.lifecycle.LifecycleService
        import com.google.mediapipe.framework.image.BitmapImageBuilder
        import com.google.mediapipe.tasks.components.containers.Category
        import com.google.mediapipe.tasks.components.containers.NormalizedLandmark
        import com.google.mediapipe.tasks.core.BaseOptions
        import com.google.mediapipe.tasks.vision.core.RunningMode
        import com.google.mediapipe.tasks.vision.gesturerecognizer.GestureRecognizer
        import com.google.mediapipe.tasks.vision.gesturerecognizer.GestureRecognizerResult
        import java.util.Locale
        import java.util.concurrent.Executors

        class GestureCameraService : LifecycleService() {
            companion object {
                const val ACTION_STOP = "com.sc.millegesture.STOP"
                private const val CHANNEL_ID = "gesture_camera"
                private const val NOTIFICATION_ID = 4101
            }

            private val worker = Executors.newSingleThreadExecutor()
            private val main = Handler(Looper.getMainLooper())
            private var provider: ProcessCameraProvider? = null
            private var analysis: ImageAnalysis? = null
            private var recognizer: GestureRecognizer? = null // Created and closed on worker.
            private val twoFingerEngine = TwoFingerGestureEngine() // Used only on main.
            private val tapTrigger = TapTrigger() // Used only on main.
            @Volatile private var alive = true
            private var started = false
            private var failed = false
            private var lastSubmitted = 0L
            private var startAt = 0L
            private var lastRotation = -1
            private var framesFailed = 0

            private val screenOff = object : BroadcastReceiver() {
                override fun onReceive(context: Context?, intent: Intent?) { stopSelf() }
            }

            private val watchdog = object : Runnable {
                override fun run() {
                    if (!alive || !started) return
                    if (GestureAccessibilityService.instance == null) {
                        fail("접근성 연결이 끊겼습니다")
                        return
                    }
                    val since = if (RuntimeState.lastFrame == 0L) startAt else RuntimeState.lastFrame
                    if (SystemClock.uptimeMillis() - since > 15000L) {
                        fail("15초 동안 카메라 영상 없음 · 카메라를 쓰는 앱을 닫고 다시 START")
                        return
                    }
                    main.postDelayed(this, 1000L)
                }
            }

            override fun onCreate() {
                super.onCreate()
                getSystemService(NotificationManager::class.java).createNotificationChannel(
                    NotificationChannel(CHANNEL_ID, "손 제스처", NotificationManager.IMPORTANCE_LOW)
                )
                ContextCompat.registerReceiver(
                    this,
                    screenOff,
                    IntentFilter(Intent.ACTION_SCREEN_OFF),
                    ContextCompat.RECEIVER_NOT_EXPORTED
                )
            }

            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                // LifecycleService must receive the parent start callback before work begins.
                super.onStartCommand(intent, flags, startId)
                if (intent?.action == ACTION_STOP) {
                    stopSelf()
                    return START_NOT_STICKY
                }
                try {
                    startForeground(NOTIFICATION_ID, notification())
                } catch (e: Exception) {
                    fail("카메라 서비스 시작 실패: ${e.message}")
                    return START_NOT_STICKY
                }
                if (started) return START_NOT_STICKY
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) !=
                    PackageManager.PERMISSION_GRANTED
                ) {
                    fail("카메라 권한이 필요합니다")
                    return START_NOT_STICKY
                }

                started = true
                RuntimeState.running = true
                RuntimeState.lastFrame = 0L
                RuntimeState.message = "모델·카메라 준비 중"
                startAt = SystemClock.uptimeMillis()
                twoFingerEngine.reset()
                tapTrigger.reset()
                main.post(watchdog)

                worker.execute {
                    try {
                        val options = GestureRecognizer.GestureRecognizerOptions.builder()
                            .setBaseOptions(
                                BaseOptions.builder()
                                    .setModelAssetPath("gesture_recognizer.task")
                                    .build()
                            )
                            .setRunningMode(RunningMode.VIDEO)
                            .setNumHands(2)
                            // The landmark geometry and one-shot timing filters below
                            // reject noise, so a slightly lower model threshold keeps
                            // a real pair of touching fingers from flickering out.
                            .setMinHandDetectionConfidence(.45f)
                            .setMinHandPresenceConfidence(.45f)
                            .setMinTrackingConfidence(.45f)
                            .build()
                        if (alive) recognizer = GestureRecognizer.createFromOptions(this, options)
                        main.post { if (alive) startCamera() }
                    } catch (e: Exception) {
                        main.post { if (alive) fail("인식 모델 오류: ${e.message}") }
                    }
                }
                return START_NOT_STICKY
            }

            private fun rotation(): Int = getSystemService(DisplayManager::class.java)
                .getDisplay(android.view.Display.DEFAULT_DISPLAY)?.rotation ?: Surface.ROTATION_0

            private fun startCamera() {
                val future = ProcessCameraProvider.getInstance(this)
                future.addListener({
                    if (!alive) return@addListener
                    try {
                        val cameraProvider = future.get()
                        provider = cameraProvider
                        @Suppress("DEPRECATION")
                        val useCase = ImageAnalysis.Builder()
                            .setTargetResolution(Size(640, 480))
                            .setTargetRotation(rotation())
                            .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                            .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)
                            .build()
                        analysis = useCase
                        useCase.setAnalyzer(worker) { frame -> analyze(frame) }
                        val camera = cameraProvider.bindToLifecycle(
                            this,
                            CameraSelector.DEFAULT_FRONT_CAMERA,
                            useCase
                        )
                        camera.cameraInfo.cameraState.observe(this) { state ->
                            if (state.error != null) {
                                RuntimeState.message =
                                    "카메라 상태 오류 ${state.error?.code} · 다른 카메라 앱을 닫으세요"
                            }
                        }
                    } catch (e: Exception) {
                        fail("카메라 연결 실패: ${e.message}")
                    }
                }, ContextCompat.getMainExecutor(this))
            }

            private fun analyze(frame: ImageProxy) {
                var raw: Bitmap? = null
                var transformed: Bitmap? = null
                try {
                    if (!alive) return
                    val now = SystemClock.uptimeMillis()
                    if (now - lastSubmitted < 80L) return
                    lastSubmitted = now
                    RuntimeState.lastFrame = now

                    val currentRotation = rotation()
                    if (currentRotation != lastRotation) {
                        lastRotation = currentRotation
                        main.post {
                            if (alive) {
                                analysis?.targetRotation = currentRotation
                                twoFingerEngine.reset()
                                tapTrigger.reset()
                                HandOverlayManager.update(emptyList())
                            }
                        }
                        return
                    }

                    // ImageProxy.toBitmap handles RGBA row stride and padding correctly.
                    val bitmap = frame.toBitmap()
                    raw = bitmap
                    val matrix = Matrix().apply {
                        postRotate(frame.imageInfo.rotationDegrees.toFloat())
                        postScale(-1f, 1f)
                    }
                    val rotated = Bitmap.createBitmap(
                        bitmap, 0, 0, bitmap.width, bitmap.height, matrix, true
                    )
                    transformed = rotated
                    val image = BitmapImageBuilder(rotated).build()
                    val result = try {
                        recognizer?.recognizeForVideo(image, now)
                    } finally {
                        image.close()
                    }
                    if (result == null) return

                    val hands = classifyHands(result)
                    val right = hands.firstOrNull { it.isRight }
                    val left = hands.firstOrNull { it.isLeft }
                    val shadows = hands.filter { it.points.size == 21 }
                    val leftFist = left?.closedFist == true
                    val rightIndex = right?.indexTip
                    val fingersTogether = right?.indexMiddleTogether == true
                    val gesturePoint = right?.indexMiddleCenter
                    framesFailed = 0

                    main.post {
                        if (!alive || SystemClock.uptimeMillis() - now > 450L) return@post
                        HandOverlayManager.update(shadows)

                        // The left hand is a momentary modifier. While it is a fist,
                        // scrolling is paused so the tap cannot collide with a swipe.
                        val tap = tapTrigger.sample(now, leftFist, rightIndex)
                        if (tap != null) {
                            twoFingerEngine.reset()
                            val done = GestureAccessibilityService.instance?.tapAt(tap.first, tap.second) == true
                            RuntimeState.message = if (done) {
                                "오른손 검지 위치 터치 · 왼손을 펴면 다시 준비"
                            } else {
                                "터치 전달 실패 · 대상 앱을 확인하세요"
                            }
                            return@post
                        }

                        if (leftFist) {
                            twoFingerEngine.reset()
                            RuntimeState.message = if (rightIndex == null) {
                                "왼손 주먹 감지 · 오른손 검지를 비춰주세요"
                            } else {
                                "터치 대기 · 왼손 주먹을 풀면 다시 준비"
                            }
                            return@post
                        }

                        val sensitivity = getSharedPreferences("settings", MODE_PRIVATE)
                            .getInt("sensitivity", 50).coerceIn(0, 100)
                        val threshold = .22f - .0015f * sensitivity
                        val direction = twoFingerEngine.sample(
                            now,
                            gesturePoint,
                            fingersTogether,
                            threshold
                        )
                        if (direction != null) {
                            val done = when (direction) {
                                Direction.LEFT -> GestureAccessibilityService.instance?.pageTurn(next = false) == true
                                Direction.RIGHT -> GestureAccessibilityService.instance?.pageTurn(next = true) == true
                                Direction.UP, Direction.DOWN ->
                                    GestureAccessibilityService.instance?.performScroll(direction) == true
                            }
                            RuntimeState.message = if (done) {
                                when (direction) {
                                    Direction.LEFT -> "이전 페이지 실행 · 손가락을 되돌리세요"
                                    Direction.RIGHT -> "다음 페이지 실행 · 손가락을 되돌리세요"
                                    Direction.UP -> "위로 스크롤 실행 · 손가락을 되돌리세요"
                                    Direction.DOWN -> "아래로 스크롤 실행 · 손가락을 되돌리세요"
                                }
                            } else {
                                if (direction == Direction.LEFT || direction == Direction.RIGHT) {
                                    "페이지 넘김 전달 실패 · 대상 앱을 확인하세요"
                                } else {
                                    "스크롤 전달 실패 · 대상 앱을 확인하세요"
                                }
                            }
                        } else {
                            RuntimeState.message = when {
                                right == null -> "오른손을 비춰주세요"
                                !fingersTogether -> "오른손 검지와 중지를 모아주세요"
                                twoFingerEngine.awaitingRelease -> "다시 움직이려면 모은 손가락을 되돌리세요"
                                else -> "준비됨 · 모은 손가락을 위아래 또는 좌우로 움직이세요"
                            }
                        }
                    }
                } catch (e: Exception) {
                    framesFailed++
                    main.post {
                        if (alive) {
                            HandOverlayManager.update(emptyList())
                            RuntimeState.message = "영상 분석 오류: ${e.message}"
                        }
                    }
                    if (framesFailed >= 5) {
                        main.post { if (alive) fail("영상 분석이 반복 실패했습니다 · 다시 START") }
                    }
                } finally {
                    if (transformed !== raw) transformed?.recycle()
                    raw?.recycle()
                    frame.close()
                }
            }

            private fun classifyHands(result: GestureRecognizerResult): List<DetectedHand> {
                val landmarks = result.landmarks()
                val gestures = result.gestures()
                val handedness = result.handedness()
                val hands = landmarks.mapIndexed { index, rawPoints ->
                    val topGesture = gestures.getOrNull(index)?.firstOrNull()
                    val handLabel = handedness.getOrNull(index)?.firstOrNull()?.let(::categoryLabel)
                    DetectedHand(
                        points = rawPoints.map { landmark -> landmark.x() to landmark.y() },
                        gesture = topGesture?.categoryName(),
                        score = topGesture?.score() ?: 0f,
                        handedness = handLabel
                    )
                }
                if (hands.isEmpty()) return emptyList()
                // MediaPipe supplies handedness for normal selfie-camera input. The
                // fallback keeps one visible hand usable on devices that omit a label.
                if (hands.size == 1) {
                    return listOf(hands.first().copy(handedness = "Right"))
                }
                val hasRight = hands.any { it.isRight }
                val hasLeft = hands.any { it.isLeft }
                if (hasRight && hasLeft) return hands

                // If only one handedness label survived a frame, assign the unlabeled
                // hand to the missing side. This prevents a temporary classifier gap
                // from disabling either the right-hand scroll or left-fist trigger.
                if (hasRight) return hands.map { if (it.isRight) it else it.copy(handedness = "Left") }
                if (hasLeft) return hands.map { if (it.isLeft) it else it.copy(handedness = "Right") }

                // On devices that omit handedness altogether, the mirrored selfie
                // image places the user's right hand on the lower-x side in normal use.
                val ordered = hands.sortedBy { it.palmCenter?.first ?: .5f }
                return ordered.mapIndexed { index, hand ->
                    hand.copy(handedness = if (index == 0) "Right" else "Left")
                }
            }

            private fun categoryLabel(category: Category): String? {
                val label = category.categoryName().ifBlank { category.displayName() }
                return label.trim().lowercase(Locale.US).replace('-', '_').let {
                    when {
                        it == "right" || it == "right_hand" -> "Right"
                        it == "left" || it == "left_hand" -> "Left"
                        else -> label
                    }
                }
            }

            private fun fail(message: String) {
                failed = true
                RuntimeState.message = message
                stopSelf()
            }

            private fun notification(): Notification {
                val content = PendingIntent.getActivity(
                    this,
                    10,
                    Intent(this, MainActivity::class.java),
                    PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
