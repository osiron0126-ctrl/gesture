          package com.sc.millegesture

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class GestureSafetyTest {
              @Test fun openPalmGeometryWorksWithoutGestureClassifier() {
                  val p = MutableList(21) { .5f to .5f }
                  p[0] = .50f to .82f
                  p[5] = .38f to .62f; p[6] = .36f to .48f; p[8] = .34f to .22f
                  p[9] = .48f to .58f; p[10] = .48f to .43f; p[12] = .48f to .16f
                  p[13] = .58f to .60f; p[14] = .60f to .46f; p[16] = .62f to .22f
                  p[17] = .67f to .65f; p[18] = .70f to .53f; p[20] = .74f to .30f
                  assertTrue(DetectedHand(p, null, 0f, "Right").openPalm)
              }

              @Test fun twoFingerPoseIsNotOpenPalm() {
                  val p = MutableList(21) { .5f to .7f }
                  p[0] = .50f to .82f
                  p[5] = .42f to .62f; p[6] = .42f to .46f; p[8] = .44f to .22f
                  p[9] = .51f to .60f; p[10] = .51f to .44f; p[12] = .46f to .22f
                  p[13] = .58f to .62f; p[14] = .58f to .58f; p[16] = .58f to .66f
                  p[17] = .66f to .66f; p[18] = .66f to .62f; p[20] = .66f to .70f
                  assertFalse(DetectedHand(p, null, 0f, "Right").openPalm)
              }

              @Test fun lockRequiresStableHoldAndFiresOnce() {
                  val e = LockPoseEngine()
                  val p = .5f to .5f
                  assertNull(e.sample(0L, p, true))
                  assertNull(e.sample(1000L, p, true))
                  assertTrue(e.holding)
                  assertTrue(e.holdProgress in .44f.. .48f)
                  assertNull(e.sample(2190L, p, true))
                  assertEquals(p, e.sample(2210L, p, true))
                  assertFalse(e.holding)
                  assertNull(e.sample(2400L, p, true))

                  // A long enough disappearance rearms the hold timer.
                  assertNull(e.sample(2500L, null, false))
                  assertNull(e.sample(2700L, null, false))
                  assertNull(e.sample(2800L, p, true))
                  assertNull(e.sample(4990L, p, true))
                  assertEquals(p, e.sample(5010L, p, true))
              }

              @Test fun briefOpenPalmDropoutDoesNotRestartHold() {
                  val e = LockPoseEngine()
                  val p = .5f to .5f
                  assertNull(e.sample(0L, p, true))
                  assertNull(e.sample(1000L, p, true))
                  assertNull(e.sample(1050L, null, false))
                  assertNull(e.sample(1140L, p, true)) // 90 ms dropout: keep original timer
                  assertNull(e.sample(2190L, p, true))
                  assertEquals(p, e.sample(2210L, p, true))
              }

              @Test fun briefSystemPoseDropoutKeepsOrigin() {
                  val e = SystemGestureEngine()
                  assertNull(e.sample(0L, .5f to .5f, true, .12f))
                  assertNull(e.sample(80L, null, false, .12f))
                  assertEquals(Direction.LEFT, e.sample(150L, .34f to .5f, true, .12f))
              }

              @Test fun systemGestureOnlyFiresBackAndHomeDirections() {
                  val e = SystemGestureEngine()
                  assertNull(e.sample(0L, .5f to .5f, true, .12f))
                  assertEquals(Direction.LEFT, e.sample(180L, .34f to .5f, true, .12f))
                  e.reset()
                  assertNull(e.sample(0L, .5f to .5f, true, .12f))
                  assertEquals(Direction.UP, e.sample(180L, .5f to .34f, true, .12f))
                  e.reset()
                  assertNull(e.sample(0L, .5f to .5f, true, .12f))
                  assertNull(e.sample(180L, .67f to .5f, true, .12f))
                  e.reset()
                  assertNull(e.sample(0L, .5f to .5f, true, .12f))
                  assertNull(e.sample(180L, .5f to .67f, true, .12f))
              }

              @Test fun scrollSpeedChangesIntensity() {
                  val slow = TwoFingerGestureEngine()
                  assertNull(slow.sample(0L, .5f to .5f, true, .145f))
                  assertNull(slow.sample(300L, .5f to .45f, true, .145f))
                  assertEquals(Direction.UP, slow.sample(600L, .5f to .34f, true, .145f))
                  assertTrue(slow.lastIntensity < 1f)
                  assertEquals(0f, slow.lastMomentum)

                  val fast = TwoFingerGestureEngine()
                  assertNull(fast.sample(0L, .5f to .6f, true, .145f))
                  assertEquals(Direction.UP, fast.sample(180L, .5f to .2f, true, .145f))
                  assertTrue(fast.lastIntensity > 1f)
                  assertTrue(fast.lastMomentum > 0f)
              }
          }
