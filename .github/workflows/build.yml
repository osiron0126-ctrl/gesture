                      Mode.VOLUME -> {
                          if (pointerPose) {
                              volume.reset()
                              enterCooldown(now, indexPinch, middlePinch)
                              null
                          } else {
                              val action = volume.sample(now, volumePose, middlePoint)
                              if (!volume.engaged) enterCooldown(now, indexPinch, middlePinch)
