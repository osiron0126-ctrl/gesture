                  }

                  val movementNow = motionPoint ?: pinchPoint
                  val projected = projectedPointer(pinchPoint, movementNow) ?: filteredPoint ?: return null
                  val filtered = pointFilter.filter(projected.clamped(), now)
                  filteredPoint = filtered

                  val start = startPoint ?: filtered
                  if (state == State.TRACKING) {
                      // Drag intent is based on the unsmoothed MCP path, never the filtered cursor.
                      val rawStart = rawStartMotion ?: anchorMotion ?: movementNow ?: projected
                      val rawNow = movementNow ?: projected
