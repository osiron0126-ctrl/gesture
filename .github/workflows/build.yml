          package com.sc.millegesture

          import android.content.Context

          data class SavedBleCommand(
              val deviceAddress: String,
              val deviceName: String,
              val serviceUuid: String,
              val characteristicUuid: String,
              val payloadHex: String,
              val writeWithoutResponse: Boolean
          )

          object BleCommandStore {
              private const val PREF = "ble_lab"
              private const val K_ADDRESS = "off_address"
              private const val K_NAME = "off_name"
              private const val K_SERVICE = "off_service"
              private const val K_CHAR = "off_characteristic"
              private const val K_PAYLOAD = "off_payload"
              private const val K_WRITE_NR = "off_write_nr"

              fun save(context: Context, command: SavedBleCommand) {
                  context.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit()
                      .putString(K_ADDRESS, command.deviceAddress)
                      .putString(K_NAME, command.deviceName)
                      .putString(K_SERVICE, command.serviceUuid)
                      .putString(K_CHAR, command.characteristicUuid)
                      .putString(K_PAYLOAD, command.payloadHex)
                      .putBoolean(K_WRITE_NR, command.writeWithoutResponse)
                      .apply()
              }

              fun load(context: Context): SavedBleCommand? {
                  val p = context.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                  val address = p.getString(K_ADDRESS, null)?.takeIf { it.isNotBlank() } ?: return null
                  val service = p.getString(K_SERVICE, null)?.takeIf { it.isNotBlank() } ?: return null
                  val characteristic = p.getString(K_CHAR, null)?.takeIf { it.isNotBlank() } ?: return null
                  val payload = p.getString(K_PAYLOAD, null) ?: return null
                  return SavedBleCommand(
                      address,
                      p.getString(K_NAME, "") ?: "",
                      service,
                      characteristic,
                      payload,
                      p.getBoolean(K_WRITE_NR, false)
                  )
              }

              fun clear(context: Context) {
                  context.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().clear().apply()
              }
          }
