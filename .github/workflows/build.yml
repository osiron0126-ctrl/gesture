              private fun measureLockRadius(point: Pair<Float, Float>) {
                  if (width <= 0 || height <= 0) return
                  val x = point.first * width
                  val y = point.second * height
                  val nearest = hands.minByOrNull { hand ->
                      val center = hand.palmCenter ?: point
                      hypot((center.first - point.first).toDouble(), (center.second - point.second).toDouble())
                  }
                  val measured = nearest?.points?.maxOfOrNull { p ->
                      hypot((p.first * width - x).toDouble(), (p.second * height - y).toDouble()).toFloat()
