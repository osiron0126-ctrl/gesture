                          drawPaintSet(canvas, basePaints, alpha * holdBlend)
                      }
                      // While locked and not actively holding to unlock, the hand stays white.
                      RuntimeState.gestureLocked -> drawPaintSet(canvas, whiteDigital, alpha)
                      // Lock hold: normal red gradually washes into white over 2.2 s.
                      isLockHoldHand -> {
                          drawPaintSet(canvas, basePaints, alpha * (1f - holdBlend))
                          drawPaintSet(canvas, whiteDigital, alpha * holdBlend)
                      }
                      else -> drawPaintSet(canvas, basePaints, alpha)
                  }
              }

              private fun drawPaintSet(canvas: Canvas, paints: DigitalPaints, alpha: Float) {
                  val pixelAlpha = paints.pixelGrid.alpha
                  val macroAlpha = paints.macroPixels.alpha
                  paints.pixelGrid.alpha = (pixelAlpha * alpha).toInt().coerceIn(0, 255)
                  paints.macroPixels.alpha = (macroAlpha * alpha).toInt().coerceIn(0, 255)
                  val save = canvas.save()
                  canvas.clipPath(handPath)
                  canvas.drawPath(handPath, paints.pixelGrid)
                  canvas.drawPath(handPath, paints.macroPixels)
                  canvas.restoreToCount(save)
                  paints.pixelGrid.alpha = pixelAlpha
                  paints.macroPixels.alpha = macroAlpha
