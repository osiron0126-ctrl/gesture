                              stageStartedAt = now
                              invalidSince = null
                          }
                      }
                      3 -> {
                          val valid = middleRatio <= .55f && middleRatio + .04f < indexRatio
                          if (valid) {
                              noteValidPose()
                              fifth += middleRatio
                              sixth += indexRatio
                          } else noteInvalidPose(now)
                          if (ready(now, fifth.size)) {
                              if (!stablePair(fifth, sixth)) {
                                  resetCurrentStage(now)
                                  return CalibrationProgress(stageMessage("엄지와 중지를 붙인 자세를 잠시 고정해주세요"))
                              }
                              val openIndex = median(first)
                              val openMiddle = median(second)
                              val indexPinch = median(third)
                              val indexOther = median(fourth)
                              val middlePinch = median(fifth)
                              val middleOther = median(sixth)
                              val reliable =
                                  openIndex - indexPinch >= .10f &&
                                  openMiddle - middlePinch >= .10f &&
                                  indexOther - indexPinch >= .10f &&
                                  middleOther - middlePinch >= .10f
                              if (!reliable) {
                                  stage = 1
                                  stageStartedAt = now
                                  // Do not reset calibrationStartedAt: the 30 s limit is absolute.
                                  clearSamples()
                                  return CalibrationProgress(
                                      "보정 값 차이가 너무 작습니다 · 오른손을 다시 편하게 펴세요"
                                  )
                              }
                              val thresholds = deriveThresholds(
                                  openIndex = openIndex,
                                  openMiddle = openMiddle,
                                  indexPinch = indexPinch,
                                  indexOther = indexOther,
                                  middlePinch = middlePinch,
                                  middleOther = middleOther
                              )
                              stage = 4
                              return CalibrationProgress("자동 보정 완료 · 개인 손 간격을 저장했습니다", thresholds)
