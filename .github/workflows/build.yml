              private fun updateStatus() {
                  if (!::status.isInitialized) return
                  val cameraPermission = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                  val micPermission = ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  val receiving = RuntimeState.running && SystemClock.uptimeMillis() - RuntimeState.lastFrame < 2000L
                  val calibrated = getSharedPreferences("settings", MODE_PRIVATE).getBoolean("pinch_calibrated", false)
                  val active = RuntimeState.running || RuntimeState.clapWaiting
                  if (::statusDot.isInitialized) statusDot.background = shape(if (active) UiTone.ACCENT_HOT else UiTone.ACCENT_DIM)
                  fun state(ok: Boolean) = if (ok) "ONLINE" else "OFFLINE"
                  status.text = buildString {
                      append("CAMERA      ").append(state(cameraPermission)).append('\n')
                      append("MIC         ").append(state(micPermission)).append('\n')
                      append("ACCESS      ").append(state(GestureAccessibilityService.instance != null)).append('\n')
                      append("CLAP        ").append(if (RuntimeState.clapWaiting) "STANDBY" else "IDLE").append('\n')
                      append("HAND CAM    ").append(if (RuntimeState.running) "ACTIVE" else "IDLE").append('\n')
                      append("VIDEO       ").append(if (receiving) "LIVE" else "NO SIGNAL").append('\n')
                      append("ANALYSIS    ").append(RuntimeState.analysisFps).append(" FPS").append('\n')
                      append("MODEL       ").append(RuntimeState.modelDelegate).append('\n')
                      append("PROFILE     ").append(if (calibrated) "USER" else "DEFAULT").append('\n')
                      append("GESTURE     ").append(if (RuntimeState.gestureLocked) "LOCKED" else "READY").append("\n\n")
                      append("> ").append(RuntimeState.message)
                  }
              }
