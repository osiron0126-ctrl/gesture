           * recognition or Accessibility injection coordinates; it only holds the rendered
           * bracket steady when the remaining filtered movement is sub-pixel/micro-jitter.
           */
          class RadialDeadZone(private val radiusPx: Float = 1.5f) {
              private var last: Pair<Float, Float>? = null

              fun filter(
                  point: Pair<Float, Float>,
                  widthPx: Int,
                  heightPx: Int
              ): Pair<Float, Float> {
                  val previous = last
                  if (previous == null || widthPx <= 0 || heightPx <= 0) {
                      last = point
                      return point
                  }
                  val dx = (point.first - previous.first) * widthPx.toFloat()
                  val dy = (point.second - previous.second) * heightPx.toFloat()
                  if (kotlin.math.hypot(dx.toDouble(), dy.toDouble()) < radiusPx.toDouble()) {
                      return previous
                  }
                  last = point
                  return point
              }

              fun reset() { last = null }
