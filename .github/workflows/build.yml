        package com.sc.millegesture

        import kotlin.math.abs
        import kotlin.math.hypot

        /**
         * One-shot input engine for the index-and-middle-fingertip-together pose.
         *
         * The same pose deliberately owns both axes: the dominant vertical movement
         * becomes a scroll and the dominant horizontal movement becomes a page turn.
         * A single movement can therefore never fire both actions on a diagonal path.
         */
        class TwoFingerGestureEngine {
            private companion object {
                const val POSE_DROPOUT_MS = 180L
            }

            private var origin: Pair<Float, Float>? = null
            private var originAt = 0L
            private var previousAt = -1L
            private var locked = false
            private var releaseSince: Long? = null

            val awaitingRelease: Boolean get() = locked

            fun reset() {
                origin = null
                originAt = 0L
                previousAt = -1L
                locked = false
                releaseSince = null
            }

            /** Returns one direction after a deliberate movement, or null otherwise. */
            fun sample(
                now: Long,
                point: Pair<Float, Float>?,
                together: Boolean,
                threshold: Float = 0.145f
            ): Direction? {
                if (previousAt >= 0L && now - previousAt > 500L) reset()
                previousAt = now

                if (!together || point == null) {
                    if (locked) {
                        val since = releaseSince ?: now.also { releaseSince = it }
                        if (now - since >= 550L) reset()
                    } else {
                        // A single missed landmark frame should not erase the gesture
                        // origin. This grace period is what makes the input usable in
                        // ordinary lighting instead of requiring classifier-perfect
                        // continuity.
                        val since = releaseSince ?: now.also { releaseSince = it }
                        if (now - since >= POSE_DROPOUT_MS) {
                            origin = null
                            releaseSince = null
                        }
                    }
                    return null
                }

                if (locked) {
                    val start = origin
                    if (start != null && distance(point, start) <= threshold * 0.35f) {
                        val since = releaseSince ?: now.also { releaseSince = it }
                        if (now - since >= 220L) {
                            locked = false
                            releaseSince = null
                            origin = point
                            originAt = now
                        }
                    } else {
                        releaseSince = null
                    }
                    return null
                }

                releaseSince = null

                val start = origin
                if (start == null) {
                    origin = point
                    originAt = now
                    return null
                }
                if (now - originAt < 120L) return null
                if (now - originAt > 900L) {
                    origin = point
                    originAt = now
                    return null
                }

                val dx = point.first - start.first
                val dy = point.second - start.second
                if (maxOf(abs(dx), abs(dy)) < threshold) return null

                // Pick one dominant axis so a diagonal movement cannot scroll and turn
                // a page in the same frame.
                val direction = if (abs(dx) >= abs(dy)) {
                    if (dx > 0f) Direction.RIGHT else Direction.LEFT
                } else {
                    if (dy > 0f) Direction.DOWN else Direction.UP
                }
                locked = true
                return direction
            }

            private fun distance(a: Pair<Float, Float>, b: Pair<Float, Float>): Float = hypot(
                (a.first - b.first).toDouble(),
                (a.second - b.second).toDouble()
            ).toFloat()
        }
