        import android.view.Gravity
        import android.view.View
        import android.view.WindowManager
        import kotlin.math.hypot

        object HandOverlayManager {
            private var wm: WindowManager? = null
            private var view: HandOverlayView? = null
            private val handler = Handler(Looper.getMainLooper())
            private val stale = Runnable { view?.update(emptyList()) }

            /** Updates both hands in one main-thread transaction. */
            fun update(hands: List<DetectedHand>) {
                check(Looper.myLooper() == Looper.getMainLooper())
                val service = GestureAccessibilityService.instance ?: return
                if (!service.getSharedPreferences("settings", Context.MODE_PRIVATE)
                        .getBoolean("shadow", true)) {
                    remove()
                    return
                }
                if (view == null && hands.isNotEmpty()) {
                    val manager = service.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                    val newView = HandOverlayView(service)
                    val params = WindowManager.LayoutParams(
                        -1,
                        -1,
                        WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                        WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                            WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                        PixelFormat.TRANSLUCENT
                    ).apply { gravity = Gravity.TOP or Gravity.START }
                    try {
                        manager.addView(newView, params)
                        wm = manager
                        view = newView
                    } catch (e: Exception) {
                        RuntimeState.message = "그림자 표시 실패: ${e.message}"
                    }
                }
                view?.update(hands)
                handler.removeCallbacks(stale)
                if (hands.isNotEmpty()) handler.postDelayed(stale, 450L)
            }

            fun remove() {
                handler.removeCallbacks(stale)
                view?.let { runCatching { wm?.removeView(it) } }
                view = null
                wm = null
            }
        }

        class HandOverlayView(context: Context) : View(context) {
            private var hands: List<DetectedHand> = emptyList()
            private val rightPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.BLACK
                style = Paint.Style.FILL
            }
            private val leftPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.rgb(45, 45, 45)
                style = Paint.Style.FILL
            }

            fun update(newHands: List<DetectedHand>) {
                val oldBySide = hands.associateBy { it.handedness?.lowercase() }
                hands = newHands.map { next ->
                    val old = oldBySide[next.handedness?.lowercase()]
                    if (old != null && old.points.size == next.points.size) {
                        next.copy(points = next.points.mapIndexed { index, point ->
                            val previous = old.points[index]
                            previous.first + (point.first - previous.first) * .55f to
                                previous.second + (point.second - previous.second) * .55f
                        })
                    } else next
                }
                visibility = if (hands.isEmpty()) GONE else VISIBLE
                invalidate()
            }

            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                if (hands.isEmpty() || width == 0 || height == 0) return
                // One alpha layer keeps overlapping joints from becoming opaque.
                val layer = canvas.saveLayerAlpha(0f, 0f, width.toFloat(), height.toFloat(), 112)
                hands.forEach { drawHand(canvas, it) }
                canvas.restoreToCount(layer)
            }

            private fun drawHand(canvas: Canvas, hand: DetectedHand) {
                val p = hand.points.takeIf { it.size == 21 } ?: return
                val activePaint = if (hand.isLeft) leftPaint else rightPaint
                fun x(i: Int) = p[i].first * width
                fun y(i: Int) = p[i].second * height
                val palm = Path().apply {
                    moveTo(x(0), y(0))
                    for (i in intArrayOf(1, 2, 5, 9, 13, 17)) lineTo(x(i), y(i))
                    close()
                }
                canvas.drawPath(palm, activePaint)
                val base = hypot(x(5) - x(17), y(5) - y(17)).coerceAtLeast(12f) * .115f
                val chains = arrayOf(
                    intArrayOf(1, 2, 3, 4),
                    intArrayOf(5, 6, 7, 8),
                    intArrayOf(9, 10, 11, 12),
                    intArrayOf(13, 14, 15, 16),
                    intArrayOf(17, 18, 19, 20)
                )
                for (chain in chains) {
                    for (j in 0..2) {
                        val a = chain[j]
                        val b = chain[j + 1]
                        val ra = base * (1f - j * .15f)
                        val rb = base * (.85f - j * .15f)
                        val dx = x(b) - x(a)
                        val dy = y(b) - y(a)
                        val len = hypot(dx, dy).coerceAtLeast(1f)
                        val nx = -dy / len
                        val ny = dx / len
                        val finger = Path().apply {
                            moveTo(x(a) + nx * ra, y(a) + ny * ra)
                            lineTo(x(b) + nx * rb, y(b) + ny * rb)
                            lineTo(x(b) - nx * rb, y(b) - ny * rb)
                            lineTo(x(a) - nx * ra, y(a) - ny * ra)
                            close()
                        }
                        canvas.drawPath(finger, activePaint)
                        canvas.drawCircle(x(a), y(a), ra, activePaint)
                        canvas.drawCircle(x(b), y(b), rb, activePaint)
                    }
                }
            }
        }
