        package com.sc.millegesture

        import kotlin.math.hypot

        /** Fires once on a confirmed left-fist transition, then waits for release. */
        class TapTrigger {
            private var armed = true
            private var fistSince: Long? = null
            private var nonFistSince: Long? = null
            private var candidate: Pair<Float, Float>? = null
            private var stableSince: Long? = null

            fun reset() {
                armed = true
                fistSince = null
                nonFistSince = null
                candidate = null
                stableSince = null
            }

            fun sample(
                now: Long,
                leftFist: Boolean,
                rightIndex: Pair<Float, Float>?
            ): Pair<Float, Float>? {
                if (!leftFist) {
                    fistSince = null
                    candidate = null
                    stableSince = null
                    val since = nonFistSince ?: now.also { nonFistSince = it }
                    if (now - since >= 250L) armed = true
                    return null
                }

                nonFistSince = null
                if (!armed || rightIndex == null) return null
                val fistAt = fistSince ?: now.also { fistSince = it }
                val old = candidate
                if (old == null) {
                    candidate = rightIndex
                    stableSince = now
                    return null
                }

                val movement = hypot(
                    (rightIndex.first - old.first).toDouble(),
                    (rightIndex.second - old.second).toDouble()
                ).toFloat()
                if (movement > 0.035f) {
                    candidate = rightIndex
                    stableSince = now
                    return null
                }

                val stableAt = stableSince ?: now.also { stableSince = it }
                if (now - fistAt >= 140L && now - stableAt >= 100L) {
                    armed = false
                    fistSince = null
                    candidate = null
                    stableSince = null
                    return rightIndex
                }
                return null
            }
        }
