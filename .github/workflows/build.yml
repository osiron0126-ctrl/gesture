          package com.sc.millegesture

          import kotlin.math.PI
          import kotlin.math.abs

          /**
           * Low-latency speed-adaptive smoothing for normalized hand coordinates.
           *
           * At rest, minCutoff suppresses MediaPipe micro-jitter. During deliberate motion,
           * beta raises the cutoff so the pointer catches up instead of feeling heavy.
           * The coefficients are tuned for normalized 0..1 coordinates at the app's usual
           * 12-25 fps analysis rate, rather than copied from pixel-space implementations.
           */
          class OneEuroFilter(
              private val minCutoff: Float = 1.4f,
              private val beta: Float = 7.5f,
              private val derivativeCutoff: Float = 1.0f
          ) {
              private var rawPrevious: Float? = null
              private var filteredPrevious: Float? = null
              private var derivativePrevious = 0f
              private var previousTimestampMs: Long? = null

              fun filter(value: Float, timestampMs: Long): Float {
                  val raw = rawPrevious
                  val filtered = filteredPrevious
                  val previousTime = previousTimestampMs
                  if (raw == null || filtered == null || previousTime == null) {
                      rawPrevious = value
                      filteredPrevious = value
                      derivativePrevious = 0f
                      previousTimestampMs = timestampMs
                      return value
                  }

                  val dtMs = (timestampMs - previousTime).coerceIn(1L, 250L)
                  val frequency = 1000f / dtMs.toFloat()
                  val derivative = (value - raw) * frequency
                  val derivativeAlpha = smoothingFactor(derivativeCutoff, frequency)
                  val derivativeHat = lowPass(derivative, derivativePrevious, derivativeAlpha)
                  val cutoff = (minCutoff + beta * abs(derivativeHat)).coerceAtLeast(.01f)
                  val alpha = smoothingFactor(cutoff, frequency)
                  val filteredValue = lowPass(value, filtered, alpha)

                  rawPrevious = value
                  filteredPrevious = filteredValue
                  derivativePrevious = derivativeHat
                  previousTimestampMs = timestampMs
                  return filteredValue
              }

              fun reset() {
                  rawPrevious = null
                  filteredPrevious = null
                  derivativePrevious = 0f
                  previousTimestampMs = null
              }

              private fun smoothingFactor(cutoff: Float, frequency: Float): Float {
                  val tau = 1f / (2f * PI.toFloat() * cutoff)
                  val period = 1f / frequency.coerceAtLeast(.01f)
                  return 1f / (1f + tau / period)
              }

              private fun lowPass(value: Float, previous: Float, alpha: Float): Float =
                  alpha * value + (1f - alpha) * previous
          }

          class OneEuroPointFilter(
              minCutoff: Float = 1.4f,
              beta: Float = 7.5f,
              derivativeCutoff: Float = 1.0f
          ) {
              private val x = OneEuroFilter(minCutoff, beta, derivativeCutoff)
              private val y = OneEuroFilter(minCutoff, beta, derivativeCutoff)

              fun filter(point: Pair<Float, Float>, timestampMs: Long): Pair<Float, Float> =
                  x.filter(point.first, timestampMs) to y.filter(point.second, timestampMs)

              fun reset() {
                  x.reset()
                  y.reset()
              }
          }

