              private fun requestCorePermissions(camera: Boolean, mic: Boolean) {
                  val perms = mutableListOf<String>()
                  if (camera) perms += Manifest.permission.CAMERA
                  if (mic) perms += Manifest.permission.RECORD_AUDIO
                  if (Build.VERSION.SDK_INT >= 33) perms += Manifest.permission.POST_NOTIFICATIONS
                  permission.launch(perms.toTypedArray())
