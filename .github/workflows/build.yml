              private fun drawHand(canvas: Canvas, hand: DetectedHand, alpha: Float) {
                  val p = hand.points.takeIf { it.size == 21 } ?: return
                  val isInputPose = if (hand.isLeft) hand.indexMiddleTogether else hand.thumbIndexPinch || hand.indexMiddleTogether
                  val basePaints = when {
                      isInputPose -> activeDigital
                      hand.isLeft -> leftDigital
                      else -> rightDigital
                  }
                  fun point(i: Int) = ShapePoint(p[i].first * width, p[i].second * height)
                  val palmWidth = distance(point(5), point(17)).coerceAtLeast(12f)
          
                  smoothClosedBlob(partPath, intArrayOf(0, 1, 2, 5, 9, 13, 17).map(::point))
