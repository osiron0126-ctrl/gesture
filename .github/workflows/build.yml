          package com.sc.millegesture
          
          import kotlin.math.abs
          import kotlin.math.hypot
          
          /**
           * Continuous left-hand scroll tracker. The first joined-finger point is remembered
           * immediately, so the short pose-confirmation window never throws away the user's
           * initial movement. After confirmation every small accumulated movement can emit a
           * new short scroll segment.
           */
          class TwoFingerGestureEngine {
              private companion object {
                  const val CONFIRM_MS = 30L
                  const val POSE_DROPOUT_MS = 120L
                  const val STALE_STREAM_MS = 420L
              }

              private var firstPoint: Pair<Float, Float>? = null
              private var lastEmitPoint: Pair<Float, Float>? = null
              private var firstAt = 0L
              private var lastEmitAt = 0L
              private var lastFrameAt = -1L
              private var confirmed = false
              private var missingSince: Long? = null
              var lastIntensity: Float = 1f
                  private set
              var lastMomentum: Float = 0f
                  private set

              val engaged: Boolean get() = firstPoint != null
              val awaitingRelease: Boolean get() = false

              fun reset() {
                  firstPoint = null
                  lastEmitPoint = null
                  firstAt = 0L
                  lastEmitAt = 0L
                  lastFrameAt = -1L
                  confirmed = false
                  missingSince = null
                  lastIntensity = 1f
                  lastMomentum = 0f
              }

              fun sample(
                  now: Long,
                  point: Pair<Float, Float>?,
                  together: Boolean,
                  threshold: Float = .013f
              ): Direction? {
                  if (lastFrameAt >= 0L && now - lastFrameAt > STALE_STREAM_MS) {
                      firstPoint = null
                      lastEmitPoint = null
                      confirmed = false
                      missingSince = null
                  }
                  lastFrameAt = now

                  if (!together || point == null) {
                      if (firstPoint != null) {
                          val since = missingSince ?: now.also { missingSince = it }
                          if (now - since >= POSE_DROPOUT_MS) reset()
                      }
                      return null
                  }
                  missingSince = null

                  if (firstPoint == null) {
                      firstPoint = point
                      lastEmitPoint = point
                      firstAt = now
                      lastEmitAt = now
                      confirmed = false
                      return null
                  }

                  if (!confirmed) {
                      if (now - firstAt < CONFIRM_MS) return null
                      confirmed = true
                  }

                  val start = lastEmitPoint ?: firstPoint ?: point
                  val dx = point.first - start.first
                  val dy = point.second - start.second
                  val dominant = maxOf(abs(dx), abs(dy))
                  val deadzone = threshold.coerceIn(.007f, .022f)
                  if (dominant < deadzone) return null

                  val elapsed = (now - lastEmitAt).coerceAtLeast(1L)
                  val speed = dominant / elapsed * 1000f
                  val movementScale = (dominant / deadzone).coerceIn(1f, 6f)
                  lastIntensity = (.42f + (movementScale - 1f) * .14f + speed * .20f)
                      .coerceIn(.42f, 1.70f)
                  lastMomentum = when {
                      speed >= 1.30f -> .22f
                      speed >= .85f -> .12f
                      else -> 0f
                  }
                  lastEmitPoint = point
                  lastEmitAt = now

                  return if (abs(dx) >= abs(dy)) {
                      if (dx > 0f) Direction.RIGHT else Direction.LEFT
                  } else {
                      if (dy > 0f) Direction.DOWN else Direction.UP
                  }
              }

              private fun distance(a: Pair<Float, Float>, b: Pair<Float, Float>): Float = hypot(
                  (a.first - b.first).toDouble(),
                  (a.second - b.second).toDouble()
              ).toFloat()
          }
