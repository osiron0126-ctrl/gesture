                  }

                  if (state == State.IDLE) {
                      val absoluteAnchor = pinchPoint ?: motionPoint ?: return null
                      val movementAnchor = motionPoint ?: absoluteAnchor
                      anchorPointer = absoluteAnchor
                      anchorMotion = movementAnchor
                      rawStartMotion = movementAnchor
