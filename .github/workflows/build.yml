                          ?: item.advertisedName?.takeIf { it.isNotBlank() }
                          ?: "UNNAMED BLE"
                      val b = actionButton("$name\n${item.device.address}   RSSI ${item.rssi} dBm") {
                          connect(item.device)
                      }
                      b.gravity = Gravity.START or Gravity.CENTER_VERTICAL
                      devicesBox.addView(b, fullButtonParams())
                  }
              }
          
              @SuppressLint("MissingPermission")
              private fun connect(device: BluetoothDevice) {
                  if (!hasBlePermissions()) {
                      permissionLauncher.launch(requiredPermissions())
                      return
                  }
                  stopScan()
                  disconnectGatt("새 BLE 장치 연결")
                  connectedDevice = device
                  val name = runCatching { device.name }.getOrNull() ?: "UNNAMED BLE"
                  setStatus("연결 중… $name / ${device.address}")
                  val nextGatt = runCatching {
                      device.connectGatt(this, false, gattCallback, BluetoothDevice.TRANSPORT_LE)
                  }.getOrElse {
                      setStatus("connectGatt 실패: ${it.message}", true)
                      null
                  }
                  if (nextGatt == null) {
                      connectedDevice = null
                  } else {
                      gatt = nextGatt
                  }
              }
          
              private fun isCurrentGatt(candidate: BluetoothGatt): Boolean = candidate === gatt
          
              @SuppressLint("MissingPermission")
              private fun closeStaleGatt(stale: BluetoothGatt) {
                  if (stale === gatt) return
                  runCatching { stale.disconnect() }
                  runCatching { stale.close() }
              }
          
              @SuppressLint("MissingPermission")
              private fun disconnectGatt(reason: String = "BLE 연결 해제", callDisconnect: Boolean = true) {
                  val old = gatt
                  gatt = null
                  cancelGattOperations(reason)
                  if (callDisconnect) runCatching { old?.disconnect() }
                  runCatching { old?.close() }
                  connectedDevice = null
                  selected = null
                  notifications.clear()
                  if (::gattBox.isInitialized) gattBox.removeAllViews()
                  if (::selection.isInitialized) selection.text = "SELECTED // NONE"
              }
          
              private fun enqueueGattOperation(operation: GattOperation) {
                  main.post {
                      gattQueue.addLast(operation)
                      pumpGattQueue()
                  }
              }
          
              private fun pumpGattQueue() {
                  if (activeGattOperation != null || gattQueue.isEmpty()) return
                  val operation = gattQueue.removeFirst()
                  activeGattOperation = operation
                  val accepted = runCatching { operation.start() }.getOrDefault(false)
                  if (!accepted) {
                      finishGattOperation(operation, false, "${operation.label} 요청 시작 실패")
                      return
                  }
                  val delay = if (operation.kind == GattOpKind.WRITE_NR) WRITE_NR_SETTLE_MS else operation.timeoutMs
                  main.postAtTime({
                      if (activeGattOperation !== operation) return@postAtTime
                      if (operation.kind == GattOpKind.WRITE_NR) {
                          // WRITE_NO_RESPONSE may not produce onCharacteristicWrite on every device/stack.
                          finishGattOperation(operation, true, null)
                      } else {
                          finishGattOperation(operation, false, "${operation.label} 응답 시간 초과")
                      }
                  }, GATT_OPERATION_TOKEN, android.os.SystemClock.uptimeMillis() + delay)
              }
          
              private fun completeGattOperationFromCallback(
                  targetUuid: UUID,
                  acceptedKinds: Set<GattOpKind>,
                  success: Boolean,
                  error: String?
              ) {
                  val operation = activeGattOperation ?: return
                  if (operation.targetUuid != targetUuid || operation.kind !in acceptedKinds) return
                  finishGattOperation(operation, success, error)
              }
          
              private fun finishGattOperation(operation: GattOperation, success: Boolean, error: String?) {
                  if (activeGattOperation !== operation) return
                  main.removeCallbacksAndMessages(GATT_OPERATION_TOKEN)
                  activeGattOperation = null
                  operation.onComplete(success, error)
                  main.post { pumpGattQueue() }
              }
          
              private fun cancelGattOperations(reason: String) {
                  main.removeCallbacksAndMessages(GATT_OPERATION_TOKEN)
                  val current = activeGattOperation
                  activeGattOperation = null
                  if (current != null) current.onComplete(false, reason)
                  while (gattQueue.isNotEmpty()) gattQueue.removeFirst().onComplete(false, reason)
              }
          
              @SuppressLint("MissingPermission")
              private fun writeCharacteristicCompat(
                  targetGatt: BluetoothGatt,
                  characteristic: BluetoothGattCharacteristic,
                  payload: ByteArray,
                  writeType: Int
              ): Boolean = runCatching {
                  if (targetGatt !== gatt) return@runCatching false
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      targetGatt.writeCharacteristic(characteristic, payload, writeType) == android.bluetooth.BluetoothStatusCodes.SUCCESS
                  } else {
                      @Suppress("DEPRECATION")
                      characteristic.writeType = writeType
                      @Suppress("DEPRECATION")
                      characteristic.value = payload
                      @Suppress("DEPRECATION")
                      targetGatt.writeCharacteristic(characteristic)
                  }
              }.getOrDefault(false)
          
              private fun queueCharacteristicWrite(
                  targetGatt: BluetoothGatt,
                  characteristic: BluetoothGattCharacteristic,
                  payload: ByteArray,
                  writeType: Int,
                  label: String,
                  onComplete: (Boolean, String?) -> Unit = { _, _ -> }
              ) {
                  val safePayload = payload.copyOf()
                  val kind = if (writeType == BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE) {
                      GattOpKind.WRITE_NR
                  } else {
                      GattOpKind.WRITE
                  }
                  enqueueGattOperation(
                      GattOperation(
                          kind = kind,
                          targetUuid = characteristic.uuid,
                          label = label,
                          start = { writeCharacteristicCompat(targetGatt, characteristic, safePayload, writeType) },
                          onComplete = onComplete
                      )
                  )
              }
          
              @SuppressLint("MissingPermission")
              private fun safeDiscoverServices(g: BluetoothGatt): Boolean = runCatching { g.discoverServices() }.getOrDefault(false)
          
              @SuppressLint("MissingPermission")
              private fun renderGatt(g: BluetoothGatt) {
                  gattBox.removeAllViews()
                  val services = runCatching { g.services }.getOrElse { emptyList() }
                  if (services.isEmpty()) {
                      gattBox.addView(label("서비스 없음", 10f, Color.rgb(120,96,104), false))
                      return
                  }
                  services.forEach { service ->
                      gattBox.addView(label("SVC // ${service.uuid}", 9.5f, Color.rgb(170,145,153), true, 9, 2))
                      service.characteristics.forEach { ch ->
                          val props = propertyText(ch.properties)
                          val button = actionButton("CHR // ${ch.uuid}\n$props") {
                              selected = SelectedCharacteristic(service.uuid, ch.uuid, ch.properties)
                              selectedWriteNoResponse = (ch.properties and BluetoothGattCharacteristic.PROPERTY_WRITE) == 0 &&
                                  (ch.properties and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0
                              selection.text = "SELECTED // ${ch.uuid}\n$props"
                              setStatus("특성 선택됨 // ${ch.uuid}")
                          }
                          button.gravity = Gravity.START or Gravity.CENTER_VERTICAL
                          gattBox.addView(button, fullButtonParams(4))
                      }
                  }
              }
          
              private fun propertyText(p: Int): String {
                  val out = mutableListOf<String>()
                  if (p and BluetoothGattCharacteristic.PROPERTY_READ != 0) out += "READ"
                  if (p and BluetoothGattCharacteristic.PROPERTY_WRITE != 0) out += "WRITE"
                  if (p and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE != 0) out += "WRITE_NR"
                  if (p and BluetoothGattCharacteristic.PROPERTY_NOTIFY != 0) out += "NOTIFY"
                  if (p and BluetoothGattCharacteristic.PROPERTY_INDICATE != 0) out += "INDICATE"
                  return if (out.isEmpty()) "NO RW/N" else out.joinToString(" · ")
              }
          
              private fun currentCharacteristic(): BluetoothGattCharacteristic? {
                  val g = gatt ?: return null
                  val s = selected ?: return null
                  return g.getService(s.serviceUuid)?.getCharacteristic(s.characteristicUuid)
              }
          
              @SuppressLint("MissingPermission")
              private fun readSelected() {
                  if (!hasBlePermissions()) return
                  val targetGatt = gatt ?: return toast("BLE 기기에 먼저 연결하세요.")
                  val ch = currentCharacteristic() ?: return toast("먼저 특성을 선택하세요.")
                  if ((ch.properties and BluetoothGattCharacteristic.PROPERTY_READ) == 0) return toast("이 특성은 READ를 지원하지 않습니다.")
                  setStatus("READ QUEUED // ${ch.uuid}")
                  enqueueGattOperation(
                      GattOperation(
                          kind = GattOpKind.READ,
                          targetUuid = ch.uuid,
                          label = "READ ${ch.uuid}",
                          start = { targetGatt === gatt && runCatching { targetGatt.readCharacteristic(ch) }.getOrDefault(false) },
                          onComplete = { success, error ->
                              if (!success) setStatus(error ?: "READ 요청 실패", true)
                          }
                      )
                  )
              }
          
              @SuppressLint("MissingPermission")
              private fun writeSelected(noResponse: Boolean) {
                  if (!hasBlePermissions()) return
                  val targetGatt = gatt ?: return toast("BLE 기기에 먼저 연결하세요.")
                  val ch = currentCharacteristic() ?: return toast("먼저 특성을 선택하세요.")
                  val payload = BleHex.parse(hexInput.text.toString()) ?: return toast("HEX 형식을 확인하세요. 예: 01 00 FF")
                  if (payload.isEmpty()) return toast("전송할 HEX 값을 입력하세요.")
                  val props = ch.properties
                  val writeType = if (noResponse) {
                      if ((props and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) == 0) return toast("이 특성은 WRITE NR을 지원하지 않습니다.")
                      BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                  } else {
                      if ((props and BluetoothGattCharacteristic.PROPERTY_WRITE) == 0) return toast("이 특성은 WRITE를 지원하지 않습니다.")
                      BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                  }
                  selectedWriteNoResponse = noResponse
                  val mode = if (noResponse) "WRITE NR" else "WRITE"
                  val value = BleHex.format(payload)
                  setStatus("$mode QUEUED // $value")
                  queueCharacteristicWrite(targetGatt, ch, payload, writeType, "$mode ${ch.uuid}") { success, error ->
                      if (success && noResponse) setStatus("WRITE NR SENT // $value")
                      else if (!success) setStatus(error ?: "$mode 요청 실패", true)
                  }
              }
          
              @SuppressLint("MissingPermission")
              private fun toggleNotifySelected() {
                  if (!hasBlePermissions()) return
                  val targetGatt = gatt ?: return toast("BLE 기기에 먼저 연결하세요.")
                  val ch = currentCharacteristic() ?: return toast("먼저 특성을 선택하세요.")
                  val props = ch.properties
                  if (props and (BluetoothGattCharacteristic.PROPERTY_NOTIFY or BluetoothGattCharacteristic.PROPERTY_INDICATE) == 0) {
                      return toast("이 특성은 NOTIFY/INDICATE를 지원하지 않습니다.")
                  }
                  val key = "${ch.service.uuid}/${ch.uuid}"
                  val enable = key !in notifications
                  if (!runCatching { targetGatt.setCharacteristicNotification(ch, enable) }.getOrDefault(false)) {
                      setStatus("setCharacteristicNotification 실패", true)
                      return
                  }
                  val cccd = ch.getDescriptor(CCCD_UUID)
                  if (cccd == null) {
                      if (enable) notifications += key else notifications -= key
                      setStatus("로컬 NOTIFY ${if (enable) "ON" else "OFF"} · CCCD 없음")
                      return
                  }
                  val value = if (!enable) BluetoothGattDescriptor.DISABLE_NOTIFICATION_VALUE
                  else if ((props and BluetoothGattCharacteristic.PROPERTY_INDICATE) != 0) BluetoothGattDescriptor.ENABLE_INDICATION_VALUE
                  else BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE
                  setStatus("NOTIFY ${if (enable) "ON" else "OFF"} QUEUED // ${ch.uuid}")
                  enqueueGattOperation(
                      GattOperation(
                          kind = GattOpKind.DESCRIPTOR,
                          targetUuid = ch.uuid,
                          label = "NOTIFY ${if (enable) "ON" else "OFF"} ${ch.uuid}",
                          start = {
                              if (targetGatt !== gatt) false
                              else runCatching {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                      targetGatt.writeDescriptor(cccd, value) == android.bluetooth.BluetoothStatusCodes.SUCCESS
                                  } else {
                                      @Suppress("DEPRECATION")
                                      cccd.value = value
                                      @Suppress("DEPRECATION")
                                      targetGatt.writeDescriptor(cccd)
                                  }
                              }.getOrDefault(false)
                          },
                          onComplete = { success, error ->
                              if (success) {
                                  if (enable) notifications += key else notifications -= key
                              } else {
                                  runCatching { targetGatt.setCharacteristicNotification(ch, !enable) }
                                  setStatus(error ?: "NOTIFY 설정 실패", true)
                              }
                          }
                      )
                  )
              }
          
              @SuppressLint("MissingPermission")
              private fun saveCurrentAsOff() {
                  val device = connectedDevice ?: return toast("BLE 기기에 먼저 연결하세요.")
                  val s = selected ?: return toast("먼저 WRITE 특성을 선택하세요.")
                  if (selectedWriteNoResponse && (s.properties and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) == 0) {
                      return toast("현재 선택된 WRITE NR 방식을 이 특성이 지원하지 않습니다.")
                  }
                  if (!selectedWriteNoResponse && (s.properties and BluetoothGattCharacteristic.PROPERTY_WRITE) == 0) {
                      return toast("현재 선택된 WRITE 방식을 이 특성이 지원하지 않습니다.")
                  }
                  val payload = BleHex.parse(hexInput.text.toString()) ?: return toast("HEX 형식을 확인하세요.")
                  if (payload.isEmpty()) return toast("OFF 명령의 HEX 값을 입력하세요.")
                  val name = runCatching { device.name }.getOrNull() ?: "UNNAMED BLE"
                  BleCommandStore.save(
                      this,
                      SavedBleCommand(
                          device.address,
                          name,
                          s.serviceUuid.toString(),
                          s.characteristicUuid.toString(),
                          BleHex.format(payload),
                          selectedWriteNoResponse
                      )
                  )
                  refreshSavedInfo()
                  toast("현재 명령을 LIGHT OFF로 저장했습니다.")
              }
          
              @SuppressLint("MissingPermission")
              private fun sendSavedOff() {
                  val saved = BleCommandStore.load(this) ?: return setStatus("저장된 LIGHT OFF 명령이 없습니다.", true)
                  val payload = BleHex.parse(saved.payloadHex) ?: return setStatus("저장된 OFF HEX가 올바르지 않습니다.", true)
                  val serviceUuid = runCatching { UUID.fromString(saved.serviceUuid) }.getOrNull()
                      ?: return setStatus("저장된 Service UUID가 올바르지 않습니다.", true)
                  val characteristicUuid = runCatching { UUID.fromString(saved.characteristicUuid) }.getOrNull()
                      ?: return setStatus("저장된 Characteristic UUID가 올바르지 않습니다.", true)
          
                  val currentGatt = gatt
                  val currentDevice = connectedDevice
                  val sameDevice = currentGatt != null && currentDevice != null &&
                      runCatching { currentDevice.address.equals(saved.deviceAddress, ignoreCase = true) }.getOrDefault(false)
          
                  if (sameDevice && currentGatt != null) {
                      val ch = currentGatt.getService(serviceUuid)?.getCharacteristic(characteristicUuid)
                          ?: return setStatus("현재 GATT에서 저장된 OFF 특성을 찾을 수 없습니다.", true)
                      val writeType = if (saved.writeWithoutResponse) {
                          if ((ch.properties and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) == 0) {
                              return setStatus("현재 특성이 저장된 WRITE NR 방식을 지원하지 않습니다.", true)
                          }
                          BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                      } else {
                          if ((ch.properties and BluetoothGattCharacteristic.PROPERTY_WRITE) == 0) {
                              return setStatus("현재 특성이 저장된 WRITE 방식을 지원하지 않습니다.", true)
                          }
                          BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                      }
                      setStatus("SAVED LIGHT OFF // CURRENT GATT QUEUED")
                      queueCharacteristicWrite(currentGatt, ch, payload, writeType, "SAVED LIGHT OFF") { success, error ->
                          if (success) setStatus("SAVED LIGHT OFF // SENT VIA CURRENT GATT")
                          else setStatus("SAVED LIGHT OFF 실패 // ${error ?: "unknown"}", true)
                      }
                      return
                  }
          
                  if (currentGatt != null) {
                      disconnectGatt("저장된 OFF 장치로 전환")
                      if (::gattBox.isInitialized) gattBox.removeAllViews()
                      if (::selection.isInitialized) selection.text = "SELECTED // NONE"
                  }
                  setStatus("저장된 LIGHT OFF 전송 중… 새 GATT 연결")
                  BleCommandSender.sendSavedOff(this) { result ->
                      runOnUiThread {
                          result.onSuccess { setStatus("SAVED LIGHT OFF // SENT") }
                              .onFailure { setStatus("SAVED LIGHT OFF 실패 // ${it.message}", true) }
                      }
                  }
              }
          
              private fun refreshSavedInfo() {
                  val saved = BleCommandStore.load(this)
                  savedInfo.text = if (saved == null) {
                      "SAVED OFF // NONE"
                  } else {
                      "SAVED OFF\nDEVICE  ${saved.deviceName}  ${saved.deviceAddress}\nSERVICE ${saved.serviceUuid}\nCHAR    ${saved.characteristicUuid}\nMODE    ${if (saved.writeWithoutResponse) "WRITE NR" else "WRITE"}\nVALUE   ${saved.payloadHex}"
                  }
              }
          
              private fun reportRead(uuid: UUID, value: ByteArray, statusCode: Int) {
                  runOnUiThread {
                      if (statusCode == BluetoothGatt.GATT_SUCCESS) {
                          hexInput.setText(BleHex.format(value))
                          setStatus("READ OK // $uuid // ${BleHex.format(value)}")
                      } else setStatus("READ FAIL status=$statusCode // $uuid", true)
                  }
              }
          
              private fun reportNotify(uuid: UUID, value: ByteArray) {
                  runOnUiThread { setStatus("NOTIFY // $uuid // ${BleHex.format(value)}") }
              }
          
              private fun setStatus(message: String, error: Boolean = false) {
                  status.text = message
