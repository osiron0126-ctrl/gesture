                  paints.shadowBase.alpha = shadowAlpha
                  paints.pixelGrid.alpha = pixelAlpha
                  paints.macroPixels.alpha = macroAlpha
                  paints.scanlines.alpha = scanAlpha
                  paints.fragment.alpha = fragmentAlpha
              }
          
              private fun drawFragments(
                  canvas: Canvas,
                  points: List<Pair<Float, Float>>,
                  palmWidth: Float,
                  paint: Paint,
                  isLeft: Boolean,
                  active: Boolean
              ) {
                  val density = resources.displayMetrics.density
                  val anchors = intArrayOf(0, 4, 8, 12, 16, 20)
                  val side = if (isLeft) 1f else -1f
                  val base = if (active) palmWidth * .12f else palmWidth * .1f
                  val fragmentScale = arrayOf(
                      floatArrayOf(-2.1f, -0.7f, 1.10f), floatArrayOf(-1.5f, 0.25f, .92f),
                      floatArrayOf(-0.9f, 0.85f, .72f), floatArrayOf(-2.6f, 1.2f, .86f),
                      floatArrayOf(-3.0f, -1.1f, .68f), floatArrayOf(-1.2f, -1.7f, .56f)
                  )
                  for (anchorIndex in anchors.indices) {
                      val anchor = points[anchors[anchorIndex]]
                      val ax = anchor.first * width
                      val ay = anchor.second * height
                      for (offset in fragmentScale) {
                          val size = max(2.2f * density, base * offset[2])
                          val x = ax + side * palmWidth * offset[0]
                          val y = ay + palmWidth * offset[1]
                          canvas.drawRect(x, y, x + size, y + size, paint)
                      }
                  }
              }
          
              private fun smoothClosedBlob(path: Path, points: List<ShapePoint>) {
                  path.rewind()
                  if (points.size < 3) return
                  val first = midpoint(points.last(), points.first())
                  path.moveTo(first.x, first.y)
                  for (index in points.indices) {
                      val current = points[index]
                      val next = points[(index + 1) % points.size]
                      val end = midpoint(current, next)
                      path.quadTo(current.x, current.y, end.x, end.y)
                  }
                  path.close()
              }
          
              private fun smoothFingerRibbon(path: Path, points: List<ShapePoint>, widths: List<Float>) {
                  path.rewind()
                  if (points.size < 2 || points.size != widths.size) return
                  val left = ArrayList<ShapePoint>(points.size)
                  val right = ArrayList<ShapePoint>(points.size)
                  for (index in points.indices) {
                      val before = points[if (index == 0) 0 else index - 1]
                      val after = points[if (index == points.lastIndex) points.lastIndex else index + 1]
                      val dx = after.x - before.x
                      val dy = after.y - before.y
                      val length = hypot(dx, dy).coerceAtLeast(1f)
                      val nx = -dy / length
                      val ny = dx / length
                      left += ShapePoint(points[index].x + nx * widths[index], points[index].y + ny * widths[index])
                      right += ShapePoint(points[index].x - nx * widths[index], points[index].y - ny * widths[index])
                  }
                  path.moveTo(left[0].x, left[0].y)
                  appendSmoothSide(path, left)
                  val tip = points.last()
                  val tipTangent = unitVector(points[points.lastIndex - 1], tip)
                  path.quadTo(
                      tip.x + tipTangent.x * widths.last(),
                      tip.y + tipTangent.y * widths.last(),
                      right.last().x,
                      right.last().y
                  )
                  appendSmoothSide(path, right.asReversed())
                  val base = points.first()
                  val baseTangent = unitVector(points[1], base)
                  path.quadTo(
                      base.x + baseTangent.x * widths.first(),
                      base.y + baseTangent.y * widths.first(),
                      left[0].x,
                      left[0].y
                  )
                  path.close()
              }
          
              private fun appendSmoothSide(path: Path, points: List<ShapePoint>) {
                  if (points.size < 2) return
                  for (index in 1 until points.lastIndex) {
                      val end = midpoint(points[index], points[index + 1])
                      path.quadTo(points[index].x, points[index].y, end.x, end.y)
                  }
                  path.lineTo(points.last().x, points.last().y)
              }
          
              private fun midpoint(a: ShapePoint, b: ShapePoint) =
                  ShapePoint((a.x + b.x) * .5f, (a.y + b.y) * .5f)
          
              private fun unitVector(from: ShapePoint, to: ShapePoint): ShapePoint {
                  val dx = to.x - from.x
                  val dy = to.y - from.y
                  val length = hypot(dx, dy).coerceAtLeast(1f)
                  return ShapePoint(dx / length, dy / length)
              }
          
              private fun distance(a: ShapePoint, b: ShapePoint): Float = hypot(a.x - b.x, a.y - b.y)
          
              private fun drawCursor(canvas: Canvas, now: Long) {
                  cleanupTrail(now)
                  val density = resources.displayMetrics.density
                  for ((index, trailPoint) in trail.withIndex()) {
                      val age = now - trailPoint.at
                      val alpha = (1f - age / 220f).coerceIn(0f, 1f)
                      if (alpha <= 0f) continue
                      trailPaint.alpha = (alpha * (105 + index * 28)).toInt().coerceIn(0, 220)
                      val size = max(2.2f * density, (4.8f - age / 68f) * density)
                      val x = trailPoint.point.first * width
                      val y = trailPoint.point.second * height
                      canvas.drawRect(x - size * .5f, y - size * .5f, x + size * .5f, y + size * .5f, trailPaint)
                  }
                  val point = cursorPoint ?: return
                  if (now > cursorUntil) {
                      cursorPoint = null
                      return
                  }
                  val x = point.first * width
                  val y = point.second * height
                  val pulseProgress = if (now < pulseUntil) 1f - (pulseUntil - now) / 180f else 1f
                  val baseRadius = 10f * density
                  val pulseRadius = baseRadius + 7f * density * pulseProgress
                  cursorRing.alpha = if (now < pulseUntil) 245 else 185
                  canvas.drawCircle(x, y, pulseRadius, cursorRing)
                  canvas.drawCircle(x, y, 2.6f * density, cursorCore)
              }
          
              private fun createDigitalPaints(
                  color: Int,
                  shadowAlpha: Int,
                  pixelAlpha: Int,
                  macroAlpha: Int,
                  scanAlpha: Int,
                  fragmentAlpha: Int
              ): DigitalPaints {
                  val density = resources.displayMetrics.density
          
                  val pixelCell = (6.2f * density).toInt().coerceAtLeast(5)
                  val pixelTile = Bitmap.createBitmap(pixelCell, pixelCell, Bitmap.Config.ARGB_8888)
                  val pixelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { this.color = color }
                  Canvas(pixelTile).apply {
                      drawColor(Color.TRANSPARENT)
                      val square = pixelCell * .54f
                      val inset = (pixelCell - square) * .5f
                      drawRect(inset, inset, inset + square, inset + square, pixelPaint)
                  }
          
                  val macroCell = (26f * density).toInt().coerceAtLeast(18)
                  val macroTile = Bitmap.createBitmap(macroCell, macroCell, Bitmap.Config.ARGB_8888)
                  val macroPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { this.color = Color.rgb(255, 72, 96) }
                  Canvas(macroTile).apply {
                      drawColor(Color.TRANSPARENT)
                      drawRect(macroCell * .10f, macroCell * .12f, macroCell * .28f, macroCell * .30f, macroPaint)
                      drawRect(macroCell * .60f, macroCell * .20f, macroCell * .72f, macroCell * .32f, macroPaint)
                      drawRect(macroCell * .34f, macroCell * .58f, macroCell * .52f, macroCell * .76f, macroPaint)
                  }
          
                  val scanCell = (8f * density).toInt().coerceAtLeast(6)
                  val scanTile = Bitmap.createBitmap(4, scanCell, Bitmap.Config.ARGB_8888)
                  val scanPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { this.color = Color.argb(255, 20, 0, 6) }
                  Canvas(scanTile).apply {
                      drawColor(Color.TRANSPARENT)
                      drawRect(0f, 0f, 4f, max(1f, scanCell * .22f), scanPaint)
                  }
          
                  return DigitalPaints(
                      shadowBase = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          this.color = Color.argb(255, 6, 0, 3)
                          alpha = shadowAlpha
                          style = Paint.Style.FILL
                      },
                      pixelGrid = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          shader = BitmapShader(pixelTile, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                          alpha = pixelAlpha
                          style = Paint.Style.FILL
                      },
                      macroPixels = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          shader = BitmapShader(macroTile, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                          alpha = macroAlpha
                          style = Paint.Style.FILL
                      },
                      scanlines = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          shader = BitmapShader(scanTile, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                          alpha = scanAlpha
                          style = Paint.Style.FILL
                      },
                      fragment = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          this.color = Color.rgb(255, 72, 96)
                          alpha = fragmentAlpha
                          style = Paint.Style.FILL
                      }
                  )
              }
          
              private fun drawVolumeMeter(canvas: Canvas) {
                  val density = resources.displayMetrics.density
                  val meterWidth = 16f * density
                  val meterHeight = (height * .28f).coerceAtLeast(120f * density)
                  val left = width - 34f * density
                  val top = (height - meterHeight) / 2f
                  val radius = meterWidth / 2f
                  canvas.drawRoundRect(left, top, left + meterWidth, top + meterHeight, radius, radius, meterBack)
                  val fraction = (volumeLevel.toFloat() / volumeMaximum).coerceIn(0f, 1f)
                  val fillTop = top + meterHeight * (1f - fraction)
                  canvas.drawRoundRect(left, fillTop, left + meterWidth, top + meterHeight, radius, radius, meterFill)
                  meterText.textSize = 12f * density
                  canvas.drawText(volumeLevel.toString(), left + meterWidth / 2f, top - 9f * density, meterText)
              }
          
              private fun cleanupTrail(now: Long) { trail.removeAll { now - it.at > 220L } }
          
              private fun currentHandAlpha(now: Long): Float {
                  if (hands.isNotEmpty()) return 1f
                  if (fadeStartedAt == 0L) return 0f
                  val alpha = 1f - (now - fadeStartedAt) / 220f
                  if (alpha <= 0f) {
                      fadingHands = emptyList()
                      fadeStartedAt = 0L
                      return 0f
                  }
                  return alpha.coerceIn(0f, 1f)
              }
          
              private fun needsAnimation(now: Long): Boolean =
                  trail.isNotEmpty() || now < cursorUntil || now < pulseUntil || now < volumeUntil ||
                      (fadeStartedAt != 0L && fadingHands.isNotEmpty())
          
              private fun updateVisibility(now: Long) {
                  visibility = if (hands.isEmpty() && fadingHands.isEmpty() && trail.isEmpty() && cursorPoint == null && now >= volumeUntil) GONE else VISIBLE
              }
          }
