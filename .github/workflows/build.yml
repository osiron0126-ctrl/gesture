                  if (proposed == stable) {
                      candidate = stable
                      candidateSince = now
                      return StablePinchPose(stable == Pose.INDEX)
                  }
                  if (proposed != candidate) {
                      candidate = proposed
                      candidateSince = now
                      return StablePinchPose(stable == Pose.INDEX)
                  }
                  val confirmation = if (proposed == Pose.NONE) 90L else 55L
                  if (now - candidateSince >= confirmation) commit(proposed, now)
