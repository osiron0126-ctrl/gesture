          package com.sc.millegesture
          import org.junit.Assert.*
          import org.junit.Test
          class GestureEngineTest {
              private fun fire(e: GestureEngine, dx:Float, dy:Float, t:Long=0):Direction? {
                  e.sample(t,.5f,.5f,true,false,false)
                  return e.sample(t+200,.5f+dx,.5f+dy,true,false,false)
              }
              @Test fun fourDirections() {
                  assertEquals(Direction.RIGHT,fire(GestureEngine(),.2f,0f))
                  assertEquals(Direction.LEFT,fire(GestureEngine(),-.2f,0f))
                  assertEquals(Direction.UP,fire(GestureEngine(),0f,-.2f))
                  assertEquals(Direction.DOWN,fire(GestureEngine(),0f,.2f))
              }
              @Test fun returnDoesNotFireEvenAfterCooldown() {
                  val e=GestureEngine(); fire(e,.2f,0f)
                  for(t in 300L..3000L step 100) assertNull(e.sample(t,.3f,.5f,true,false,false))
              }
              @Test fun briefDropoutDoesNotUnlock() {
                  val e=GestureEngine(); fire(e,.2f,0f)
                  e.sample(300,0f,0f,false,false,true)
                  assertNull(e.sample(400,.7f,.5f,true,false,false))
                  assertNull(e.sample(600,.3f,.5f,true,false,false))
              }
              @Test fun heldFistUnlocks() {
                  val e=GestureEngine(); fire(e,.2f,0f)
                  for(t in 300L..700L step 100) e.sample(t,.5f,.5f,false,true,false)
                  assertEquals(Direction.LEFT,fire(e,-.2f,0f,800))
              }
              @Test fun absentHandUnlocksAfterDelay() {
                  val e=GestureEngine(); fire(e,.2f,0f)
                  for(t in 300L..1100L step 100) e.sample(t,0f,0f,false,false,true)
                  assertEquals(Direction.UP,fire(e,0f,-.2f,1200))
              }
              @Test fun slowMoveAndJitterDoNotFire() {
                  val e=GestureEngine()
                  for(t in 0L..2000L step 100) assertNull(e.sample(t,.5f+t*.00003f,.5f,true,false,false))
              }
              @Test fun diagonalIsIgnored() { assertNull(fire(GestureEngine(),.2f,.2f)) }
              @Test fun stalledStreamDoesNotRearm() {
                  val e=GestureEngine(); fire(e,.2f,0f)
                  e.sample(300,0f,0f,false,false,true)
                  e.sample(2000,0f,0f,false,false,true)
                  assertNull(fire(e,-.2f,0f,2100))
              }
              @Test fun heldPalmCanMoveLater() {
                  val e=GestureEngine()
                  for(t in 0L..3000L step 100) e.sample(t,.5f,.5f,true,false,false)
                  assertEquals(Direction.RIGHT,e.sample(3200,.72f,.5f,true,false,false))
              }
              @Test fun twoFingerPoseUsesHysteresis() {
                  val s = TwoFingerPoseStabilizer()
                  assertFalse(s.sample(0L, .48f, true))
                  assertTrue(s.sample(35L, .48f, true))
                  // Jitter above enter threshold but below exit threshold stays engaged.
                  assertTrue(s.sample(60L, .58f, true))
                  assertTrue(s.sample(120L, .67f, true))
                  assertFalse(s.sample(220L, .67f, true))
              }

              @Test fun twoFingerPoseBriefDropoutDoesNotFlicker() {
                  val s = TwoFingerPoseStabilizer()
                  assertFalse(s.sample(0L, .45f, true))
                  assertTrue(s.sample(40L, .45f, true))
                  assertTrue(s.sample(80L, null, false))
                  assertTrue(s.sample(130L, .46f, true))
              }

          }
