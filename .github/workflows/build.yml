                  if (lastPalmTrackAt == 0L || now - lastPalmTrackAt <= 450L) return
                  lastRightPalm = null
                  lastLeftPalm = null
                  rightPalmVelocity = 0f to 0f
                  leftPalmVelocity = 0f to 0f
                  lastRightPoints = null
                  lastLeftPoints = null
                  lastPalmTrackAt = 0L
