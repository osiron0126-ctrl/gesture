              private fun smooth(next: Pair<Float, Float>): Pair<Float, Float> {
                  val old = filteredPoint ?: return next.also { filteredPoint = it }
                  return (old.first + (next.first - old.first) * .42f to
                      old.second + (next.second - old.second) * .42f).also { filteredPoint = it }
