                  runCatching { unregisterReceiver(screenState) }
                  RuntimeState.clapWaiting = false
                  if (!RuntimeState.running && RuntimeState.message.startsWith("박수 대기")) {
                      RuntimeState.message = "중지됨"
                  }
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  super.onDestroy()
              }
          
              private fun resumeAfterUnlock() {
                  if (!alive) return
                  val power = getSystemService(PowerManager::class.java)
                  val keyguard = getSystemService(KeyguardManager::class.java)
                  if (!power.isInteractive || keyguard.isKeyguardLocked) {
                      pauseForLock()
                      return
                  }
                  if (worker?.isAlive == true) return
                  val generation = audioGeneration + 1
                  audioGeneration = generation
                  RuntimeState.clapWaiting = true
                  if (!RuntimeState.running) RuntimeState.message = "박수 대기 중 · 짧게 두 번 박수"
                  worker = Thread({ recordLoop(generation) }, "clap-monitor").also { it.start() }
                  updateNotification()
              }
          
              private fun pauseForLock() {
                  stopAudioMonitor()
                  RuntimeState.clapWaiting = false
                  RuntimeState.message = "화면 잠금 · 카메라와 마이크 입력 중지"
                  updateNotification()
              }
          
              private fun stopAudioMonitor() {
                  audioGeneration += 1
                  runCatching { activeRecord?.stop() }
                  activeRecord = null
                  worker?.interrupt()
                  worker = null
                  firstClapAt = 0L
                  lastSpikeAt = 0L
              }
          
              @SuppressLint("MissingPermission")
              private fun recordLoop(generation: Int) {
                  if (!hasMicrophonePermission()) {
                      main.post {
                          RuntimeState.clapWaiting = false
                          RuntimeState.message = "박수 대기에 마이크 권한이 필요합니다"
                          stopSelf()
                      }
                      return
                  }
                  val sampleRate = 16000
                  val minSize = AudioRecord.getMinBufferSize(
                      sampleRate,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  ).coerceAtLeast(2048)
                  val record = createAudioRecord(sampleRate, minSize)
                  if (record == null || record.state != AudioRecord.STATE_INITIALIZED) {
                      main.post {
                          RuntimeState.message = "마이크 초기화 실패"
                          stopSelf()
                      }
                      return
                  }
                  val buffer = ShortArray(minSize / 2)
                  try {
                      if (!alive || generation != audioGeneration) return
                      activeRecord = record
                      record.startRecording()
                      while (alive && generation == audioGeneration && !Thread.currentThread().isInterrupted) {
                          val read = record.read(buffer, 0, buffer.size)
                          if (read <= 0) continue
                          val now = SystemClock.uptimeMillis()
                          if (detectClap(buffer, read, now)) {
                              main.post { handleDoubleClap(now) }
                          }
                      }
                  } catch (_: Exception) {
                  } finally {
                      runCatching { record.stop() }
                      record.release()
                      if (activeRecord === record) activeRecord = null
                  }
              }
          
              private fun hasMicrophonePermission(): Boolean =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) ==
                      PackageManager.PERMISSION_GRANTED
          
              @SuppressLint("MissingPermission")
              private fun createAudioRecord(sampleRate: Int, bufferSize: Int): AudioRecord? {
                  if (!hasMicrophonePermission()) return null
                  return try {
                      AudioRecord(
                          MediaRecorder.AudioSource.VOICE_RECOGNITION,
                          sampleRate,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT,
                          bufferSize
                      )
                  } catch (_: SecurityException) {
                      null
                  } catch (_: IllegalArgumentException) {
                      null
                  }
              }
          
              private fun detectClap(buffer: ShortArray, read: Int, now: Long): Boolean {
                  var peak = 0
                  var sum = 0L
                  for (i in 0 until read) {
                      val v = abs(buffer[i].toInt())
                      if (v > peak) peak = v
                      sum += v
                  }
                  val avg = sum.toFloat() / max(read, 1)
                  noiseFloor = noiseFloor * 0.93f + avg * 0.07f
                  val threshold = max(2800f, noiseFloor * 4.2f)
                  if (peak < threshold) {
                      if (firstClapAt != 0L && now - firstClapAt > 700L) firstClapAt = 0L
                      return false
                  }
                  if (now - lastSpikeAt < 85L) return false
                  lastSpikeAt = now
                  if (firstClapAt != 0L && now - firstClapAt in 120L..480L) {
                      firstClapAt = 0L
                      return true
                  }
                  firstClapAt = now
                  return false
              }
          
              private fun handleDoubleClap(now: Long) {
                  if (now - lastToggleAt < 900L) return
                  lastToggleAt = now
                  beep()
                  val power = getSystemService(PowerManager::class.java)
                  val keyguard = getSystemService(KeyguardManager::class.java)
                  if (!power.isInteractive || keyguard.isKeyguardLocked) {
                      RuntimeState.message = "잠금 상태에서는 박수로 시작하지 않습니다"
                      return
                  }
                  if (GestureAccessibilityService.instance == null) {
                      RuntimeState.message = "접근성 서비스를 먼저 켜주세요"
                      return
                  }
                  if (RuntimeState.running) {
                      AppController.stopCamera(this)
                      RuntimeState.message = "카메라 중지 · 박수 대기 유지"
                  } else if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      runCatching { AppController.startCameraNow(this) }
                          .onSuccess { RuntimeState.message = "박수 인식 · 카메라 시작" }
                          .onFailure { RuntimeState.message = "박수는 인식됐지만 카메라 시작 실패: ${it.message}" }
                  } else {
                      RuntimeState.message = "카메라 권한이 필요합니다"
                  }
              }
          
              private fun beep() {
                  runCatching {
                      ToneGenerator(AudioManager.STREAM_NOTIFICATION, 60).apply {
                          startTone(ToneGenerator.TONE_PROP_BEEP, 120)
                          main.postDelayed({ release() }, 160L)
                      }
                  }
              }
          
              private fun notification(): Notification {
                  val content = PendingIntent.getActivity(
                      this,
                      20,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val stop = PendingIntent.getService(
                      this,
                      21,
                      Intent(this, ClapMonitorService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("SC Hand Gesture")
                      .setContentText(
                          if (RuntimeState.clapWaiting) "박수 대기 · 짧게 두 번 박수로 카메라 전환"
                          else "화면 잠금 · 마이크 입력 중지"
                      )
                      .setContentIntent(content)
                      .setOngoing(true)
                      .addAction(0, "중지", stop)
                      .build()
              }
          
              private fun updateNotification() {
                  getSystemService(NotificationManager::class.java).notify(NOTIFICATION_ID, notification())
              }
          }
