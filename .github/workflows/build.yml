                  return CalibrationProgress(stageMessage(null))
              }

              private fun ready(now: Long, count: Int): Boolean = count >= 14 && now - stageStartedAt >= 650L

              private fun noteValidPose() {
                  invalidSince = null
              }

              private fun noteInvalidPose(now: Long) {
                  val since = invalidSince ?: now.also { invalidSince = it }
                  if (now - since >= 450L) {
                      clearCurrentStageSamples()
                      stageStartedAt = now
                      invalidSince = now
                  }
              }

              private fun resetCurrentStage(now: Long) {
                  clearCurrentStageSamples()
                  stageStartedAt = now
                  invalidSince = null
              }

              private fun clearCurrentStageSamples() {
                  when (stage) {
                      1 -> { first.clear(); second.clear() }
                      2 -> { third.clear(); fourth.clear() }
                      3 -> { fifth.clear(); sixth.clear() }
                  }
              }

              private fun stablePair(a: List<Float>, b: List<Float>): Boolean =
                  stableSamples(a) && stableSamples(b)

              private fun stableSamples(values: List<Float>): Boolean {
                  if (values.size < 14) return false
                  val sorted = values.sorted()
                  val center = median(sorted)
                  val mad = median(sorted.map { kotlin.math.abs(it - center) })
                  val low = sorted[((sorted.size - 1) * 1) / 10]
                  val high = sorted[((sorted.size - 1) * 9) / 10]
                  return mad <= .055f && high - low <= .20f
              }

              private fun stageMessage(extra: String?): String {
                  val base = when (stage) {
                      1 -> "자동 보정 1/3 · 오른손을 편하게 펴세요"
                      2 -> "자동 보정 2/3 · 오른손 엄지와 검지를 붙이세요"
                      3 -> "자동 보정 3/3 · 오른손 엄지와 중지를 붙이고 검지는 떼세요"
                      else -> "자동 보정 완료"
                  }
                  return if (extra == null) base else "$base · $extra"
              }

              private fun clearSamples() {
                  first.clear(); second.clear(); third.clear(); fourth.clear(); fifth.clear(); sixth.clear()
                  invalidSince = null
              }

              private fun median(values: List<Float>): Float {
                  val sorted = values.sorted()
                  if (sorted.isEmpty()) return .5f
                  val m = sorted.size / 2
                  return if (sorted.size % 2 == 0) (sorted[m - 1] + sorted[m]) / 2f else sorted[m]
              }

              companion object {
                  internal fun deriveThresholds(
                      openIndex: Float,
                      openMiddle: Float,
                      indexPinch: Float,
                      indexOther: Float,
                      middlePinch: Float,
                      middleOther: Float
                  ): PinchThresholds {
                      fun enter(pinch: Float, open: Float): Float =
                          (pinch + (open - pinch).coerceAtLeast(.08f) * .28f).coerceIn(.20f, .42f)
                      fun hold(pinch: Float, open: Float, enter: Float): Float =
                          maxOf(enter + .055f, pinch + (open - pinch).coerceAtLeast(.08f) * .46f)
                              .coerceIn(enter + .03f, .54f)
                      val indexEnter = enter(indexPinch, openIndex)
                      val middleEnter = enter(middlePinch, openMiddle)
                      val separation = ((indexOther - indexPinch) * .22f).coerceIn(.03f, .09f)
                      val indexAway = maxOf(middleEnter + .08f, middleOther * .72f).coerceIn(.38f, .66f)
                      return PinchThresholds(
                          indexEnter = indexEnter,
                          indexHold = hold(indexPinch, openIndex, indexEnter),
                          middleEnter = middleEnter,
                          middleHold = hold(middlePinch, openMiddle, middleEnter),
                          indexAwayForMiddle = indexAway,
                          indexMiddleSeparation = separation
                      )
                  }
              }
          }

          data class StablePinchPose(val index: Boolean, val middle: Boolean)
          
          /**
           * Adds hysteresis and short time confirmation to the raw fingertip distances.
           * A one-frame landmark wobble therefore cannot release a click, end a drag, or
           * turn the pointer pose into the volume pose.
           */
          class RightPinchPoseStabilizer {
              private enum class Pose { NONE, INDEX, MIDDLE }
          
              private var stable = Pose.NONE
              private var candidate = Pose.NONE
              private var candidateSince = 0L
              private var missingSince: Long? = null
          
              fun reset() {
                  stable = Pose.NONE
                  candidate = Pose.NONE
                  candidateSince = 0L
                  missingSince = null
              }
          
              fun sample(
                  now: Long,
                  indexRatio: Float?,
                  middleRatio: Float?,
                  thresholds: PinchThresholds = PinchThresholds.DEFAULT
              ): StablePinchPose {
                  if (indexRatio == null || middleRatio == null) {
                      val since = missingSince ?: now.also { missingSince = it }
                      if (now - since >= 180L) commit(Pose.NONE, now)
                      return result()
                  }
                  missingSince = null
          
                  val proposed = when (stable) {
                      Pose.INDEX -> if (
                          indexRatio <= thresholds.indexHold &&
                          (indexRatio + thresholds.indexMiddleSeparation < middleRatio ||
                              middleRatio > thresholds.middleEnter + .04f)
                      ) {
                          Pose.INDEX
                      } else rawPose(indexRatio, middleRatio, thresholds)
                      Pose.MIDDLE -> if (
                          middleRatio <= thresholds.middleHold &&
                          indexRatio >= thresholds.indexAwayForMiddle - .06f
                      ) {
                          Pose.MIDDLE
                      } else rawPose(indexRatio, middleRatio, thresholds)
                      Pose.NONE -> rawPose(indexRatio, middleRatio, thresholds)
                  }
          
                  if (proposed == stable) {
                      candidate = stable
                      candidateSince = now
                      return result()
                  }
                  if (proposed != candidate) {
                      candidate = proposed
                      candidateSince = now
                      return result()
                  }
                  val confirmation = if (proposed == Pose.NONE) 90L else 55L
                  if (now - candidateSince >= confirmation) commit(proposed, now)
                  return result()
              }
          
              private fun rawPose(
                  indexRatio: Float,
                  middleRatio: Float,
                  thresholds: PinchThresholds
              ): Pose = when {
                  indexRatio <= thresholds.indexEnter &&
                      indexRatio + thresholds.indexMiddleSeparation < middleRatio -> Pose.INDEX
                  middleRatio <= thresholds.middleEnter &&
                      indexRatio >= thresholds.indexAwayForMiddle -> Pose.MIDDLE
                  else -> Pose.NONE
              }
          
              private fun commit(next: Pose, now: Long) {
                  stable = next
                  candidate = next
                  candidateSince = now
              }
          
              private fun result() = StablePinchPose(
                  index = stable == Pose.INDEX,
                  middle = stable == Pose.MIDDLE
              )
          }
          
          /**
           * Distinguishes the right-hand pointer pinch from the volume pinch and owns
