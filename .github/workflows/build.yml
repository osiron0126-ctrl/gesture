name: Build SC Hand Gesture APK v33 single-camera tracking stabilization

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Workflow marker
        run: echo "SC Hand Gesture v33 responsive continuous scroll workflow active"

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated-android
          mkdir -p generated-android/app
          cat > generated-android/app/build.gradle.kts <<'SC_FILE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.sc.millegesture"
              compileSdk = 35
          
              defaultConfig {
                  applicationId = "com.sc.millegesture"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 33
                  versionName = "33.0.0"
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              testImplementation("junit:junit:4.13.2")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.lifecycle:lifecycle-service:2.8.7")
          
              val camerax = "1.4.1"
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
          
              implementation("com.google.mediapipe:tasks-vision:1.0.0")
          }
          SC_FILE_EOF
          mkdir -p generated-android/app
          cat > generated-android/app/proguard-rules.pro <<'SC_FILE_EOF'
          # No shrinking in v1.
          SC_FILE_EOF
          mkdir -p generated-android/app/src/main
          cat > generated-android/app/src/main/AndroidManifest.xml <<'SC_FILE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" tools:node="remove" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" tools:node="remove" />
          
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
          
              <uses-feature
                  android:name="android.hardware.camera.front"
                  android:required="true" />
          
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
