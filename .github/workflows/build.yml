                  startedAt = 0L
                  missingSince = null
                  startPoint = null
                  rawStartPoint = null
                  filteredPoint = null
                  lastDragPoint = null
              }

              private fun distance(a: Pair<Float, Float>, b: Pair<Float, Float>): Float = hypot(
                  (a.first - b.first).toDouble(),
                  (a.second - b.second).toDouble()
              ).toFloat()
          }

