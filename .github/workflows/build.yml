                              return
                          }
                          if (newState == android.bluetooth.BluetoothProfile.STATE_CONNECTED) {
                              if (!gatt.discoverServices()) {
                                  finish(Result.failure(IllegalStateException("GATT 서비스 검색 시작 실패")))
                              }
                          } else if (newState == android.bluetooth.BluetoothProfile.STATE_DISCONNECTED) {
                              finish(Result.failure(IllegalStateException("BLE 연결이 끊어졌습니다.")))
                          }
                      }
          
                      override fun onServicesDiscovered(gatt: BluetoothGatt, status: Int) {
                          if (finished.get()) return
                          if (status != BluetoothGatt.GATT_SUCCESS) {
                              finish(Result.failure(IllegalStateException("GATT 서비스 검색 실패 status=$status")))
                              return
                          }
                          val ch = gatt.getService(serviceUuid)?.getCharacteristic(charUuid)
                              ?: run {
                                  finish(Result.failure(IllegalStateException("저장된 GATT 특성을 찾을 수 없습니다.")))
                                  return
                              }
                          val props = ch.properties
                          val writeType = if (command.writeWithoutResponse) {
                              if ((props and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) == 0) {
                                  finish(Result.failure(IllegalStateException("저장된 WRITE NR 방식이 현재 특성에서 지원되지 않습니다.")))
                                  return
                              }
                              BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                          } else {
                              if ((props and BluetoothGattCharacteristic.PROPERTY_WRITE) == 0) {
                                  finish(Result.failure(IllegalStateException("저장된 WRITE 방식이 현재 특성에서 지원되지 않습니다.")))
                                  return
                              }
                              BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                          }
                          val accepted = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              gatt.writeCharacteristic(ch, payload, writeType) == android.bluetooth.BluetoothStatusCodes.SUCCESS
