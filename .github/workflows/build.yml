name: Build SC Hand Gesture APK v48 Bluetooth Lab

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Workflow marker
        run: echo "SC Hand Gesture v48 Bluetooth Lab workflow active"

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated-android
          mkdir -p generated-android/app
          cat > generated-android/app/build.gradle.kts <<'SC_FILE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.sc.millegesture"
              compileSdk = 35
          
              defaultConfig {
                  applicationId = "com.sc.millegesture"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 48
                  versionName = "48.0.0"
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              testImplementation("junit:junit:4.13.2")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.lifecycle:lifecycle-service:2.8.7")
          
              val camerax = "1.4.1"
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
          
              implementation("com.google.mediapipe:tasks-vision:1.0.0")
          }
          SC_FILE_EOF
          mkdir -p generated-android/app
          cat > generated-android/app/proguard-rules.pro <<'SC_FILE_EOF'
          # No shrinking in v1.
          SC_FILE_EOF
          mkdir -p generated-android/app/src/main
          cat > generated-android/app/src/main/AndroidManifest.xml <<'SC_FILE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" tools:node="remove" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" tools:node="remove" />
          
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />

              <!-- BLE Lab: Android 12+ nearby-device permissions; legacy scan permissions stop at API 30. -->
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation"
                  tools:targetApi="s" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          
              <uses-feature
                  android:name="android.hardware.camera.front"
                  android:required="true" />
          
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.SCMilleGesture"
                  android:usesCleartextTraffic="false">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".BluetoothLabActivity"
                      android:exported="false" />
          
                  <service
                      android:name=".GestureCameraService"
                      android:exported="false"
                      android:foregroundServiceType="camera" />
          
                  <service
                      android:name=".ClapMonitorService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
          
                  <service
                      android:name=".GestureAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          SC_FILE_EOF
          mkdir -p generated-android/app/src/main/java/com/sc/millegesture
          cat > generated-android/app/src/main/java/com/sc/millegesture/GestureAccessibilityService.kt <<'SC_FILE_EOF'
          package com.sc.millegesture
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.KeyguardManager
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityWindowInfo
          
          class GestureAccessibilityService : AccessibilityService() {
              companion object { @Volatile var instance: GestureAccessibilityService? = null; private set }
              private var busy = false
              private val handler = Handler(Looper.getMainLooper())
              private var dragStroke: GestureDescription.StrokeDescription? = null
              private var dragBounds: Rect? = null
              private var dragLast: Pair<Float, Float>? = null
              private var dragPending: Pair<Float, Float>? = null
              private var dragEnding = false
              private var dragDispatching = false
              private var notificationOpenedByGesture = false
              private var screenshotPending = false
              private val screenshotRestoreRunnable = Runnable { finishScreenshotCapture() }
              private val screenshotCaptureRunnable = Runnable {
                  if (!screenshotPending || instance !== this) return@Runnable
                  val accepted = performGlobalAction(GLOBAL_ACTION_TAKE_SCREENSHOT)
                  if (!accepted) {
                      RuntimeState.message = "스크린샷 실행 실패"
                      finishScreenshotCapture()
                      return@Runnable
                  }
                  // Keep our overlay surface detached until the system capture/animation has settled.
                  handler.postDelayed(screenshotRestoreRunnable, 560L)
              }
              override fun onServiceConnected() { super.onServiceConnected(); instance = this }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString()
                  if (notificationOpenedByGesture && !pkg.isNullOrBlank() && pkg != "com.android.systemui") {
                      notificationOpenedByGesture = false
                  }
              }
              override fun onInterrupt() { AppController.stopAll(this); HandOverlayManager.remove() }
              override fun onDestroy() {
                  handler.removeCallbacks(screenshotCaptureRunnable)
                  handler.removeCallbacks(screenshotRestoreRunnable)
                  screenshotPending = false
                  if (instance === this) instance = null
                  AppController.stopAll(this)
                  // remove() also clears capture suppression, so a restarted service can always redraw.
                  HandOverlayManager.remove(); handler.removeCallbacksAndMessages(null); super.onDestroy()
              }
              private fun focusedApplication(): Pair<AccessibilityWindowInfo, Rect>? {
                  val win = windows.firstOrNull {
                      it.type == AccessibilityWindowInfo.TYPE_APPLICATION && it.isFocused
                  } ?: windows.firstOrNull {
                      it.type == AccessibilityWindowInfo.TYPE_APPLICATION && it.isActive
                  } ?: return null
                  val root = win.root ?: return null
                  val pkg = root.packageName?.toString()
                  @Suppress("DEPRECATION") root.recycle()
                  if (pkg == packageName) return null
                  val bounds = Rect()
                  win.getBoundsInScreen(bounds)
                  if (bounds.width() < 100 || bounds.height() < 100) return null
                  return win to bounds
              }
          
              fun tapAt(normalizedX: Float, normalizedY: Float): Boolean {
                  if (screenshotPending || busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                  val (_, bounds) = focusedApplication() ?: return false
                  val x = (bounds.left + normalizedX.coerceIn(0.01f, 0.99f) * bounds.width())
                      .coerceIn(bounds.left.toFloat(), bounds.right.toFloat() - 1f)
                  val y = (bounds.top + normalizedY.coerceIn(0.01f, 0.99f) * bounds.height())
                      .coerceIn(bounds.top.toFloat(), bounds.bottom.toFloat() - 1f)
                  return dispatchTap(x, y)
              }
          
              /** Begins a real continued touch so compatible apps receive pointer-down and movement. */
              fun startDrag(
                  normalizedStart: Pair<Float, Float>,
                  normalizedCurrent: Pair<Float, Float>
              ): Boolean {
                  if (screenshotPending || busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                  val (_, bounds) = focusedApplication() ?: return false
                  val start = mapPoint(normalizedStart, bounds)
                  val current = mapPoint(normalizedCurrent, bounds)
                  val path = Path().apply {
                      moveTo(start.first, start.second)
                      if (distance(start, current) >= 1f) lineTo(current.first, current.second)
                  }
                  val stroke = GestureDescription.StrokeDescription(path, 0L, 140L, true)
                  busy = true
                  dragBounds = Rect(bounds)
                  dragLast = current
                  dragPending = null
                  dragEnding = false
                  return dispatchDragStroke(stroke, finalStroke = false)
              }
          
              /** Stores only the newest camera position while the previous drag segment is dispatched. */
              fun moveDrag(normalizedPoint: Pair<Float, Float>): Boolean {
                  val bounds = dragBounds ?: return false
                  if (dragStroke == null || dragEnding) return false
                  dragPending = mapPoint(normalizedPoint, bounds)
                  return true
              }
          
              /** Releases the continued touch at the last delivered point. */
              fun endDrag(): Boolean {
                  if (dragStroke == null) return false
                  dragEnding = true
                  if (!dragDispatching) dispatchNextDragSegment()
                  return true
              }
          
              private fun dispatchTap(x: Float, y: Float): Boolean {
                  val path = Path().apply { moveTo(x, y) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 80L))
                      .build()
                  busy = true
                  val accepted = dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) { busy = false }
                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          busy = false
                          RuntimeState.message = "터치 취소됨 · 다시 시도하세요"
                      }
                  }, handler)
                  if (!accepted) busy = false
                  return accepted
              }
          
              private fun dispatchDragStroke(
                  stroke: GestureDescription.StrokeDescription,
                  finalStroke: Boolean
              ): Boolean {
                  dragStroke = stroke
                  dragDispatching = true
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  val accepted = dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          dragDispatching = false
                          if (finalStroke) clearDrag() else dispatchNextDragSegment()
                      }
          
                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          clearDrag()
                          RuntimeState.message = "드래그 취소됨 · 다시 시도하세요"
                      }
                  }, handler)
                  if (!accepted) clearDrag()
                  return accepted
              }
          
              private fun dispatchNextDragSegment() {
                  val previousStroke = dragStroke ?: return
                  val last = dragLast ?: return clearDrag()
                  val target = dragPending
                  dragPending = null
                  val finalStroke = dragEnding
                  val path = Path().apply {
                      moveTo(last.first, last.second)
                      if (target != null && distance(last, target) >= 1f) {
                          lineTo(target.first, target.second)
                      }
                  }
                  if (target != null) dragLast = target
                  val duration = when {
                      finalStroke -> 1L
                      target != null -> 90L
                      else -> 180L
                  }
                  val continuation = previousStroke.continueStroke(path, 0L, duration, !finalStroke)
                  dispatchDragStroke(continuation, finalStroke)
              }
          
              private fun clearDrag() {
                  dragStroke = null
                  dragBounds = null
                  dragLast = null
                  dragPending = null
                  dragEnding = false
                  dragDispatching = false
                  busy = false
              }
          
              private fun mapPoint(normalized: Pair<Float, Float>, bounds: Rect): Pair<Float, Float> {
                  val x = bounds.left + normalized.first.coerceIn(.01f, .99f) * bounds.width()
                  val y = bounds.top + normalized.second.coerceIn(.01f, .99f) * bounds.height()
                  return x.coerceIn(bounds.left.toFloat(), bounds.right.toFloat() - 1f) to
                      y.coerceIn(bounds.top.toFloat(), bounds.bottom.toFloat() - 1f)
              }
          
              private fun distance(a: Pair<Float, Float>, b: Pair<Float, Float>): Float = kotlin.math.hypot(
                  (a.first - b.first).toDouble(),
                  (a.second - b.second).toDouble()
              ).toFloat()
          
              fun performScroll(direction: Direction): Boolean = performScroll(direction, 1f, 0f)

              fun performScroll(direction: Direction, intensity: Float, momentum: Float): Boolean {
                  if (screenshotPending || busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                  val (_, b) = focusedApplication() ?: return false
                  if (b.width() < 100 || b.height() < 100) return false
                  val prefs = getSharedPreferences("settings", MODE_PRIVATE)
                  val cx = b.exactCenterX()
                  val cy = b.exactCenterY()
                  val path = Path()
                  val tunedIntensity = intensity.coerceIn(.72f, 1.85f)
                  val tunedMomentum = momentum.coerceIn(0f, .9f)
                  val baseSpan = .16f + .42f * prefs.getInt("distance", 50).coerceIn(0, 100) / 100f
                  val span = (baseSpan * tunedIntensity * (1f + tunedMomentum * .18f)).coerceIn(.12f, .82f)
                  val duration = (420f - (tunedIntensity - 1f) * 120f - tunedMomentum * 70f).toLong().coerceIn(180L, 430L)
                  when (direction) {
                      Direction.LEFT, Direction.RIGHT -> {
                          var right = direction == Direction.RIGHT
                          if (prefs.getBoolean("reverseX", false)) right = !right
                          val delta = b.width() * span / 2f
                          if (right) {
                              path.moveTo(cx - delta, cy)
                              path.lineTo(cx + delta, cy)
                          } else {
                              path.moveTo(cx + delta, cy)
                              path.lineTo(cx - delta, cy)
                          }
                      }
                      Direction.UP, Direction.DOWN -> {
                          var down = direction == Direction.DOWN
                          if (prefs.getBoolean("reverseY", false)) down = !down
                          val delta = b.height() * span / 2f
                          if (down) {
                              path.moveTo(cx, cy - delta)
                              path.lineTo(cx, cy + delta)
                          } else {
                              path.moveTo(cx, cy + delta)
                              path.lineTo(cx, cy - delta)
                          }
                      }
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, duration))
                      .build()
                  busy = true
                  val accepted = dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) { busy = false }
                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          busy = false
                          RuntimeState.message = "스크롤 취소됨 · 다시 시도하세요"
                      }
                  }, handler)
                  if(!accepted) busy = false
                  return accepted
              }

              fun performBack(): Boolean {
                  if (screenshotPending || busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                  return performGlobalAction(GLOBAL_ACTION_BACK)
              }

              fun performHome(): Boolean {
                  if (screenshotPending || busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                  return performGlobalAction(GLOBAL_ACTION_HOME)
              }

              /**
               * Detect the expanded SystemUI surface instead of trusting only our previous toggle.
               * Status/navigation bars are wide but shallow; the notification shade is both
               * substantial in width and height, including Samsung tablet's side-oriented shade.
               */
              private fun notificationShadeVisible(): Boolean {
                  val screenW = resources.displayMetrics.widthPixels.coerceAtLeast(1)
                  val screenH = resources.displayMetrics.heightPixels.coerceAtLeast(1)
                  return windows.any { win ->
                      val root = win.root ?: return@any false
                      val pkg = root.packageName?.toString()
                      @Suppress("DEPRECATION") root.recycle()
                      if (pkg != "com.android.systemui") return@any false
                      val bounds = Rect()
                      win.getBoundsInScreen(bounds)
                      bounds.width().toFloat() >= screenW * .25f &&
                          bounds.height().toFloat() >= screenH * .20f
                  }
              }

              fun toggleNotificationShade(): Boolean {
                  if (screenshotPending || busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                  val visibleNow = notificationShadeVisible()
                  // SystemUI can occasionally expose a window without a retrievable root.
                  // If this gesture opened the shade and no foreground-app window event has
                  // invalidated that state, use the cached bit as a safe close fallback.
                  val shouldClose = visibleNow || notificationOpenedByGesture
                  return if (shouldClose) {
                      val ok = performGlobalAction(GLOBAL_ACTION_BACK)
                      if (ok) notificationOpenedByGesture = false
                      ok
                  } else {
                      // If our cached bit became stale because the user manually closed the shade,
                      // never issue a destructive BACK into the foreground app: safely reopen it.
                      notificationOpenedByGesture = false
                      val ok = performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS)
                      if (ok) notificationOpenedByGesture = true
                      ok
                  }
              }

              fun isScreenshotPending(): Boolean = screenshotPending

              private fun finishScreenshotCapture() {
                  handler.removeCallbacks(screenshotRestoreRunnable)
                  screenshotPending = false
                  HandOverlayManager.setCaptureSuppressed(false)
              }

              fun takeScreenshot(includeHands: Boolean): Boolean {
                  if (screenshotPending || busy || getSystemService(KeyguardManager::class.java).isKeyguardLocked) return false
                  if (Build.VERSION.SDK_INT < 28) return false
                  if (includeHands) return performGlobalAction(GLOBAL_ACTION_TAKE_SCREENSHOT)

                  // Removing the overlay window is more deterministic than merely drawing it
                  // transparent. While the compositor transaction is active, all gesture injection
                  // is gated so no BACK/HOME/tap/scroll can race the screenshot.
                  screenshotPending = true
                  HandOverlayManager.setCaptureSuppressed(true)
                  handler.removeCallbacks(screenshotCaptureRunnable)
                  handler.removeCallbacks(screenshotRestoreRunnable)
                  handler.postDelayed(screenshotCaptureRunnable, 180L)
                  return true
              }
          }
          SC_FILE_EOF
          mkdir -p generated-android/app/src/main/java/com/sc/millegesture
          cat > generated-android/app/src/main/java/com/sc/millegesture/GestureCameraService.kt <<'SC_FILE_EOF'
          package com.sc.millegesture
          
          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.hardware.display.DisplayManager
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.Size
          import android.view.Surface
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageProxy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.LifecycleService
          import com.google.mediapipe.framework.image.BitmapImageBuilder
          import com.google.mediapipe.tasks.components.containers.Category
          import com.google.mediapipe.tasks.core.BaseOptions
          import com.google.mediapipe.tasks.core.Delegate
          import com.google.mediapipe.tasks.vision.core.RunningMode
          import com.google.mediapipe.tasks.vision.handlandmarker.HandLandmarker
          import com.google.mediapipe.tasks.vision.handlandmarker.HandLandmarkerResult
          import java.util.concurrent.Executors
          
          /** 25 FPS while a hand is active; 12 FPS after three quiet seconds. */
          internal fun adaptiveFrameIntervalMs(
              now: Long,
              lastHandDetectedAt: Long,
              calibrationActive: Boolean
          ): Long {
              if (calibrationActive) return 40L
              return if (now - lastHandDetectedAt >= 3000L) 83L else 40L
          }
          
          class GestureCameraService : LifecycleService() {
              companion object {
                  const val ACTION_STOP = "com.sc.millegesture.STOP"
                  private const val CHANNEL_ID = "gesture_camera"
                  private const val NOTIFICATION_ID = 4101
              }
          
              private val worker = Executors.newSingleThreadExecutor()
              private val main = Handler(Looper.getMainLooper())
              private var provider: ProcessCameraProvider? = null
              private var analysis: ImageAnalysis? = null
              private var landmarker: HandLandmarker? = null // Created and closed on worker.
              private val twoFingerEngine = TwoFingerGestureEngine() // Used only on main.
              private val systemGestureEngine = SystemGestureEngine() // Used only on main.
              private val lockPoseEngine = LockPoseEngine() // Used only on main.
              private val screenshotPoseEngine = StablePoseHoldEngine(900L) // Right V, still.
              private val notificationPoseEngine = StablePoseHoldEngine(900L) // Left thumb+pinky, still.
              private val rightInputEngine = RightHandInputEngine() // Used only on main.
              private val rightPinchStabilizer = RightPinchPoseStabilizer() // Used only on main.
              private val leftTwoFingerPoseStabilizer = TwoFingerPoseStabilizer() // Used only on main.
              private val rightTwoFingerPoseStabilizer = TwoFingerPoseStabilizer() // Used only on main.
              private val calibrationEngine = AutoPinchCalibrationEngine() // Worker thread only.
              private var pinchThresholds = PinchThresholds.DEFAULT
              private var handledCalibrationGeneration = -1 // Main thread only.
              @Volatile private var alive = true
              private var started = false
              private var failed = false
              private var lastSubmitted = 0L
              private var lastHandDetectedAt = 0L
              private var startAt = 0L
              private var lastRotation = -1
              private var framesFailed = 0
              private var lastRightPalm: Pair<Float, Float>? = null // Worker thread only.
              private var lastLeftPalm: Pair<Float, Float>? = null // Worker thread only.
              private var rightPalmVelocity: Pair<Float, Float> = 0f to 0f // normalized units / second
              private var leftPalmVelocity: Pair<Float, Float> = 0f to 0f
              private var lastPalmTrackAt = 0L
              private var lastRightPoints: List<Pair<Float, Float>>? = null
              private var lastLeftPoints: List<Pair<Float, Float>>? = null

              // Gesture actions and overlay rendering share the process main looper. Keep only
              // one not-yet-run gesture frame so an action cannot build a stale frame backlog.
              private val framePostLock = Any()
              @Volatile private var pendingGestureFrame: Runnable? = null

              private fun postLatestGestureFrame(block: () -> Unit) {
                  lateinit var task: Runnable
                  task = Runnable {
                      synchronized(framePostLock) {
                          if (pendingGestureFrame === task) pendingGestureFrame = null
                      }
                      block()
                  }
                  synchronized(framePostLock) {
                      pendingGestureFrame?.let { main.removeCallbacks(it) }
                      pendingGestureFrame = task
                      main.post(task)
                  }
              }

              private val screenOff = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) { stopSelf() }
              }
          
              private val watchdog = object : Runnable {
                  override fun run() {
                      if (!alive || !started) return
                      if (GestureAccessibilityService.instance == null) {
                          fail("접근성 연결이 끊겼습니다")
                          return
                      }
                      val since = if (RuntimeState.lastFrame == 0L) startAt else RuntimeState.lastFrame
                      if (SystemClock.uptimeMillis() - since > 15000L) {
                          fail("15초 동안 카메라 영상 없음 · 카메라를 쓰는 앱을 닫고 다시 START")
                          return
                      }
                      main.postDelayed(this, 1000L)
                  }
              }
          
              override fun onCreate() {
                  super.onCreate()
                  pinchThresholds = PinchCalibrationStore.load(getSharedPreferences("settings", MODE_PRIVATE))
                  getSystemService(NotificationManager::class.java).createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "손 제스처", NotificationManager.IMPORTANCE_LOW)
                  )
                  ContextCompat.registerReceiver(
                      this,
                      screenOff,
                      IntentFilter(Intent.ACTION_SCREEN_OFF),
                      ContextCompat.RECEIVER_NOT_EXPORTED
                  )
              }
          
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  // LifecycleService must receive the parent start callback before work begins.
                  super.onStartCommand(intent, flags, startId)
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  try {
                      startForeground(NOTIFICATION_ID, notification())
                  } catch (e: Exception) {
                      fail("카메라 서비스 시작 실패: ${e.message}")
                      return START_NOT_STICKY
                  }
                  if (started) return START_NOT_STICKY
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      fail("카메라 권한이 필요합니다")
                      return START_NOT_STICKY
                  }
          
                  started = true
                  RuntimeState.running = true
                  RuntimeState.lastFrame = 0L
                  RuntimeState.message = "모델·카메라 준비 중"
                  startAt = SystemClock.uptimeMillis()
                  lastHandDetectedAt = startAt
                  RuntimeState.analysisFps = 25
                  RuntimeState.modelDelegate = "STARTING"
                  RuntimeState.gestureLocked = false
                  twoFingerEngine.reset()
                  systemGestureEngine.reset()
                  lockPoseEngine.reset()
                  screenshotPoseEngine.reset()
                  notificationPoseEngine.reset()
                  rightInputEngine.reset()
                  rightPinchStabilizer.reset()
                  leftTwoFingerPoseStabilizer.reset()
                  rightTwoFingerPoseStabilizer.reset()
                  main.post(watchdog)
          
                  worker.execute {
                      try {
                          // GPU first, CPU fallback. The HandLandmarker is created and consumed on
                          // this same single worker thread, satisfying the MediaPipe GPU thread rule.
                          val gpuAttempt = runCatching { createLandmarker(Delegate.GPU) }
                          if (gpuAttempt.isSuccess) {
                              landmarker = gpuAttempt.getOrThrow()
                              RuntimeState.modelDelegate = "GPU"
                          } else {
                              landmarker = createLandmarker(Delegate.CPU)
                              RuntimeState.modelDelegate = "CPU FALLBACK"
                          }
                          main.post { if (alive) startCamera() }
                      } catch (e: Exception) {
                          main.post { if (alive) fail("인식 모델 오류: ${e.message}") }
                      }
                  }
                  return START_NOT_STICKY
              }
          
              private fun createLandmarker(delegate: Delegate): HandLandmarker {
                  val baseOptions = BaseOptions.builder()
                      .setModelAssetPath("hand_landmarker.task")
                      .setDelegate(delegate)
                      .build()
                  val options = HandLandmarker.HandLandmarkerOptions.builder()
                      .setBaseOptions(baseOptions)
                      .setRunningMode(RunningMode.VIDEO)
                      .setNumHands(2)
                      // Geometry + temporal hysteresis below reject transient noise; 0.45 keeps
                      // genuine touching-finger poses from flickering out in ordinary lighting.
                      .setMinHandDetectionConfidence(.45f)
                      .setMinHandPresenceConfidence(.45f)
                      .setMinTrackingConfidence(.45f)
                      .build()
                  return HandLandmarker.createFromOptions(this, options)
              }

              private fun rotation(): Int = getSystemService(DisplayManager::class.java)
                  .getDisplay(android.view.Display.DEFAULT_DISPLAY)?.rotation ?: Surface.ROTATION_0
          
              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      if (!alive) return@addListener
                      try {
                          val cameraProvider = future.get()
                          provider = cameraProvider
                          @Suppress("DEPRECATION")
                          val useCase = ImageAnalysis.Builder()
                              .setTargetResolution(Size(640, 480))
                              .setTargetRotation(rotation())
                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                              .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)
                              .build()
                          analysis = useCase
                          useCase.setAnalyzer(worker) { frame -> analyze(frame) }
                          val camera = cameraProvider.bindToLifecycle(
                              this,
                              CameraSelector.DEFAULT_FRONT_CAMERA,
                              useCase
                          )
                          camera.cameraInfo.cameraState.observe(this) { state ->
                              if (state.error != null) {
                                  RuntimeState.message =
                                      "카메라 상태 오류 ${state.error?.code} · 다른 카메라 앱을 닫으세요"
                              }
                          }
                      } catch (e: Exception) {
                          fail("카메라 연결 실패: ${e.message}")
                      }
                  }, ContextCompat.getMainExecutor(this))
              }
          
              private fun analyze(frame: ImageProxy) {
                  var raw: Bitmap? = null
                  var transformed: Bitmap? = null
                  try {
                      if (!alive) return
                      val now = SystemClock.uptimeMillis()
                      val frameInterval = adaptiveFrameIntervalMs(
                          now = now,
                          lastHandDetectedAt = lastHandDetectedAt,
                          calibrationActive = RuntimeState.calibrationActive
                      )
                      if (now - lastSubmitted < frameInterval) return
                      lastSubmitted = now
                      RuntimeState.lastFrame = now
          
                      val currentRotation = rotation()
                      if (currentRotation != lastRotation) {
                          lastRotation = currentRotation
                          // Rotation changes the coordinate basis. Do not carry temporal
                          // tracking or pose history across the new orientation.
                          lastRightPalm = null
                          lastLeftPalm = null
                          rightPalmVelocity = 0f to 0f
                          leftPalmVelocity = 0f to 0f
                          lastRightPoints = null
                          lastLeftPoints = null
                          lastPalmTrackAt = 0L
                          main.post {
                              if (alive) {
                                  analysis?.targetRotation = currentRotation
                                  twoFingerEngine.reset()
                                  systemGestureEngine.reset()
                                  lockPoseEngine.reset()
                                  screenshotPoseEngine.reset()
                                  notificationPoseEngine.reset()
                                  rightInputEngine.reset()?.let {
                                      GestureAccessibilityService.instance?.endDrag()
                                  }
                                  rightPinchStabilizer.reset()
                                  leftTwoFingerPoseStabilizer.reset()
                                  rightTwoFingerPoseStabilizer.reset()
                                  HandOverlayManager.offerLatest(emptyList())
                              }
                          }
                          return
                      }
          
                      // ImageProxy.toBitmap handles RGBA row stride and padding correctly.
                      val bitmap = frame.toBitmap()
                      raw = bitmap
                      val matrix = Matrix().apply {
                          postRotate(frame.imageInfo.rotationDegrees.toFloat())
                          postScale(-1f, 1f)
                      }
                      val rotated = Bitmap.createBitmap(
                          bitmap, 0, 0, bitmap.width, bitmap.height, matrix, true
                      )
                      transformed = rotated
                      val image = BitmapImageBuilder(rotated).build()
                      val result = try {
                          landmarker?.detectForVideo(image, now)
                      } finally {
                          image.close()
                      }
                      if (result == null) return
                      // Any successfully analyzed frame proves the vision pipeline recovered.
                      framesFailed = 0
          
                      val hands = classifyHands(result, now)
                      if (hands.isNotEmpty()) lastHandDetectedAt = now
                      RuntimeState.analysisFps = if (
                          RuntimeState.calibrationActive || now - lastHandDetectedAt < 3000L
                      ) 25 else 12
                      val right = hands.firstOrNull { it.isRight }
                      val left = hands.firstOrNull { it.isLeft }
                      val shadows = hands.filter { it.points.size == 21 }
                      val indexRatio = right?.thumbIndexRatio
                      val middleRatio = right?.thumbMiddleRatio

                      if (RuntimeState.calibrationActive) {
                          val progress = calibrationEngine.sample(
                              now = now,
                              generation = RuntimeState.calibrationGeneration,
                              indexRatio = indexRatio,
                              middleRatio = middleRatio
                          )
                          if (progress.cancelled) {
                              RuntimeState.calibrationActive = false
                          }
                          progress.thresholds?.let { calibrated ->
                              val saved = PinchCalibrationStore.save(
                                  getSharedPreferences("settings", MODE_PRIVATE), calibrated
                              )
                              pinchThresholds = if (saved) calibrated else PinchThresholds.DEFAULT
                              rightPinchStabilizer.reset()
                              RuntimeState.calibrationActive = false
                          }
                          val calibrationGeneration = RuntimeState.calibrationGeneration
                          HandOverlayManager.offerLatest(shadows)
                          main.post {
                              if (!alive) return@post
                              if (handledCalibrationGeneration != calibrationGeneration) {
                                  handledCalibrationGeneration = calibrationGeneration
                                  rightInputEngine.reset()?.let {
                                      GestureAccessibilityService.instance?.endDrag()
                                  }
                                  twoFingerEngine.reset()
                                  systemGestureEngine.reset()
                                  lockPoseEngine.reset()
                                  screenshotPoseEngine.reset()
                                  notificationPoseEngine.reset()
                                  rightPinchStabilizer.reset()
                                  leftTwoFingerPoseStabilizer.reset()
                                  rightTwoFingerPoseStabilizer.reset()
                              }
                              RuntimeState.message = progress.message
                          }
                          return
                      }

                      // Stable pointer pipeline (v48): the pinch centre remains the absolute
                      // target at pinch-down, while INDEX_FINGER_MCP (landmark 5) supplies motion.
                      // This keeps the click where the user pinched but avoids fingertip curl/jitter
                      // dragging the pointer during a hold or drag.
                      val pointerPinchPoint = right?.thumbIndexCenter
                      val pointerMotionPoint = right?.indexMcp
                      val leftJoinRatio = left?.indexMiddleRatio
                      val leftTwoFingerExtended = left?.indexMiddleExtended == true
                      val leftGesturePoint = left?.indexMiddleCenter
                      val rightJoinRatio = right?.indexMiddleRatio
                      val rightTwoFingerExtended = right?.indexMiddleExtended == true
                      val rightGesturePoint = right?.indexMiddleCenter
                      val openPalmHand = when {
                          right?.openPalm == true -> right
                          left?.openPalm == true -> left
                          else -> null
                      }
                      val openPalmCenter = openPalmHand?.palmCenter
                      val rightV = right?.vPose == true
                      val leftV = left?.vPose == true
                      val leftCallPose = left?.thumbPinkyPose == true
                      framesFailed = 0

                      // Render tracking separately from action dispatch. The overlay consumes only
                      // the newest camera frame, while gesture state also uses a latest-only post.
                      HandOverlayManager.offerLatest(shadows)

                      postLatestGestureFrame {
                          if (!alive || SystemClock.uptimeMillis() - now > 450L) return@postLatestGestureFrame
                          val stablePinch = rightPinchStabilizer.sample(
                              now, indexRatio, middleRatio, pinchThresholds
                          )
                          val clickPinch = stablePinch.index
                          val leftFingersTogether = leftTwoFingerPoseStabilizer.sample(
                              now = now,
                              ratio = leftJoinRatio,
                              fingersExtended = leftTwoFingerExtended
                          )
                          val rightFingersTogether = rightTwoFingerPoseStabilizer.sample(
                              now = now,
                              ratio = rightJoinRatio,
                              fingersExtended = rightTwoFingerExtended
                          )
                          val lockEvent = lockPoseEngine.sample(
                              now = now,
                              palmCenter = openPalmCenter,
                              active = openPalmCenter != null
                          )
                          HandOverlayManager.updateLockHold(
                              point = lockPoseEngine.holdPoint,
                              progress = lockPoseEngine.holdProgress,
                              visible = lockPoseEngine.holding,
                              locked = RuntimeState.gestureLocked
                          )
                          if (lockEvent != null) {
                              RuntimeState.gestureLocked = !RuntimeState.gestureLocked
                              rightInputEngine.reset()?.let { GestureAccessibilityService.instance?.endDrag() }
                              twoFingerEngine.reset()
                              systemGestureEngine.reset()
                              screenshotPoseEngine.reset()
                              notificationPoseEngine.reset()
                              HandOverlayManager.updateLockHold(null, 0f, false, RuntimeState.gestureLocked)
                              HandOverlayManager.showLockPulse(lockEvent, RuntimeState.gestureLocked)
                              RuntimeState.message = if (RuntimeState.gestureLocked) {
                                  "제스처 잠금 · 손바닥 유지로 잠금 해제"
                              } else {
                                  "제스처 잠금 해제"
                              }
                              return@postLatestGestureFrame
                          }

                          if (RuntimeState.gestureLocked) {
                              rightInputEngine.reset()?.let { GestureAccessibilityService.instance?.endDrag() }
                              twoFingerEngine.reset()
                              systemGestureEngine.reset()
                              screenshotPoseEngine.reset()
                              notificationPoseEngine.reset()
                              RuntimeState.message = if (openPalmCenter != null) {
                                  "잠금 상태 · 잠시 더 유지하면 해제"
                              } else {
                                  "제스처 잠금됨 · 손바닥을 펴고 잠시 유지하면 해제"
                              }
                              return@postLatestGestureFrame
                          }

                          if (GestureAccessibilityService.instance?.isScreenshotPending() == true) {
                              rightInputEngine.reset()?.let { GestureAccessibilityService.instance?.endDrag() }
                              twoFingerEngine.reset()
                              systemGestureEngine.reset()
                              screenshotPoseEngine.reset()
                              notificationPoseEngine.reset()
                              RuntimeState.message = "스크린샷 처리 중"
                              return@postLatestGestureFrame
                          }

                          val screenshotTriggered = screenshotPoseEngine.sample(
                              now = now,
                              points = right?.palmCenter?.let { listOf(it) } ?: emptyList(),
                              active = rightV && right?.palmCenter != null
                          )
                          val notificationTriggered = notificationPoseEngine.sample(
                              now = now,
                              points = left?.palmCenter?.let { listOf(it) } ?: emptyList(),
                              active = leftCallPose && !leftV && left?.palmCenter != null
                          )

                          if (screenshotTriggered) {
                              rightInputEngine.reset()?.let { GestureAccessibilityService.instance?.endDrag() }
                              twoFingerEngine.reset()
                              systemGestureEngine.reset()
                              val includeHands = getSharedPreferences("settings", MODE_PRIVATE)
                                  .getBoolean("captureHands", false)
                              val ok = GestureAccessibilityService.instance?.takeScreenshot(includeHands) == true
                              RuntimeState.message = if (ok) "스크린샷 캡처" else "스크린샷 실행 실패"
                              return@postLatestGestureFrame
                          }

                          if (notificationTriggered) {
                              rightInputEngine.reset()?.let { GestureAccessibilityService.instance?.endDrag() }
                              twoFingerEngine.reset()
                              systemGestureEngine.reset()
                              val ok = GestureAccessibilityService.instance?.toggleNotificationShade() == true
                              RuntimeState.message = if (ok) "알림창 전환" else "알림창 전환 실패"
                              return@postLatestGestureFrame
                          }

                          val rightAction = rightInputEngine.sample(
                              now = now,
                              indexPinch = clickPinch,
                              pinchPoint = pointerPinchPoint,
                              motionPoint = pointerMotionPoint
                          )
                          if (rightAction != null) {
                              twoFingerEngine.reset()
                              systemGestureEngine.reset()
                              val accessibility = GestureAccessibilityService.instance
                              RuntimeState.message = when (rightAction) {
                                  is RightHandAction.Tap -> {
                                      HandOverlayManager.showCursor(rightAction.point, pulse = true)
                                      if (accessibility?.tapAt(
                                              rightAction.point.first,
                                              rightAction.point.second
                                          ) == true
                                      ) "클릭 실행" else "클릭 전달 실패 · 대상 앱을 확인하세요"
                                  }
                                  is RightHandAction.DragStart -> {
                                      HandOverlayManager.showCursor(rightAction.current, pulse = false)
                                      if (accessibility?.startDrag(
                                              rightAction.start,
                                              rightAction.current
                                          ) == true
                                      ) {
                                          "터치 유지 · 놓으면 클릭, 움직이면 드래그"
                                      } else {
                                          rightInputEngine.reset()
                                          "드래그 시작 실패 · 대상 앱을 확인하세요"
                                      }
                                  }
                                  is RightHandAction.DragMove -> {
                                      HandOverlayManager.showCursor(rightAction.point)
                                      if (accessibility?.moveDrag(rightAction.point) == true) {
                                          "드래그 중 · 핀치를 풀면 놓기"
                                      } else {
                                          rightInputEngine.reset()
                                          accessibility?.endDrag()
                                          "드래그 이동 실패 · 핀치를 다시 시작하세요"
                                      }
                                  }
                                  RightHandAction.DragEnd -> {
                                      accessibility?.endDrag()
                                      "드래그 종료"
                                  }
                              }
                              return@postLatestGestureFrame
                          }

                          if (rightInputEngine.blocksLeft) {
                              twoFingerEngine.reset()
                              systemGestureEngine.reset()
                              if (clickPinch) {
                                  (rightInputEngine.currentPoint ?: pointerPinchPoint)?.let {
                                      HandOverlayManager.showCursor(it)
                                  }
                              }
                              RuntimeState.message = when {
                                  clickPinch -> "오른손 핀치 · 놓으면 클릭, 움직이면 드래그"
                                  else -> "오른손 입력 마무리 중"
                              }
                              return@postLatestGestureFrame
                          }

                          val prefs = getSharedPreferences("settings", MODE_PRIVATE)
                          val sensitivity = prefs.getInt("sensitivity", 50).coerceIn(0, 100)
                          val threshold = .22f - .0015f * sensitivity

                          val systemThreshold = (0.15f - 0.0003f * sensitivity).coerceIn(.12f, .15f)
                          val systemActive = rightFingersTogether && right?.openPalm != true &&
                              !clickPinch && rightGesturePoint != null
                          if (systemActive) {
                              twoFingerEngine.reset()
                              val systemDirection = systemGestureEngine.sample(
                                  now = now,
                                  point = rightGesturePoint,
                                  active = true,
                                  threshold = systemThreshold
                              )
                              if (systemDirection != null) {
                                  val accessibility = GestureAccessibilityService.instance
                                  val done = when (systemDirection) {
                                      Direction.LEFT -> accessibility?.performBack() == true
                                      Direction.UP -> accessibility?.performHome() == true
                                      else -> false
                                  }
                                  if (!done) systemGestureEngine.reset()
                                  RuntimeState.message = if (done) {
                                      when (systemDirection) {
                                          Direction.LEFT -> "뒤로 이동"
                                          Direction.UP -> "홈으로 이동"
                                          else -> ""
                                      }
                                  } else {
                                      "시스템 제스처 전달 실패"
                                  }
                              } else {
                                  RuntimeState.message = when {
                                      systemGestureEngine.awaitingRelease -> "다시 실행하려면 두 손가락을 되돌리세요"
                                      else -> "오른손 두 손가락 · 왼쪽은 뒤로, 위는 홈"
                                  }
                              }
                              return@postLatestGestureFrame
                          } else {
                              systemGestureEngine.sample(
                                  now = now,
                                  point = null,
                                  active = false,
                                  threshold = systemThreshold
                              )
                          }

                          val direction = twoFingerEngine.sample(
                              now,
                              leftGesturePoint,
                              leftFingersTogether,
                              threshold
                          )
                          if (direction != null) {
                              val done = GestureAccessibilityService.instance?.performScroll(
                                  direction,
                                  twoFingerEngine.lastIntensity,
                                  twoFingerEngine.lastMomentum
                              ) == true
                              if (!done) twoFingerEngine.reset()
                              RuntimeState.message = if (done) {
                                  when (direction) {
                                      Direction.LEFT -> "왼쪽 가로 스크롤 실행"
                                      Direction.RIGHT -> "오른쪽 가로 스크롤 실행"
                                      Direction.UP -> "위로 스크롤 실행"
                                      Direction.DOWN -> "아래로 스크롤 실행"
                                  }
                              } else {
                                  "스크롤 전달 실패 · 대상 앱을 확인하세요"
                              }
                          } else {
                              RuntimeState.message = when {
                                  left == null -> "왼손을 비춰주세요"
                                  !leftFingersTogether -> "왼손 검지와 중지를 모아주세요"
                                  else -> "왼손 두 손가락 · 천천히는 정밀, 빠르게는 크게 스크롤"
                              }
                          }
                      }
                  } catch (e: Exception) {
                      framesFailed++

                      // Some devices can initialize the GPU delegate successfully but fail later
                      // under sustained camera inference. Recover once in-place on this same worker
                      // instead of forcing the user to restart the app.
                      if (RuntimeState.modelDelegate == "GPU" && framesFailed >= 2) {
                          val recovered = runCatching {
                              landmarker?.close()
                              landmarker = createLandmarker(Delegate.CPU)
                              RuntimeState.modelDelegate = "CPU RECOVERY"
                              framesFailed = 0
                          }.isSuccess
                          if (recovered) {
                              main.post {
                                  if (alive) {
                                      // Delegate recovery can briefly stall frames. End any
                                      // in-flight touch before CPU frames resume so a drag cannot
                                      // turn into an accidental long-press while the model rebuilds.
                                      rightInputEngine.reset()?.let {
                                          GestureAccessibilityService.instance?.endDrag()
                                      }
                                      twoFingerEngine.reset()
                                      systemGestureEngine.reset()
                                      lockPoseEngine.reset()
                                      screenshotPoseEngine.reset()
                                      notificationPoseEngine.reset()
                                      rightPinchStabilizer.reset()
                                      leftTwoFingerPoseStabilizer.reset()
                                      rightTwoFingerPoseStabilizer.reset()
                                      HandOverlayManager.offerLatest(emptyList())
                                      RuntimeState.message = "GPU 분석 불안정 · CPU로 자동 전환"
                                  }
                              }
                              return
                          }
                      }

                      main.post {
                          if (alive) {
                              HandOverlayManager.offerLatest(emptyList())
                              RuntimeState.message = "영상 분석 오류: ${e.message}"
                          }
                      }
                      if (framesFailed >= 5) {
                          main.post { if (alive) fail("영상 분석이 반복 실패했습니다 · 다시 START") }
                      }
                  } finally {
                      if (transformed !== raw) transformed?.recycle()
                      raw?.recycle()
                      frame.close()
                  }
              }
          
              private fun classifyHands(result: HandLandmarkerResult, now: Long): List<DetectedHand> {
                  expireHandTracks(now)
                  val landmarks = result.landmarks()
                  val handedness = result.handedness()
                  val hands = landmarks.mapIndexed { index, rawPoints ->
                      val handLabel = handedness.getOrNull(index)?.firstOrNull()?.let(::categoryLabel)
                      DetectedHand(
                          points = rawPoints.map { landmark -> landmark.x() to landmark.y() },
                          gesture = null,
                          score = 0f,
                          handedness = handLabel
                      )
                  }
                  if (hands.isEmpty()) return emptyList()

                  // v48 keeps the v35 rule: a clean MediaPipe Left/Right label is authoritative. Tracking is only
                  // a fallback for missing/duplicate labels, or for the tiny overlap zone where the
                  // two palms are nearly on top of each other. This prevents stale position tracks
                  // from silently turning the left-hand scroll into a right-hand system gesture.
                  val trackingFresh = lastPalmTrackAt > 0L && now - lastPalmTrackAt <= 320L
                  val dt = if (trackingFresh) ((now - lastPalmTrackAt) / 1000f).coerceIn(0f, .14f) else 0f
                  val predictedRight = if (trackingFresh) predictPalm(lastRightPalm, rightPalmVelocity, dt) else null
                  val predictedLeft = if (trackingFresh) predictPalm(lastLeftPalm, leftPalmVelocity, dt) else null

                  if (hands.size == 1) {
                      val hand = hands.first()
                      // Never override a valid anatomical label with screen position or an old track.
                      val side = when {
                          hand.isRight -> "Right"
                          hand.isLeft -> "Left"
                          else -> resolveUnknownSingleHand(hand.palmCenter, predictedRight, predictedLeft)
                      }
                      return rememberHands(listOf(hand.copy(handedness = side)), now)
                  }

                  val first = hands[0]
                  val second = hands[1]
                  val firstCenter = first.palmCenter
                  val secondCenter = second.palmCenter
                  val oneRightOneLeft = (first.isRight && second.isLeft) || (first.isLeft && second.isRight)
                  val palmsClose = if (firstCenter != null && secondCenter != null) {
                      palmDistance(firstCenter, secondCenter) < .10f
                  } else false

                  val resolved = when {
                      // Normal case: keep MediaPipe's anatomical labels exactly as reported.
                      oneRightOneLeft && !palmsClose -> hands

                      // During a real overlap/crossing, use only a fresh short track to maintain identity.
                      firstCenter != null && secondCenter != null && predictedRight != null && predictedLeft != null -> {
                          val directCost = palmDistance(firstCenter, predictedRight) + palmDistance(secondCenter, predictedLeft)
                          val crossedCost = palmDistance(firstCenter, predictedLeft) + palmDistance(secondCenter, predictedRight)
                          if (directCost <= crossedCost) {
                              listOf(first.copy(handedness = "Right"), second.copy(handedness = "Left"))
                          } else {
                              listOf(first.copy(handedness = "Left"), second.copy(handedness = "Right"))
                          }
                      }

                      // If only one valid label survived, assign the other hand to the other side.
                      hands.count { it.isRight } == 1 && hands.none { it.isLeft } ->
                          hands.map { if (it.isRight) it else it.copy(handedness = "Left") }
                      hands.count { it.isLeft } == 1 && hands.none { it.isRight } ->
                          hands.map { if (it.isLeft) it else it.copy(handedness = "Right") }

                      // Last resort for a mirrored selfie frame: user's right hand is on screen-left.
                      else -> hands.sortedBy { it.palmCenter?.first ?: .5f }.mapIndexed { index, hand ->
                          hand.copy(handedness = if (index == 0) "Right" else "Left")
                      }
                  }
                  return rememberHands(resolved, now)
              }

