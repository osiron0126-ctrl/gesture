                              now,
                              leftGesturePoint,
                              leftFingersTogether,
                              scrollDeadzone
                          )
                          if (direction != null) {
                              val done = GestureAccessibilityService.instance?.performScroll(
                                  direction,
                                  twoFingerEngine.lastIntensity,
                                  twoFingerEngine.lastMomentum
                              ) == true
                              if (!done) twoFingerEngine.reset()
                              RuntimeState.message = if (done) {
                                  when (direction) {
                                      Direction.LEFT -> "왼쪽 가로 스크롤 실행"
                                      Direction.RIGHT -> "오른쪽 가로 스크롤 실행"
                                      Direction.UP -> "위로 스크롤 실행"
                                      Direction.DOWN -> "아래로 스크롤 실행"
                                  }
                              } else {
                                  "스크롤 전달 실패 · 대상 앱을 확인하세요"
                              }
                          } else {
                              if (!twoFingerEngine.engaged) {
                                  GestureAccessibilityService.instance?.stopScroll()
                              }
                              RuntimeState.message = when {
                                  left == null -> "왼손을 비춰주세요"
                                  !leftFingersTogether -> "왼손 검지와 중지를 모아주세요"
                                  else -> "왼손 두 손가락 · 움직이면 바로 연속 스크롤"
                              }
                          }
                      }
                  } catch (e: Exception) {
                      framesFailed++
                      main.post {
                          if (alive) {
                              HandOverlayManager.update(emptyList())
                              RuntimeState.message = "영상 분석 오류: ${e.message}"
                          }
                      }
                      if (framesFailed >= 5) {
                          main.post { if (alive) fail("영상 분석이 반복 실패했습니다 · 다시 START") }
                      }
                  } finally {
                      if (transformed !== raw) transformed?.recycle()
                      raw?.recycle()
                      frame.close()
                  }
              }
          
              private fun classifyHands(result: HandLandmarkerResult, now: Long): List<DetectedHand> {
                  val landmarks = result.landmarks()
                  val handedness = result.handedness()
                  val hands = landmarks.mapIndexed { index, rawPoints ->
                      val handLabel = handedness.getOrNull(index)?.firstOrNull()?.let(::categoryLabel)
                      DetectedHand(
                          points = rawPoints.map { landmark -> landmark.x() to landmark.y() },
                          gesture = null,
                          score = 0f,
                          handedness = handLabel
                      )
                  }
                  if (hands.isEmpty()) return emptyList()

                  // Use short-horizon palm prediction for identity matching. MediaPipe handedness can
                  // flicker when hands cross or rotate; spatial continuity is more trustworthy then.
                  val dt = if (lastPalmTrackAt > 0L) ((now - lastPalmTrackAt) / 1000f).coerceIn(0f, .14f) else 0f
                  val predictedRight = predictPalm(lastRightPalm, rightPalmVelocity, dt)
                  val predictedLeft = predictPalm(lastLeftPalm, leftPalmVelocity, dt)

                  if (hands.size == 1) {
                      val hand = hands.first()
                      val center = hand.palmCenter ?: return emptyList()
                      val rightDistance = predictedRight?.let { palmDistance(center, it) }
                      val leftDistance = predictedLeft?.let { palmDistance(center, it) }
                      val side = when {
                          rightDistance != null && leftDistance != null && kotlin.math.abs(rightDistance - leftDistance) > .035f ->
                              if (rightDistance < leftDistance) "Right" else "Left"
                          hand.isRight -> "Right"
                          hand.isLeft -> "Left"
                          rightDistance != null && (leftDistance == null || rightDistance < leftDistance) -> "Right"
                          leftDistance != null -> "Left"
                          center.first < .5f -> "Right"
                          else -> "Left"
                      }
                      return rememberHands(listOf(hand.copy(handedness = side)), now)
                  }

                  val first = hands[0]
                  val second = hands[1]
                  val firstCenter = first.palmCenter
                  val secondCenter = second.palmCenter
                  val resolved = if (firstCenter != null && secondCenter != null &&
                      predictedRight != null && predictedLeft != null
                  ) {
                      val directCost = palmDistance(firstCenter, predictedRight) + palmDistance(secondCenter, predictedLeft)
                      val crossedCost = palmDistance(firstCenter, predictedLeft) + palmDistance(secondCenter, predictedRight)
                      if (directCost <= crossedCost) {
                          listOf(first.copy(handedness = "Right"), second.copy(handedness = "Left"))
                      } else {
                          listOf(first.copy(handedness = "Left"), second.copy(handedness = "Right"))
                      }
                  } else {
                      val hasRight = hands.any { it.isRight }
                      val hasLeft = hands.any { it.isLeft }
                      when {
                          hasRight && hasLeft -> hands
                          hands.count { it.isRight } == 1 && !hasLeft ->
                              hands.map { if (it.isRight) it else it.copy(handedness = "Left") }
                          hands.count { it.isLeft } == 1 && !hasRight ->
                              hands.map { if (it.isLeft) it else it.copy(handedness = "Right") }
                          else -> hands.sortedBy { it.palmCenter?.first ?: .5f }.mapIndexed { index, hand ->
                              hand.copy(handedness = if (index == 0) "Right" else "Left")
                          }
                      }
                  }
                  return rememberHands(resolved, now)
              }

              private fun rememberHands(hands: List<DetectedHand>, now: Long): List<DetectedHand> {
                  if (lastPalmTrackAt > 0L && now - lastPalmTrackAt > 500L) {
                      rightPalmVelocity = 0f to 0f
                      leftPalmVelocity = 0f to 0f
                      lastRightPoints = null
                      lastLeftPoints = null
                  }
                  val dt = if (lastPalmTrackAt > 0L) ((now - lastPalmTrackAt) / 1000f).coerceIn(.016f, .14f) else .04f

                  val stabilized = hands.map { hand ->
                      when {
                          hand.isRight -> stabilizeTrackedHand(hand, lastRightPoints)
                          hand.isLeft -> stabilizeTrackedHand(hand, lastLeftPoints)
                          else -> hand
                      }
                  }

                  stabilized.firstOrNull { it.isRight }?.let { hand ->
                      val palm = hand.palmCenter
                      if (palm != null) {
                          lastRightPalm?.let { previous ->
                              val measured = (palm.first - previous.first) / dt to (palm.second - previous.second) / dt
                              rightPalmVelocity = blendVelocity(rightPalmVelocity, measured)
                          }
                          lastRightPalm = palm
                      }
                      lastRightPoints = hand.points
                  }
                  stabilized.firstOrNull { it.isLeft }?.let { hand ->
                      val palm = hand.palmCenter
                      if (palm != null) {
                          lastLeftPalm?.let { previous ->
                              val measured = (palm.first - previous.first) / dt to (palm.second - previous.second) / dt
                              leftPalmVelocity = blendVelocity(leftPalmVelocity, measured)
                          }
                          lastLeftPalm = palm
                      }
                      lastLeftPoints = hand.points
                  }
                  lastPalmTrackAt = now

                  return if (getSharedPreferences("settings", MODE_PRIVATE).getBoolean("swapHands", false)) {
                      stabilized.map { hand ->
                          when {
                              hand.isRight -> hand.copy(handedness = "Left")
                              hand.isLeft -> hand.copy(handedness = "Right")
                              else -> hand
                          }
                      }
                  } else stabilized
              }

              private fun stabilizeTrackedHand(
                  hand: DetectedHand,
                  previous: List<Pair<Float, Float>>?
              ): DetectedHand {
                  if (previous == null || previous.size != hand.points.size) return hand
                  val previousPalm = palmCenterOf(previous)
                  val currentPalm = hand.palmCenter
                  val motion = if (previousPalm != null && currentPalm != null) palmDistance(previousPalm, currentPalm) else .03f
                  // Slow hand = stronger jitter filtering. Fast hand = trust current frame to avoid lag.
                  val alpha = (.48f + motion * 8.5f).coerceIn(.48f, .90f)
                  val points = hand.points.mapIndexed { index, next ->
                      val old = previous[index]
                      old.first + (next.first - old.first) * alpha to
                          old.second + (next.second - old.second) * alpha
                  }
                  return hand.copy(points = points)
              }

              private fun palmCenterOf(points: List<Pair<Float, Float>>): Pair<Float, Float>? {
                  if (points.size < 18) return null
                  val ids = intArrayOf(0, 5, 9, 13, 17)
                  return ids.map { points[it].first }.average().toFloat() to
                      ids.map { points[it].second }.average().toFloat()
              }

              private fun predictPalm(
                  palm: Pair<Float, Float>?,
                  velocity: Pair<Float, Float>,
                  dt: Float
              ): Pair<Float, Float>? {
                  palm ?: return null
                  return (palm.first + velocity.first * dt * .55f).coerceIn(0f, 1f) to
                      (palm.second + velocity.second * dt * .55f).coerceIn(0f, 1f)
              }

              private fun blendVelocity(
                  old: Pair<Float, Float>,
                  measured: Pair<Float, Float>
              ): Pair<Float, Float> {
                  val alpha = .38f
                  return old.first + (measured.first - old.first) * alpha to
                      old.second + (measured.second - old.second) * alpha
              }

              private fun palmDistance(a: Pair<Float, Float>, b: Pair<Float, Float>): Float {
                  return kotlin.math.hypot(
                      (a.first - b.first).toDouble(),
                      (a.second - b.second).toDouble()
                  ).toFloat()
              }

              private fun categoryLabel(category: Category): String? {
                  val label = category.categoryName().ifBlank { category.displayName() }
                  return normalizeMirroredHandedness(label)
              }
          
              private fun fail(message: String) {
                  failed = true
                  RuntimeState.message = message
                  stopSelf()
              }
          
              private fun notification(): Notification {
                  val content = PendingIntent.getActivity(
                      this,
                      10,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val stop = PendingIntent.getService(
                      this,
                      11,
                      Intent(this, GestureCameraService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentTitle("SC Hand Gesture")
                      .setContentText("안정화 추적 · 왼손 연속 스크롤 · 오른손 클릭/드래그")
                      .setContentIntent(content)
                      .setOngoing(true)
                      .addAction(0, "중지", stop)
                      .build()
              }
          
              override fun onDestroy() {
                  alive = false
                  RuntimeState.running = false
                  RuntimeState.lastFrame = 0L
                  RuntimeState.analysisFps = 25
                  RuntimeState.calibrationActive = false
                  RuntimeState.gestureLocked = false
                  if (!failed) RuntimeState.message = "중지됨"
                  main.removeCallbacksAndMessages(null)
                  runCatching { unregisterReceiver(screenOff) }
                  analysis?.clearAnalyzer()
                  analysis?.let { provider?.unbind(it) }
                  analysis = null
                  provider = null
                  rightInputEngine.reset()?.let { GestureAccessibilityService.instance?.endDrag() }
                  twoFingerEngine.reset()
                  systemGestureEngine.reset()
                  lockPoseEngine.reset()
                  rightPinchStabilizer.reset()
                  leftTwoFingerPoseStabilizer.reset()
                  rightTwoFingerPoseStabilizer.reset()
                  HandOverlayManager.remove()
                  // Close the landmarker on the same serial worker that processes frames.
                  worker.execute { runCatching { landmarker?.close() }; landmarker = null }
                  worker.shutdown()
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  super.onDestroy()
              }
          }
