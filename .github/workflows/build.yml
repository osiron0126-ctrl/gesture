              fun sendSavedOff(context: Context, callback: (Result<Unit>) -> Unit) {
                  val app = context.applicationContext
                  val command = BleCommandStore.load(app)
                      ?: return callback(Result.failure(IllegalStateException("저장된 LIGHT OFF 명령이 없습니다.")))
                  val payload = BleHex.parse(command.payloadHex)
                      ?: return callback(Result.failure(IllegalArgumentException("저장된 HEX 값이 올바르지 않습니다.")))
                  if (!hasConnectPermission(app)) {
                      return callback(Result.failure(SecurityException("Bluetooth 연결 권한이 필요합니다.")))
                  }
          
                  val manager = app.getSystemService(BluetoothManager::class.java)
                  val adapter = manager?.adapter
                      ?: return callback(Result.failure(IllegalStateException("Bluetooth 어댑터가 없습니다.")))
                  if (!adapter.isEnabled) {
                      return callback(Result.failure(IllegalStateException("Bluetooth가 꺼져 있습니다.")))
                  }
          
                  val device = runCatching { adapter.getRemoteDevice(command.deviceAddress) }.getOrElse {
                      return callback(Result.failure(it))
                  }
                  val serviceUuid = runCatching { UUID.fromString(command.serviceUuid) }.getOrElse {
                      return callback(Result.failure(it))
                  }
                  val charUuid = runCatching { UUID.fromString(command.characteristicUuid) }.getOrElse {
                      return callback(Result.failure(it))
                  }
                  if (!inFlight.compareAndSet(false, true)) {
                      return callback(Result.failure(IllegalStateException("BLE 저장 명령 전송이 이미 진행 중입니다.")))
                  }
          
                  val main = Handler(Looper.getMainLooper())
                  val finished = AtomicBoolean(false)
                  val timeoutToken = Any()
                  var gattRef: BluetoothGatt? = null
          
                  fun finish(result: Result<Unit>) {
                      if (!finished.compareAndSet(false, true)) return
                      main.removeCallbacksAndMessages(timeoutToken)
                      runCatching { gattRef?.disconnect() }
                      runCatching { gattRef?.close() }
                      inFlight.set(false)
                      main.post { callback(result) }
