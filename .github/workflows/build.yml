          private class DigitalBackdropView(context: Context) : View(context) {
              private data class Pixel(val x: Float, val y: Float, val size: Float, val alpha: Int)
              private val grid = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(72, 18, 31)
                  alpha = 28
                  strokeWidth = resources.displayMetrics.density
              }
              private val pixelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = UiTone.ACCENT }
              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = UiTone.ACCENT_DIM
                  strokeWidth = resources.displayMetrics.density
              }
              private val pixels = mutableListOf<Pixel>()

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  pixels.clear()
                  if (w <= 0 || h <= 0) return
                  val random = Random(18017 + w * 7 + h)
                  repeat(72) {
                      val edgeBias = if (it % 3 == 0) random.nextFloat() * .22f else random.nextFloat()
                      val x = if (it % 2 == 0) edgeBias * w else (1f - edgeBias) * w
                      val y = random.nextFloat() * h
                      val s = resources.displayMetrics.density * (if (it % 9 == 0) 4.2f else 1.4f + random.nextFloat() * 2.2f)
                      pixels += Pixel(x, y, s, 18 + random.nextInt(55))
                  }
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  canvas.drawColor(UiTone.BG)
                  val step = 48f * resources.displayMetrics.density
                  var x = 0f
                  while (x < width) { canvas.drawLine(x, 0f, x, height.toFloat(), grid); x += step }
                  var y = 0f
                  while (y < height) { canvas.drawLine(0f, y, width.toFloat(), y, grid); y += step }

                  for (p in pixels) {
                      pixelPaint.alpha = p.alpha
                      canvas.drawRect(p.x, p.y, p.x + p.size, p.y + p.size, pixelPaint)
                  }
                  linePaint.alpha = 80
                  val d = resources.displayMetrics.density
                  canvas.drawRect(20f * d, 118f * d, 70f * d, 120f * d, linePaint)
                  canvas.drawRect(width - 68f * d, 168f * d, width - 28f * d, 170f * d, linePaint)
                  pixelPaint.alpha = 100
                  repeat(5) { i ->
                      val s = 3f * d
                      canvas.drawRect(24f * d + i * 7f * d, 96f * d, 24f * d + i * 7f * d + s, 96f * d + s, pixelPaint)
                  }
              }
          }
