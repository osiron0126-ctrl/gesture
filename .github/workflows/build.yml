                  const val MIN_CLICK_MS = 55L
                  const val HOLD_TO_POINTER_MS = 450L
                  const val LANDMARK_DROPOUT_MS = 200L
                  const val DRAG_INTENT_DISTANCE = .065f
                  const val DRAG_MOVE_DISTANCE = .010f
              }

              private enum class State { IDLE, TRACKING, DRAGGING }

              private var state = State.IDLE
              private var startedAt = 0L
              private var missingSince: Long? = null
              private var startPoint: Pair<Float, Float>? = null
              private var rawStartPoint: Pair<Float, Float>? = null
              private var filteredPoint: Pair<Float, Float>? = null
              private var lastDragPoint: Pair<Float, Float>? = null

              val engaged: Boolean get() = state != State.IDLE

              fun sample(
                  now: Long,
                  pinching: Boolean,
                  point: Pair<Float, Float>?
              ): RightHandAction? {
                  // `pinching` already comes from RightPinchPoseStabilizer. A false value is
                  // therefore a confirmed release, so adding another release debounce here
                  // only makes clicks feel late and can make a short pinch disappear.
                  if (!pinching) {
                      missingSince = null
                      if (state == State.IDLE) return null
                      val action = when (state) {
                          State.TRACKING -> if (point != null && now - startedAt >= MIN_CLICK_MS) {
                              RightHandAction.Tap(filteredPoint ?: point)
                          } else null
                          State.DRAGGING -> RightHandAction.DragEnd
                          State.IDLE -> null
                      }
                      clear()
                      return action
                  }

                  // MediaPipe can lose the hand centre for one or two frames while the
                  // stabilized pinch is still valid. Do not mistake that for a release.
                  if (point == null) {
                      if (state == State.IDLE) return null
                      val since = missingSince ?: now.also { missingSince = it }
                      if (now - since < LANDMARK_DROPOUT_MS) return null
                      val action = if (state == State.DRAGGING) RightHandAction.DragEnd else null
                      clear()
                      return action
                  }
                  missingSince = null

                  val filtered = smooth(point)
                  if (state == State.IDLE) {
                      state = State.TRACKING
                      startedAt = now
                      startPoint = filtered
                      rawStartPoint = point
                      lastDragPoint = filtered
                      return null
                  }

                  val start = startPoint ?: filtered
                  if (state == State.TRACKING) {
                      // Use unsmoothed displacement only to decide user intent. The actual
                      // dispatched coordinates stay smoothed. This prevents the smoothing
                      // filter from swallowing a deliberate drag while still rejecting jitter.
                      val rawStart = rawStartPoint ?: point
                      if (distance(rawStart, point) >= DRAG_INTENT_DISTANCE) {
                          state = State.DRAGGING
                          lastDragPoint = filtered
                          return RightHandAction.DragStart(start, filtered)
                      }
                      // A stationary pinch becomes a real continued pointer only after a
                      // deliberate hold. Quick pinches remain clicks all the way to release.
                      if (now - startedAt >= HOLD_TO_POINTER_MS) {
                          state = State.DRAGGING
                          lastDragPoint = filtered
                          return RightHandAction.DragStart(start, filtered)
                      }
                      return null
                  }

                  val previous = lastDragPoint ?: filtered
                  if (distance(previous, filtered) >= DRAG_MOVE_DISTANCE) {
                      lastDragPoint = filtered
                      return RightHandAction.DragMove(filtered)
                  }
                  return null
              }

              fun cancel(): RightHandAction? {
                  val action = if (state == State.DRAGGING) RightHandAction.DragEnd else null
                  clear()
                  return action
              }

              private fun smooth(next: Pair<Float, Float>): Pair<Float, Float> {
                  val old = filteredPoint ?: return next.also { filteredPoint = it }
                  return (old.first + (next.first - old.first) * .42f to
                      old.second + (next.second - old.second) * .42f).also { filteredPoint = it }
              }

              private fun clear() {
                  state = State.IDLE
                  startedAt = 0L
                  missingSince = null
                  startPoint = null
                  rawStartPoint = null
                  filteredPoint = null
                  lastDragPoint = null
              }

              private fun distance(a: Pair<Float, Float>, b: Pair<Float, Float>): Float = hypot(
                  (a.first - b.first).toDouble(),
                  (a.second - b.second).toDouble()
              ).toFloat()
          }

          /** Converts an exclusive thumb/middle pinch into throttled media-volume steps. */
          class VolumeGestureEngine {
              private var originY: Float? = null
              private var lastStepAt = Long.MIN_VALUE
              private var missingSince: Long? = null
          
              val engaged: Boolean get() = originY != null
          
              fun sample(now: Long, active: Boolean, point: Pair<Float, Float>?): Int? {
                  if (!active || point == null) {
                      if (originY != null) {
                          val since = missingSince ?: now.also { missingSince = it }
                          if (now - since >= 150L) reset()
                      }
                      return null
                  }
                  missingSince = null
                  val origin = originY
                  if (origin == null) {
                      originY = point.second
                      lastStepAt = now - 180L
                      return null
                  }
                  val dy = point.second - origin
                  if (kotlin.math.abs(dy) < .055f || now - lastStepAt < 180L) return null
                  originY = point.second
                  lastStepAt = now
                  return if (dy < 0f) 1 else -1
              }
          
              fun reset() {
                  originY = null
                  lastStepAt = Long.MIN_VALUE
                  missingSince = null
              }
          }
