          package com.sc.millegesture
          
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Test
          
          class TwoHandGestureTest {
              @Test fun mirroredSelfieHandednessStaysUserRelative() {
                  assertEquals("Left", normalizeMirroredHandedness("Left"))
                  assertEquals("Right", normalizeMirroredHandedness("right_hand"))
              }

              @Test fun adaptiveFpsDropsOnlyAfterQuietWindow() {
                  assertEquals(40L, adaptiveFrameIntervalMs(2999L, 0L, false))
                  assertEquals(83L, adaptiveFrameIntervalMs(3000L, 0L, false))
                  assertEquals(40L, adaptiveFrameIntervalMs(9000L, 0L, true))
              }

              @Test fun calibrationProducesSaneClickThresholds() {
                  val t = AutoPinchCalibrationEngine.deriveThresholds(
                      openIndex = .78f, openMiddle = .82f, indexPinch = .18f, indexOther = .70f
                  )
                  assertTrue(t.indexEnter in .20f.. .42f)
                  assertTrue(t.indexHold > t.indexEnter)
                  assertTrue(t.indexMiddleSeparation in .03f.. .09f)
              }

              @Test fun calibrationHardTimeoutIsAbsolute() {
                  val engine = AutoPinchCalibrationEngine()
                  engine.sample(0L, 1, .80f, .82f)
                  val timedOut = engine.sample(30000L, 1, null, null)
                  assertTrue(timedOut.cancelled)
                  assertNull(timedOut.thresholds)
              }

              @Test fun calibrationUsesOnlyTwoVisibleStages() {
                  val engine = AutoPinchCalibrationEngine()
                  val first = engine.sample(0L, 1, .80f, .82f)
                  assertTrue(first.message.contains("1/2"))
                  var p = first
                  repeat(16) { i -> p = engine.sample(60L + i * 50L, 1, .80f, .82f) }
                  assertTrue(p.message.contains("2/2") || p.thresholds != null)
              }

              @Test fun pointerPinchRequiresStableClosure() {
                  val filter = RightPinchPoseStabilizer()
                  assertFalse(filter.sample(0L, .60f, .70f).index)
                  assertFalse(filter.sample(20L, .25f, .58f).index)
                  assertTrue(filter.sample(80L, .25f, .58f).index)
              }

              @Test fun thumbMiddleClosureNeverBecomesAnActionPose() {
                  val filter = RightPinchPoseStabilizer()
                  assertFalse(filter.sample(0L, .58f, .24f).index)
                  assertFalse(filter.sample(80L, .58f, .24f).index)
              }

              @Test fun firstScrollMovementIsPreservedDuringPoseConfirmation() {
                  val engine = TwoFingerGestureEngine()
                  assertNull(engine.sample(0L, .50f to .50f, true, .012f))
                  assertEquals(Direction.UP, engine.sample(40L, .50f to .475f, true, .012f))
              }

              @Test fun joinedFingersContinueToEmitWhileMoving() {
                  val engine = TwoFingerGestureEngine()
                  assertNull(engine.sample(0L, .50f to .50f, true, .012f))
                  assertEquals(Direction.UP, engine.sample(40L, .50f to .47f, true, .012f))
                  assertEquals(Direction.UP, engine.sample(80L, .50f to .44f, true, .012f))
                  assertEquals(Direction.UP, engine.sample(120L, .50f to .41f, true, .012f))
              }

              @Test fun tinyJitterDoesNotScroll() {
                  val engine = TwoFingerGestureEngine()
                  assertNull(engine.sample(0L, .50f to .50f, true, .013f))
                  assertNull(engine.sample(40L, .505f to .496f, true, .013f))
                  assertNull(engine.sample(80L, .508f to .492f, true, .013f))
              }

              @Test fun slowAndFastMovementScaleDifferently() {
                  val slow = TwoFingerGestureEngine()
                  slow.sample(0L, .50f to .50f, true, .012f)
                  assertEquals(Direction.UP, slow.sample(100L, .50f to .485f, true, .012f))
                  val slowIntensity = slow.lastIntensity

                  val fast = TwoFingerGestureEngine()
                  fast.sample(0L, .50f to .60f, true, .012f)
                  assertEquals(Direction.UP, fast.sample(40L, .50f to .50f, true, .012f))
                  assertTrue(fast.lastIntensity > slowIntensity)
                  assertTrue(fast.lastMomentum > 0f)
              }

              @Test fun briefScrollPoseDropoutKeepsTracking() {
                  val engine = TwoFingerGestureEngine()
                  engine.sample(0L, .50f to .50f, true, .012f)
                  assertNull(engine.sample(50L, null, false, .012f))
                  assertTrue(engine.engaged)
                  assertEquals(Direction.UP, engine.sample(100L, .50f to .46f, true, .012f))
              }

              @Test fun longScrollPoseDropoutReturnsToNeutral() {
                  val engine = TwoFingerGestureEngine()
                  engine.sample(0L, .50f to .50f, true, .012f)
                  engine.sample(50L, null, false, .012f)
                  engine.sample(180L, null, false, .012f)
                  assertFalse(engine.engaged)
              }

              @Test fun shortRightPinchClicksOnConfirmedRelease() {
                  val engine = RightHandInputEngine()
                  val point = .42f to .37f
                  assertNull(engine.sample(0L, true, point))
                  assertEquals(RightHandAction.Tap(point), engine.sample(100L, false, point))
              }

              @Test fun smallAimCorrectionStillClicksInsteadOfDragging() {
                  val engine = RightHandInputEngine()
                  val start = .40f to .40f
                  val aimed = .44f to .42f
                  assertNull(engine.sample(0L, true, start))
                  assertNull(engine.sample(120L, true, aimed))
                  assertTrue(engine.sample(220L, false, aimed) is RightHandAction.Tap)
              }

              @Test fun heldMovingPinchCreatesContinuedDrag() {
                  val engine = RightHandInputEngine()
                  val start = .40f to .40f
                  assertNull(engine.sample(0L, true, start))
                  assertTrue(engine.sample(100L, true, .52f to .40f) is RightHandAction.DragStart)
                  assertTrue(engine.sample(220L, true, .68f to .40f) is RightHandAction.DragMove)
                  assertEquals(RightHandAction.DragEnd, engine.sample(300L, false, .68f to .40f))
              }

              @Test fun fullStabilizedPinchSequenceProducesOneClick() {
                  val filter = RightPinchPoseStabilizer()
                  val engine = RightHandInputEngine()
                  val point = .41f to .39f
                  fun step(t: Long, index: Float?, middle: Float?): RightHandAction? {
                      val pose = filter.sample(t, index, middle)
                      return engine.sample(t, pose.index, point)
                  }
                  assertNull(step(0L, .60f, .70f))
                  assertNull(step(40L, .25f, .58f))
                  assertNull(step(100L, .25f, .58f))
                  assertNull(step(180L, .55f, .58f))
                  assertNull(step(220L, .55f, .58f))
                  assertTrue(step(280L, .55f, .58f) is RightHandAction.Tap)
                  assertNull(step(320L, .55f, .58f))
              }
          }
