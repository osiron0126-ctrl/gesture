        import kotlin.math.abs

        /**
         * One-shot vertical scroll detector. It rearms only after the hand returns
         * close to its starting height or disappears, so one long hand movement does
         * not produce a stream of accidental swipes.
         */
        class ScrollEngine {
            private var originY: Float? = null
            private var originAt = 0L
            private var previousY: Float? = null
            private var previousAt = -1L
            private var locked = false
            private var releaseSince: Long? = null

            val awaitingRelease: Boolean get() = locked

            fun reset() {
                originY = null
                originAt = 0L
                previousY = null
                previousAt = -1L
                locked = false
                releaseSince = null
            }

            fun sample(
                now: Long,
                y: Float?,
                active: Boolean,
                threshold: Float = 0.16f
            ): Direction? {
                if (previousAt >= 0L && now - previousAt > 450L) {
                    originY = null
                    previousY = null
                    releaseSince = null
                }
                previousAt = now

                if (!active || y == null) {
                    previousY = null
                    if (locked) {
                        val since = releaseSince ?: now.also { releaseSince = it }
                        if (now - since >= 700L) reset()
                    } else {
                        originY = null
                    }
                    return null
                }

                if (locked) {
                    val origin = originY
                    if (origin != null && abs(y - origin) <= threshold * 0.35f) {
                        val since = releaseSince ?: now.also { releaseSince = it }
                        if (now - since >= 220L) {
                            locked = false
                            releaseSince = null
                            originY = y
                            originAt = now
                        }
                    } else {
                        releaseSince = null
                    }
                    previousY = y
                    return null
                }

                val origin = originY
                if (origin == null) {
                    originY = y
                    originAt = now
                    previousY = y
                    return null
                }
                if (now - originAt < 120L) {
                    previousY = y
                    return null
                }
                if (now - originAt > 900L) {
                    originY = y
                    originAt = now
                    previousY = y
                    return null
                }

                val dy = y - origin
                if (abs(dy) < threshold) {
                    previousY = y
                    return null
                }

                locked = true
                previousY = y
                return if (dy < 0f) Direction.UP else Direction.DOWN
            }
