        package com.sc.millegesture

        import kotlin.math.abs

        /** One horizontal page-turn event while the index and middle fingers touch. */
        class PageEngine {
            private var originX: Float? = null
            private var originAt = 0L
            private var previousAt = -1L
            private var locked = false
            private var releaseSince: Long? = null

            val awaitingRelease: Boolean get() = locked

            fun reset() {
                originX = null
                originAt = 0L
                previousAt = -1L
                locked = false
                releaseSince = null
            }

            fun sample(now: Long, x: Float?, together: Boolean, threshold: Float = .18f): Direction? {
                if (previousAt >= 0L && now - previousAt > 450L) {
                    originX = null
                    releaseSince = null
                }
                previousAt = now
                if (!together || x == null) {
                    if (locked) {
                        val since = releaseSince ?: now.also { releaseSince = it }
                        if (now - since >= 500L) reset()
                    } else {
                        originX = null
                    }
                    return null
                }
                if (locked) {
                    val origin = originX
                    if (origin != null && abs(x - origin) <= threshold * .35f) {
                        val since = releaseSince ?: now.also { releaseSince = it }
                        if (now - since >= 220L) {
                            locked = false
                            releaseSince = null
                            originX = x
                            originAt = now
                        }
                    } else {
                        releaseSince = null
                    }
                    return null
                }
                val origin = originX
                if (origin == null) {
                    originX = x
                    originAt = now
                    return null
                }
                if (now - originAt < 120L) return null
                if (now - originAt > 900L) {
                    originX = x
                    originAt = now
                    return null
                }
                val dx = x - origin
                if (abs(dx) < threshold) return null
                locked = true
                return if (dx > 0f) Direction.RIGHT else Direction.LEFT
            }
        }
