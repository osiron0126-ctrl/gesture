                              main.postAtTime({ finish(Result.success(Unit)) }, timeoutToken, android.os.SystemClock.uptimeMillis() + WRITE_NR_SETTLE_MS)
                          }
                      }
          
                      override fun onCharacteristicWrite(
                          gatt: BluetoothGatt,
                          characteristic: BluetoothGattCharacteristic,
                          status: Int
                      ) {
                          if (finished.get()) return
                          if (status == BluetoothGatt.GATT_SUCCESS) finish(Result.success(Unit))
                          else finish(Result.failure(IllegalStateException("BLE write 실패 status=$status")))
                      }
                  }
          
