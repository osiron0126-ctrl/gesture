                          } else null
                          State.DRAGGING -> RightHandAction.DragEnd
                          State.IDLE -> null
                      }
                      clear()
                      return action
                  }

                  // MediaPipe can lose the hand centre for one or two frames while the
                  // stabilized pinch is still valid. Do not mistake that for a release.
                  if (point == null) {
                      if (state == State.IDLE) return null
                      val since = missingSince ?: now.also { missingSince = it }
                      if (now - since < LANDMARK_DROPOUT_MS) return null
                      val action = if (state == State.DRAGGING) RightHandAction.DragEnd else null
                      clear()
                      return action
                  }
                  missingSince = null

                  val filtered = smooth(point)
                  if (state == State.IDLE) {
                      state = State.TRACKING
                      startedAt = now
                      startPoint = filtered
                      rawStartPoint = point
                      lastDragPoint = filtered
