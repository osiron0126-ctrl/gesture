                      return action
                  }
                  missingSince = null

                  // `pinching` is already stabilized. With landmarks present, false is a real
                  // observed release and can safely complete a click/drag.
                  if (!pinching) {
                      if (state == State.IDLE) return null
                      val action = when (state) {
