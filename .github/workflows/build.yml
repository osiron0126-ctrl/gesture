                          if (now - since >= RELEASE_GRACE_MS) reset()
                      } else {
                          candidateSince = null
                      }
                      return stable
                  }

                  if (stable) {
                      if (ratio <= EXIT_RATIO) {
                          releaseSince = null
                      } else {
                          val since = releaseSince ?: now.also { releaseSince = it }
                          if (now - since >= RELEASE_GRACE_MS) reset()
                      }
                      return stable
                  }

                  releaseSince = null
                  if (ratio <= ENTER_RATIO) {
                      val since = candidateSince ?: now.also { candidateSince = it }
                      if (now - since >= ENTER_CONFIRM_MS) {
                          stable = true
                          candidateSince = null
                      }
                  } else {
                      candidateSince = null
                  }
                  return stable
              }
