                  fun point(i: Int) = ShapePoint(p[i].first * width, p[i].second * height)
                  val palmWidth = distance(point(5), point(17)).coerceAtLeast(12f)
          
                  smoothClosedBlob(partPath, intArrayOf(0, 1, 2, 5, 9, 13, 17).map(::point))
                  handPath.rewind()
                  handPath.set(partPath)
                  val chains = arrayOf(
                      intArrayOf(1, 2, 3, 4), intArrayOf(5, 6, 7, 8), intArrayOf(9, 10, 11, 12),
                      intArrayOf(13, 14, 15, 16), intArrayOf(17, 18, 19, 20)
                  )
                  for ((finger, chain) in chains.withIndex()) {
                      val scale = if (finger == 0) 1.05f else 1f
                      smoothFingerRibbon(partPath, chain.map(::point), floatArrayOf(.135f, .118f, .096f, .068f).map { it * palmWidth * scale })
                      if (!handPath.op(partPath, Path.Op.UNION)) handPath.addPath(partPath)
