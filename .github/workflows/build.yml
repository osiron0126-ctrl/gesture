              private fun appendLog(message: String) {
                  eventLog += "${java.text.SimpleDateFormat("HH:mm:ss", Locale.US).format(java.util.Date())}  $message"
                  while (eventLog.size > 32) eventLog.removeAt(0)
                  if (::logText.isInitialized) logText.text = eventLog.asReversed().joinToString("\n")
              }
          
