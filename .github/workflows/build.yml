              }

              @Test fun oneEuroFilterDampsJitterAndStillFollowsFastMotion() {
                  val filter = OneEuroFilter()
                  val a = filter.filter(.500f, 0L)
                  val b = filter.filter(.504f, 40L)
                  val c = filter.filter(.497f, 80L)
                  val d = filter.filter(.503f, 120L)
                  assertTrue(kotlin.math.abs(b - a) < .004f)
                  assertTrue(kotlin.math.abs(c - .500f) < .004f)
                  assertTrue(kotlin.math.abs(d - .500f) < .004f)
                  val fast1 = filter.filter(.600f, 160L)
                  val fast2 = filter.filter(.700f, 200L)
                  assertTrue(fast1 > .53f)
                  assertTrue(fast2 > .62f)
              }

              @Test fun pointerAnchorsAtPinchButMovesWithIndexMcp() {
                  val engine = PinchInputEngine()
                  assertNull(engine.sample(0L, true, .50f to .50f, .40f to .50f))
                  // Fingertips curl/drift, but the knuckle stays still: pointer should remain anchored.
                  assertNull(engine.sample(80L, true, .57f to .58f, .40f to .50f))
                  val held = engine.currentPoint ?: error("missing current pointer")
                  assertTrue(kotlin.math.abs(held.first - .50f) < .01f)
                  assertTrue(kotlin.math.abs(held.second - .50f) < .01f)
                  // Move the knuckle right: pointer must follow that motion even if fingertip geometry changes.
                  val action = engine.sample(160L, true, .58f to .58f, .50f to .50f)
                  assertTrue(action is RightHandAction.DragStart)
                  assertTrue((engine.currentPoint?.first ?: 0f) > .53f)
              }

              @Test fun radialDeadZoneSuppressesOnlySubPixelVisualJitter() {
                  val dead = RadialDeadZone(1.5f)
                  val a = dead.filter(.5000f to .5000f, 2000, 1200)
                  val b = dead.filter(.5003f to .5003f, 2000, 1200) // < 1 px-ish
                  assertEquals(a.first, b.first, 0.000001f)
                  assertEquals(a.second, b.second, 0.000001f)
                  val c = dead.filter(.5020f to .5000f, 2000, 1200) // 4 px on X
                  assertTrue(c.first > a.first)
              }

              @Test fun dragMoveUpdatesAtFineMcpDisplacement() {
                  val engine = PinchInputEngine()
                  assertNull(engine.sample(0L, true, .50f to .50f, .40f to .50f))
                  val start = engine.sample(100L, true, .50f to .50f, .46f to .50f)
                  assertTrue(start is RightHandAction.DragStart)
                  // Once dragging, a sub-1%-screen movement should now be reportable.
                  val move = engine.sample(180L, true, .50f to .50f, .47f to .50f)
                  assertTrue(move is RightHandAction.DragMove)
              }

              @Test fun stableHoldRequiresStillnessAndFiresOnce() {
                  val e = StablePoseHoldEngine(900L, .05f, 160L)
                  assertFalse(e.sample(0L, listOf(.5f to .5f), true))
                  assertFalse(e.sample(500L, listOf(.51f to .5f), true))
                  assertTrue(e.sample(910L, listOf(.51f to .5f), true))
                  assertFalse(e.sample(1200L, listOf(.51f to .5f), true))
                  e.sample(1300L, emptyList(), false)
                  e.sample(1500L, emptyList(), false)
                  assertFalse(e.sample(1510L, listOf(.5f to .5f), true))
                  assertFalse(e.sample(1800L, listOf(.60f to .5f), true))
                  assertFalse(e.sample(2500L, listOf(.60f to .5f), true))
                  assertTrue(e.sample(2710L, listOf(.60f to .5f), true))
              }
          }
