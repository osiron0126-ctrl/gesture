              private fun classifyHands(result: HandLandmarkerResult): List<DetectedHand> {
                  val landmarks = result.landmarks()
                  val handedness = result.handedness()
                  val hands = landmarks.mapIndexed { index, rawPoints ->
                      val handLabel = handedness.getOrNull(index)?.firstOrNull()?.let(::categoryLabel)
                      DetectedHand(
                          points = rawPoints.map { landmark -> landmark.x() to landmark.y() },
                          gesture = null,
                          score = 0f,
                          handedness = handLabel
                      )
                  }
                  if (hands.isEmpty()) return emptyList()
                  if (hands.size == 1) {
                      val hand = hands.first()
                      if (hand.isRight || hand.isLeft) return rememberHands(hands)
                      val center = hand.palmCenter ?: return emptyList()
                      val rightDistance = lastRightPalm?.let { palmDistance(center, it) }
                      val leftDistance = lastLeftPalm?.let { palmDistance(center, it) }
                      val side = when {
                          rightDistance != null && (leftDistance == null || rightDistance < leftDistance) -> "Right"
                          leftDistance != null -> "Left"
                          center.first < .5f -> "Right"
                          else -> "Left"
                      }
                      return rememberHands(listOf(hand.copy(handedness = side)))
                  }
                  val hasRight = hands.any { it.isRight }
                  val hasLeft = hands.any { it.isLeft }
                  if (hasRight && hasLeft) return rememberHands(hands)
          
                  if (hands.count { it.isRight } == 1 && !hasLeft) {
                      return rememberHands(hands.map { if (it.isRight) it else it.copy(handedness = "Left") })
                  }
                  if (hands.count { it.isLeft } == 1 && !hasRight) {
                      return rememberHands(hands.map { if (it.isLeft) it else it.copy(handedness = "Right") })
                  }
          
                  val first = hands[0]
                  val second = hands[1]
                  val firstCenter = first.palmCenter
                  val secondCenter = second.palmCenter
                  val resolved = if (firstCenter != null && secondCenter != null &&
                      lastRightPalm != null && lastLeftPalm != null
                  ) {
                      val directCost = palmDistance(firstCenter, lastRightPalm!!) + palmDistance(secondCenter, lastLeftPalm!!)
                      val crossedCost = palmDistance(firstCenter, lastLeftPalm!!) + palmDistance(secondCenter, lastRightPalm!!)
                      if (directCost <= crossedCost) {
                          listOf(first.copy(handedness = "Right"), second.copy(handedness = "Left"))
                      } else {
                          listOf(first.copy(handedness = "Left"), second.copy(handedness = "Right"))
                      }
                  } else {
                      hands.sortedBy { it.palmCenter?.first ?: .5f }.mapIndexed { index, hand ->
                          hand.copy(handedness = if (index == 0) "Right" else "Left")
                      }
                  }
                  return rememberHands(resolved)
              }
          
              private fun rememberHands(hands: List<DetectedHand>): List<DetectedHand> {
                  hands.firstOrNull { it.isRight }?.palmCenter?.let { lastRightPalm = it }
                  hands.firstOrNull { it.isLeft }?.palmCenter?.let { lastLeftPalm = it }
                  val resolved = if (getSharedPreferences("settings", MODE_PRIVATE)
                          .getBoolean("swapHands", false)
                  ) {
                      hands.map { hand ->
                          when {
                              hand.isRight -> hand.copy(handedness = "Left")
                              hand.isLeft -> hand.copy(handedness = "Right")
                              else -> hand
                          }
                      }
                  } else hands
                  return resolved
              }
          
              private fun palmDistance(a: Pair<Float, Float>, b: Pair<Float, Float>): Float {
                  return kotlin.math.hypot(
                      (a.first - b.first).toDouble(),
                      (a.second - b.second).toDouble()
                  ).toFloat()
              }
          
              private fun categoryLabel(category: Category): String? {
                  val label = category.categoryName().ifBlank { category.displayName() }
                  return normalizeMirroredHandedness(label)
