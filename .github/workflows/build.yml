              private fun adjustMediaVolume(steps: Int): String {
                  return try {
                      val audio = getSystemService(AudioManager::class.java)
                      val direction = if (steps > 0) AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER
                      repeat(kotlin.math.abs(steps)) {
                          audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, direction, 0)
                      }
                      val level = audio.getStreamVolume(AudioManager.STREAM_MUSIC)
                      val maximum = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC).coerceAtLeast(1)
