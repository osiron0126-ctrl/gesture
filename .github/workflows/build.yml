                  val pointerPose = indexPinch && !middlePinch
                  val volumePose = middlePinch && !indexPinch
          
                  return when (mode) {
                      Mode.IDLE -> when {
                          pointerPose && indexPoint != null -> {
                              mode = Mode.POINTER
                              pointer.sample(now, true, indexPoint)
                          }
                          volumePose && middlePoint != null -> {
                              mode = Mode.VOLUME
                              volume.sample(now, true, middlePoint)
